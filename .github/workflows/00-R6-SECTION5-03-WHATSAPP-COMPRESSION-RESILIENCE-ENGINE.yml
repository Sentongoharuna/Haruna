      - name: S5.03 measured quality and visible feature gate
        shell: bash
        run: |
          set -euo pipefail
          E="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaS503WhatsAppEngine.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          M="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt"

          python3 - "$E" "$C" "$M" app/build.gradle.kts <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          engine, camera, profiles, gradle = (Path(path).read_text() for path in sys.argv[1:])

          for token in (
              'ENGINE_ID = "R6-S5.03-WHATSAPP-COMPRESSION-RESILIENCE"',
              "TARGET_FPS = 30",
              "CAPTURE_FHD_BITRATE_BPS = 24_000_000",
              "DELIVERY_BITRATE_BPS = 18_000_000",
              "DELIVERY_AUDIO_BITRATE_BPS = 192_000",
              "DELIVERY_WIDTH = 1080",
              "DELIVERY_HEIGHT = 1920",
              "DELIVERY_IFRAME_SECONDS = 2f",
              "Quality.FHD, Quality.HD, Quality.SD, Quality.UHD",
              "MediaFormat.MIMETYPE_VIDEO_AVC",
              "DynamicRange.SDR",
              "NOISE_REDUCTION_MODE_HIGH_QUALITY",
              "CONTROL_AE_ANTIBANDING_MODE_AUTO",
              "Contrast(CAPTURE_CONTRAST)",
              "HslAdjustment.Builder()",
              "fun deliveryEffects(): List<Effect>",
              "fun advanceAfterFailure",
              "WA UNIVERSAL SAFE",
              "never make a low-grade phone fail",
          ):
              assert token in engine, "S5.03 engine token: " + token
          assert "RgbAdjustment" not in engine, "Status adds synthetic channel shaping"
          assert "Sharpen" not in engine and "Unsharp" not in engine

          for token in (
              'isStatusCamera() && captureModes[captureModeIndex] != "PHOTO"',
              "DevelopUgandaS503WhatsAppEngine.configurePreview(",
              "DevelopUgandaS503WhatsAppEngine.configureRecorder(",
              "DevelopUgandaS503WhatsAppEngine.configureVideo(",
              "DevelopUgandaS503WhatsAppEngine.createEffect(",
              "DevelopUgandaS503WhatsAppEngine.applyRuntimeControls(",
              "DevelopUgandaS503WhatsAppEngine.deliveryEffects()",
              "DevelopUgandaS503WhatsAppEngine.CAPTURE_FHD_BITRATE_BPS",
              "DevelopUgandaS503WhatsAppEngine.qualityOrder()",
              "verifyS503WhatsAppTracks(temp, durationMs)",
              "MediaFormat.MIMETYPE_VIDEO_AVC",
              "MediaExtractor.SAMPLE_FLAG_SYNC",
              "S5.03 WA • LOW-NOISE DETAIL • NO GRAIN • CLEAN SAFE",
          ):
              assert token in camera, "Status integration token: " + token

          assert camera.count("DevelopUgandaS503WhatsAppEngine.configureRecorder(") == 1
          assert camera.count("DevelopUgandaS503WhatsAppEngine.configureVideo(") == 1
          assert camera.count("DevelopUgandaS503WhatsAppEngine.createEffect(") == 1
          assert camera.count("DevelopUgandaS503WhatsAppEngine.applyRuntimeControls(") == 1

          start = profiles.index("    val status =")
          end = profiles.index("    val interview =", start)
          status = profiles[start:end]
          for token in (
              'instruction = "CLEAN MASTER + S5.03 WHATSAPP COMPRESSION-RESILIENT COPY"',
              'qualityName = "WA RESILIENT FHD"',
              "frameRate = 30",
              "targetBitrateBps = DevelopUgandaS503WhatsAppEngine.DELIVERY_BITRATE_BPS",
          ):
              assert token in status, "visible Status profile: " + token

          protected_sections = (
              ("    val main =", "    val live =", "22f8e9739aaf8d864aa2110c05ab49608e0e895a83ae404af5c02e3e0cde9ecd"),
              ("    val live =", "    val tikTok =", "19f53380c769a3ac12ae51a0d9d1b860e9d76a052d45c1a428b6db6a5c001ab7"),
              ("    val tikTok =", "    val status =", "6549da459d930a68feef2cffa76bd08d4692e878a98aa800bd5c5c3fc7f77db7"),
              ("    val interview =", "    private val navigatorOrder", "92f772224b0a2f9eeb0be28a9994154e6fd0120e7d96eeb0ee972bc5b9fd18b0"),
          )
          for first, last, expected in protected_sections:
              section = profiles[profiles.index(first):profiles.index(last, profiles.index(first) + 1)]
              assert hashlib.sha256(section.encode()).hexdigest() == expected, first

          assert "versionCode = 28703" in gradle
          assert 'versionName = "287.03-r6-section5-03-whatsapp-compression-resilience"' in gradle
          print("S5.03 STATUS-ONLY MEASURED COMPRESSION RESILIENCE • PASS")
          PY

