name: FIVEMODS 13 - Actual Camera UI Repair APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual Android camera UI and assert changes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_ui.py
          python3 /tmp/patch_ui.py
          git diff --check
          git diff -- app/src/main/java/com/sentongoharuna/pulse/MainActivity.kt > /tmp/ui-diff.patch
          test -s /tmp/ui-diff.patch
          grep -q 'Color.TRANSPARENT' app/src/main/java/com/sentongoharuna/pulse/MainActivity.kt
          grep -q 'action.addView(recordButton, LinearLayout.LayoutParams(dp(112), dp(64)))' app/src/main/java/com/sentongoharuna/pulse/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify source contracts
        run: python3 ci/verify_source_contracts.py
      - name: Build and unit test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload UI diff for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-13-ACTUAL-UI-CHANGES
          path: /tmp/ui-diff.patch
          if-no-files-found: warn
      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-13-RECORD-ONLY-TRANSPARENT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
