          repairs = [
              (
                  Path(
                      "source/app/src/main/java/com/sentongoharuna/pulse/"
                      "DevelopUgandaInterviewAnnotatedExporter.kt"
                  ),
                  "val interviewOverlays =\n            mutableListOf(",
                  "val interviewOverlays: MutableList<TextureOverlay> =\n            mutableListOf(",
              ),
              (
                  Path(
                      "source/app/src/main/java/com/sentongoharuna/pulse/"
                      "DevelopUgandaVideoTagExporter.kt"
                  ),
                  "val overlays =\n            mutableListOf(",
                  "val overlays: MutableList<TextureOverlay> =\n            mutableListOf(",
              ),
          ]
