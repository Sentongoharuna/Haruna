      - name: Verify repair content and protected contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          import hashlib
          import json
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path("source")
          baseline = Path("presentation-repair-audit/restored-build-a")
          audit = Path("presentation-repair-audit")
          package = Path("app/src/main/java/com/sentongoharuna/pulse")

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def read(root, relative):
              path = root / relative
              require(path.is_file(), f"Missing required file: {path}")
              return path.read_text(encoding="utf-8")

          required_f8 = [
              "DevelopUgandaCameraModeNavigator.kt",
              "DevelopUgandaCreatorModeFace.kt",
              "DevelopUgandaFiveModesDiagnostics.kt",
              "DevelopUgandaFiveModesPassportPanel.kt",
              "DevelopUgandaFiveModesReviewPanel.kt",
              "DevelopUgandaFivemods7Mp4FastStart.kt",
              "DevelopUgandaFivemods7Settings.kt",
              "DevelopUgandaInterviewAnnotatedExporter.kt",
              "DevelopUgandaInterviewHudView.kt",
              "DevelopUgandaInterviewObservationEngine.kt",
              "DevelopUgandaModeProfiles.kt",
              "DevelopUgandaStatusReviewActivity.kt",
              "DevelopUgandaV28012ProWorkflowConsole.kt",
              "DevelopUgandaVideoBrandSettings.kt",
              "DevelopUgandaVideoBrandSettingsPanel.kt",
              "DevelopUgandaVideoTagExporter.kt",
              "DevelopUgandaVideoTagSettings.kt",
          ]
          for name in required_f8:
              require((source / package / name).is_file(), f"Restored F8 feature file absent: {name}")

          manifest = read(source, Path("app/src/main/AndroidManifest.xml"))
          require(".DevelopUgandaStatusReviewActivity" in manifest, "Status Review manifest registration absent")

          profiles = read(source, package / "DevelopUgandaModeProfiles.kt")
          expected_order = ["main", "live", "tikTok", "status", "interview"]
          positions = [profiles.index(f"val {name} = DevelopUgandaModeProfile(") for name in expected_order]
          require(positions == sorted(positions), "Mode profile navigator order is wrong")
          require("private val navigatorOrder = listOf(main, live, tikTok, status, interview)" in profiles, "Five-mode source of truth absent")
          require("fun all(): List<DevelopUgandaModeProfile> = navigatorOrder" in profiles, "ModeProfiles.all() absent")
          require(profiles.count("profileData = DevelopUgandaModeDataAvailability.ABSENT") == 2, "MAIN/LIVE must be explicitly ABSENT")
          require(profiles.count("accentColor = DevelopUgandaFivemods8Theme.accent") == 5, "Capture/burn-in accent semantics changed")
          for token in ("modeMain", "modeLive", "modeTikTok", "modeStatus", "modeInterview"):
              require(f"chromeAccentColor = DevelopUgandaFivemods8Theme.{token}" in profiles, f"Missing chrome accent: {token}")

          camera_rel = package / "DevelopUgandaCameraActivity.kt"
          camera = read(source, camera_rel)
          camera_base = read(baseline, camera_rel)
          require(camera.replace("chromeAccentColor", "accentColor") == camera_base, "CameraActivity changed outside approved chrome-accent references")
          scrims = lambda text: Counter(re.findall(r"DevelopUgandaFivemods8Theme\.surfaceScrim\((\d+)\)", text))
          require(scrims(camera) == scrims(camera_base), "CameraActivity viewfinder scrim calls changed")
          require(camera.count("surfaceScrim(38)") == camera_base.count("surfaceScrim(38)"), "surfaceScrim(38) changed")
          require(camera.count("surfaceScrim(66)") == camera_base.count("surfaceScrim(66)"), "surfaceScrim(66) changed")
          require(camera.count("surfaceScrim(82)") == camera_base.count("surfaceScrim(82)"), "surfaceScrim(82) changed")
          require("du_viewfinder_indicator_backing" not in camera, "Live preview was routed through the opaque backing token")

          live_rel = package / "DevelopUgandaLiveActivity.kt"
          live = read(source, live_rel)
          require(
              live.replace(
                  "DevelopUgandaModeProfiles.live.chromeAccentColor",
                  "DevelopUgandaFivemods8Theme.accent",
              ) == read(baseline, live_rel),
              "LiveActivity changed outside its chrome accent",
          )

          protected_equal = [
              "DevelopUgandaInterviewAnnotatedExporter.kt",
              "DevelopUgandaVideoTagExporter.kt",
              "DevelopUgandaBrandMetadataStore.kt",
              "DevelopUgandaVideoBrandSettings.kt",
              "DevelopUgandaVideoBrandSettingsPanel.kt",
              "DevelopUgandaVideoTagSettings.kt",
              "DevelopUgandaFivemods7Mp4FastStart.kt",
          ]
          for name in protected_equal:
              relative = package / name
              require((source / relative).read_bytes() == (baseline / relative).read_bytes(), f"Protected encode/export/provenance file changed: {name}")

          expected_stages = {
              "DevelopUgandaV278LiveWorkflow.kt": 'val stages = listOf("READY", "LIGHT", "SOUND", "FRAME", "MOTION", "RECORD", "SAFETY", "REVIEW")',
              "DevelopUgandaV279ActiveShooting.kt": 'val stages = listOf("READY", "LIGHT", "SOUND", "FRAME", "TRACK", "RECORD", "PROTECT", "RATE")',
              "DevelopUgandaV280SmartDirector.kt": 'val stages = listOf("PLAN", "FRAME", "TRACK", "RECORD", "RATE", "NEXT SHOT")',
              "DevelopUgandaGeneralHubActivity.kt": 'val stages = listOf("PREPARE", "SOUND", "LIGHT", "CONTINUITY", "FRAME", "REHEARSE", "FOCUS", "RECORD", "VERIFY", "REVIEW", "ORGANIZE", "DELIVER")',
          }
          for name, declaration in expected_stages.items():
              require(declaration in read(source, package / name), f"Task 9 stage list changed before approval: {name}")
          console = read(source, package / "DevelopUgandaV28012ProWorkflowConsole.kt")
          for declaration in (
              "const val STAGE_PREPARE = 1", "const val STAGE_SHOOT = 2",
              "const val STAGE_DIRECT = 3", "const val STAGE_REVIEW = 4",
              "const val STAGE_DELIVER = 5",
          ):
              require(declaration in console, f"Task 9 console stage changed: {declaration}")
          require("readiness = 70" not in console, "Synthetic snapshot readiness remains")
          require("throw SnapshotUnavailableException(error)" in console, "Snapshot failure is still fabricated")

          hub = read(source, package / "DevelopUgandaGeneralHubActivity.kt")
          require('"STATUS • UNKNOWN • READ FAILED"' in hub, "Route failure is not visibly unknown")
          require("DevelopUgandaModeProfiles.all().forEach" in hub, "SHOOT routes are not profile-driven")
          require("v267OpenSelectedMode()" in hub, "Selected-mode routing helper absent")
          require("fun routeCard(\n        profile: DevelopUgandaModeProfile" in hub, "ModeProfile route-card overload absent")
          require("showUiFault(fault)" in hub, "Failed panels do not surface markers")
          require("1600L else 3200L" in hub, "Existing hub refresh cadence changed")

          newsroom = read(source, package / "DevelopUgandaNewsroomActivity.kt")
          require(newsroom.count("DevelopUgandaModeProfiles.all()") >= 6, "Newsroom five-mode sections are not profile-driven")
          require("_LIVE_" not in newsroom, "Filename-based REPORT/LIVE guessing remains")
          require('"MEDIA LIBRARY UNAVAILABLE"' in newsroom and '"NO RECENT CLIPS"' in newsroom, "MediaStore failure and empty gallery are not distinct")
          require('profile?.shortName ?: "MODE UNKNOWN"' in newsroom, "Unknown recorded mode is guessed")

          vault = read(source, package / "DevelopUgandaV274MediaVault.kt")
          require("val mode: DevelopUgandaCameraPage? = null" in vault, "Old/new unknown clip modes are guessed")
          require('put("mode", c.mode?.name ?: JSONObject.NULL)' in vault, "Clip mode enum is not persisted")
          require("fun lastClipForMode" in vault, "Per-mode last take lookup absent")

          guard = read(source, package / "DevelopUgandaV28012RuntimeGuard.kt")
          require("private const val MAX_UI_FAULTS = 20" in guard, "UI fault ring is not capped at 20")
          require("retained.forEach" in guard and "UI FAULTS (newest last" in guard, "UI fault ring/report absent")

          theme_path = source / "app/src/main/res/values/develop_uganda_theme.xml"
          ET.parse(theme_path)
          theme = theme_path.read_text(encoding="utf-8")
          for name in ("du_mode_main", "du_mode_live", "du_mode_tiktok", "du_mode_status", "du_mode_interview", "du_type_11", "du_type_13", "du_type_16", "du_type_22", "du_type_40", "du_spacing_unit", "du_touch_minimum", "du_radius", "du_motion_fast_out_slow_in"):
              require(f'name="{name}"' in theme, f"Presentation token absent: {name}")
          require("EXCLUSION — do not route recorded-image or creative-look values" in theme, "Theme exclusion was removed")

          readout = read(source, package / "DevelopUgandaLiveReadout.kt")
          for marker in ("DevelopUgandaRollingMetricBuffer", "60_000L", "DevelopUgandaMetricTrendView", "DevelopUgandaMotionLevel", "OFF", "STANDARD", "FULL", "DevelopUgandaStatusMotion"):
              require(marker in readout, f"Reusable readout/motion contract absent: {marker}")
          require("Handler(" not in readout and "postDelayed(" not in readout, "Reusable readouts added a new timer")
          interview = read(source, package / "DevelopUgandaInterviewHudView.kt")
          require("DevelopUgandaRollingMetricBuffer" in interview, "Interview trend was not generalized")
          require("Observed physical signals only. Not an indicator of truthfulness." in interview, "Interview disclaimer changed")

          app_build = read(source, Path("app/build.gradle.kts"))
          require("versionCode = 28192" in app_build and 'versionName = "281.9-five-mode-presentation-repair"' in app_build, "Presentation repair version is wrong")

          reasons = {
              "app/build.gradle.kts": "Identifies this presentation repair build without changing SDK or dependencies.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt": "Uses mode chrome accents only in existing headers/strips; capture, scrims and burn-in accents remain unchanged.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt": "Reads the single five-mode route registry and remembers the selected route.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFiveModesDiagnostics.kt": "Reads mode labels from ModeProfiles instead of duplicating them.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods8Theme.kt": "Exposes the dormant type, spacing, touch, radius, motion and chrome-only mode tokens.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt": "Repairs truthful state, visible faults, selected-mode routes, tokenized chrome and live readout sheets.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewHudView.kt": "Reuses the rolling metric component and makes existing real audio/channel values inspectable.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt": "Applies the LIVE chrome accent to its existing header/badge only.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveReadout.kt": "Adds the one reusable timer-free history/readout/motion component and legacy preference migration.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt": "Becomes the five-mode source of truth with honest ABSENT data for MAIN/LIVE.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt": "Reflows navigation/actions for five modes and separates unknown metadata from gallery failure/empty state.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV242QualityMatchPro.kt": "Routes legacy workflow-motion controls through the unified OFF/STANDARD/FULL setting.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV272FieldSoundContinuity.kt": "Reports audio input read failure as unknown instead of device-managed.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV274MediaVault.kt": "Persists an optional camera-mode enum and supports honest per-mode last-take lookup.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV275ControlSurface.kt": "Applies presentation/touch tokens and exposes the unified motion-level control.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV278LiveWorkflow.kt": "Removes plausible read fallbacks and surfaces unknown workflow telemetry.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV279ActiveShooting.kt": "Propagates unknown readiness/clip/light/audio state instead of synthetic scores or zeroes.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28012ProWorkflowConsole.kt": "Fails snapshots honestly and exposes measured raw thermal state.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28012RuntimeGuard.kt": "Stores the last 20 UI faults and includes them in the full runtime report.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28013StableMasterRefinement.kt": "Prevents missing telemetry from becoming a READY production state.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28018LiveOperatorIntelligence.kt": "Displays unknown battery/storage/readiness without formatting them as real values.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28019FieldReliability.kt": "Stops failed telemetry from producing a plausible field-QA score.",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV280SmartDirector.kt": "Renames director presets away from camera-mode terminology and makes clip reads fail visibly.",
              "app/src/main/res/values/develop_uganda_theme.xml": "Activates shared presentation tokens and adds five chrome-only mode accents while retaining exclusions.",
          }
          all_paths = set()
          for root in (baseline, source):
              all_paths.update(p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file() and "/build/" not in p.as_posix())
          changed = set()
          rows = []
          hashes = {}
          for path in sorted(all_paths):
              before_path = baseline / path
              after_path = source / path
              before = before_path.read_bytes() if before_path.is_file() else None
              after = after_path.read_bytes() if after_path.is_file() else None
              if after is not None:
                  hashes[path] = hashlib.sha256(after).hexdigest()
              if before is None:
                  state = "new"
              elif after is None:
                  state = "removed"
              elif before == after:
                  state = "untouched"
              else:
                  state = "edited"
              if state != "untouched":
                  changed.add(path)
              reason = reasons.get(path, "Byte-for-byte unchanged from restored Build A.")
              rows.append(f"| `{path}` | {state} | {reason} |")
          require(changed == set(reasons), "Changed-file inventory differs from the reviewed repair: " + repr(sorted(changed ^ set(reasons))))
          require("removed" not in {row.split(" | ")[1] for row in rows}, "Repair removed a source file")

          report = (
              "# Five Mode Presentation Repair — verification\n\n"
              "Source/content verification: **PASS**. APK compilation is recorded separately after Gradle succeeds.\n\n"
              "| File | State | Reason |\n"
              "| --- | --- | --- |\n"
              + "\n".join(rows)
              + "\n"
          )
          (audit / "FILE-BY-FILE.md").write_text(report, encoding="utf-8")
          verification = {
              "source_verification": "PASS",
              "apk_build": "pending",
              "restored_f8_features": len(required_f8),
              "mode_order": [name.upper() for name in expected_order],
              "changed_files": sorted(changed),
              "protected_export_files": protected_equal,
              "camera_change_scope": "chromeAccentColor references only",
              "scrim_counts": dict(sorted(scrims(camera).items())),
              "task_9_stage_lists": "UNCHANGED — awaiting operator decision",
              "final_source_sha256": hashes,
          }
          (audit / "verification.json").write_text(json.dumps(verification, indent=2) + "\n", encoding="utf-8")
          print("PRESENTATION REPAIR SOURCE VERIFICATION PASSED")
          PY

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify, name and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          apk="source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk" || { echo "::error::Presentation repair APK is missing or empty"; exit 1; }
          unzip -tq "$apk"
          mkdir -p presentation-repair-output
          output="presentation-repair-output/Develop-Uganda-Five-Mode-Presentation-Repair-v28192.apk"
          cp "$apk" "$output"
          sha256sum "$output" | tee presentation-repair-output/SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          apk = Path("presentation-repair-output/Develop-Uganda-Five-Mode-Presentation-Repair-v28192.apk")
          report = Path("presentation-repair-audit/verification.json")
          value = json.loads(report.read_text(encoding="utf-8"))
          if value.get("source_verification") != "PASS":
              raise SystemExit("Source verification did not pass")
          value["apk_build"] = "PASS"
          value["apk_sha256"] = hashlib.sha256(apk.read_bytes()).hexdigest()
          value["phone_runtime_test"] = "awaiting operator install; not claimed"
          report.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload five-mode presentation repair APK
        uses: actions/upload-artifact@v4
        with:
          name: Develop-Uganda-Five-Mode-Presentation-Repair-v28192
          path: |
            presentation-repair-output/Develop-Uganda-Five-Mode-Presentation-Repair-v28192.apk
            presentation-repair-output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload verification and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Develop-Uganda-Five-Mode-Presentation-Repair-v28192-verification
          path: |
            failure-evidence/runner.txt
            build-a-audit/provenance.json
            presentation-repair-audit/provenance.json
            presentation-repair-audit/verification.json
            presentation-repair-audit/FILE-BY-FILE.md
            presentation-repair-audit/presentation-repair.patch
          if-no-files-found: warn
