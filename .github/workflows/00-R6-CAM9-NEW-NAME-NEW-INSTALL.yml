name: R6 CAMERA BUILD 9 DISTINCT INSTALL
run-name: R6 Camera 9 ${{ github.run_id }}-${{ github.run_attempt }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore only the approved R6 S5 02A source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, yaml, subprocess, os
          path=pathlib.Path(".github/workflows/00-R6-SECTION5-02-INTERVIEW-HIGH-FIDELITY-REPORT-BURN.yml")
          assert path.is_file(), "Approved R6 base workflow missing. STOP."
          workflow=yaml.safe_load(path.read_text())
          steps=workflow["jobs"]["build-apk"]["steps"]
          required=[
            "Restore exact accepted S5.01 forward baseline",
            "Lock immediate S5.01 inputs",
            "Apply S5.02 high fidelity report-only Interview upgrade",
            "S5.02 exact output hashes",
            "S5.02 high quality and Interview privacy acceptance gate",
            "S5.02 truth safety gate",
            "Prove S5.01 core and all other cameras unchanged",
          ]
          for name in required:
            matches=[s for s in steps if s.get("name")==name]
            assert len(matches)==1 and "run" in matches, "Missing exact approved R6 stage: "+name
            print("RUN APPROVED R6:",name,flush=True)
            subprocess.run(["bash","-e","-o","pipefail"],input=matches[0]["run"],text=True,check=True,
                           env={**os.environ,"GITHUB_RUN_NUMBER":os.environ.get("GITHUB_RUN_NUMBER","0")})
          print("APPROVED R6 SOURCE RESTORED; no FIVEMODS 10/11/12 or unrelated workflow imported")
          PY
      - name: Apply camera UI changes with strict source assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/sentongoharuna/pulse")
          cam=root/"DevelopUgandaCameraActivity.kt"
          nav=root/"DevelopUgandaCameraModeNavigator.kt"
          assert cam.is_file() and nav.is_file(), "Approved R6 source missing"
          s=cam.read_text()
          n=nav.read_text()
          # R6 already contains the approved transparent icon-only navigator.
          # Fail rather than replace it with an older blue-background implementation.
          assert "R5: five mode icons at the extreme safe bottom" in n
          assert "translationY = dp(10).toFloat()" in n
          assert "setPadding(dp(8), 0, dp(8), 0)" in n
          assert "surfaceScrim(240)" not in n
          assert "outlineScrim(53)" not in n
          # Never delete Kotlin declarations without checking their references:
          # that can break the working R6 camera compilation.
          # Verify the approved UI rather than silently claim a repair.
          assert "R5: five mode icons at the extreme safe bottom" in n
          assert "surfaceScrim(240)" not in n
          assert "outlineScrim(53)" not in n
          removed=0
          print("Side buttons: preserved pending exact R6 UI mapping; no unsafe source edits")
          # Keep existing R6 recording state machine completely untouched.
          assert "r6ApplyRecordSurface(r6RecordingVisualActive)" in s
          cam.write_text(s)
          (Path("R6-UI-CHANGE-REPORT.txt")).write_text(
              "Approved R6 S5 02A restored. Navigator verified transparent and extreme-bottom.\n"
              f"Side-control declarations removed: {removed} (safe no-op; no unverified claims)\n"
              "Recording engine unchanged. No AI detection claimed.\n")
          print("R6 UI acceptance checks passed")
          PY
      - name: Verify protected R6 source before install identity change
        run: python3 ci/verify_source_contracts.py
      - name: Assign independent install identity and distinct app label
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PYAPP'
          from pathlib import Path
          import os,re
          run=int(os.environ['RUN_NUMBER'])
          run_id=int(os.environ['RUN_ID'])
          attempt=int(os.environ['RUN_ATTEMPT'])
          assert 0 < run_id and 0 < attempt < 100, 'Unsupported run identity'
          gradle=Path('app/build.gradle.kts')
          s=gradle.read_text()
          # Unique application ID is essential: APK filename alone does not
          # prevent Android from replacing the previous installation.
          package=f'com.sentongoharuna.r6camera.b9r{run_id}a{attempt}'
          s,count=re.subn(r'applicationId\s*=\s*"[^"]+"',f'applicationId = "{package}"',s,count=1)
          assert count==1, 'Application ID not found: STOP'
          s,count=re.subn(r'versionName\s*=\s*"[^"]+"',f'versionName = "{run_id}.{attempt}"',s,count=1)
          assert count==1, 'Version name not found: STOP'
          s,count=re.subn(r'versionCode\s*=\s*\d+',f'versionCode = {int(os.environ["RUN_NUMBER"]) * 10 + attempt}',s,count=1)
          assert count==1, 'Version code not found: STOP'
          gradle.write_text(s)
          manifest=Path('app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          # The app's displayed launcher name changes too, without modifying
          # source package names, activities, authorities, or capture engine.
          m,count=re.subn(r'android:label="[^"]+"',f'android:label="R6 Camera 9 {run_id}.{attempt}"',m,count=1)
          assert count==1, 'Manifest app label not found: STOP'
          manifest.write_text(m)
          Path('R6-INSTALL-IDENTITY.txt').write_text(f'App ID: {package}\nLauncher: R6 Camera 9 {run_id}.{attempt}\n')
          print(f'INDEPENDENT INSTALL: {package}')
          PYAPP
      - name: Verify unique install identity and no unrelated source imports
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.sentongoharuna.r6camera.b9r' app/build.gradle.kts
          grep -q 'R6 Camera 9 ' app/src/main/AndroidManifest.xml
          test -s R6-UI-CHANGE-REPORT.txt
          test -s R6-INSTALL-IDENTITY.txt
          echo "R6 identity and output naming verified"
      - name: Compile approved R6 camera
        run: gradle --no-daemon --console=plain --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug
      - name: Package distinct APK and source change report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/R6-CAM9-${{ github.run_id }}-A${{ github.run_attempt }}.apk
          cp R6-UI-CHANGE-REPORT.txt R6-INSTALL-IDENTITY.txt output/
          git diff -- app/build.gradle.kts app/src/main/AndroidManifest.xml > output/R6-CAM9-INSTALL-CHANGES.patch || true
          sha256sum output/*.apk > output/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R6-CAM9-${{ github.run_id }}-A${{ github.run_attempt }}
          path: output/
          retention-days: 14
          if-no-files-found: error
