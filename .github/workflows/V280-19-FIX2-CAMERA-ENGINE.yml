          test -f v172-source/settings.gradle.kts
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt
          test -f v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraSession.java
          test -f v172-source/V280-19-FIX2-CAMERA-ENGINE-AUDIT.txt

      - name: Audit camera-engine source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path("v172-source/app/src/main/java/com/sentongoharuna/pulse")
          activity = (src / "DevelopUgandaCameraActivity.kt").read_text()
          safety = (src / "DevelopUgandaV276RecordingSafety.kt").read_text()
          session = (src / "DevelopUgandaCameraSession.java").read_text()
          requirements = {
              "one direct CameraX stop owner": activity.count("recording?.stop()") == 1,
              "serialized recording token": "cameraSession.begin()" in activity and "cameraSession.finish(token)" in activity,
              "verification stays off UI thread": "DevelopUgandaCameraEngineIO.executor.execute" in activity,
              "live CameraX audio stats": "event.recordingStats.audioStats" in activity,
              "explicit microphone failures": all(k in activity for k in ["MIC MUTED", "MIC SILENCED", "MIC ERROR"]),
              "latest focus result only": "cameraFocusRequests.isCurrent(token)" in activity,
              "lens-supported metering": "isFocusMeteringSupported" in activity,
              "real exposure-range mapping": "exposureCompensationRange.lower + it" in activity,
              "partial-finalize review state": "PARTIAL CLIP PRESENT • REVIEW REQUIRED" in safety,
              "session state implementation": all(k in session for k in ["STARTING", "STOPPING", "VERIFYING"]),
          }
          failed = [name for name, ok in requirements.items() if not ok]
          if failed:
              raise SystemExit("FAIL: " + "; ".join(failed))
          print("PASS: camera engine source contract")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run camera session tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-test-classes
          javac -Xlint:all -Werror -d engine-test-classes             v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraSession.java             v172-source/engine-tests/CameraSessionTest.java
          java -cp engine-test-classes CameraSessionTest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-19 FIX2 debug APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28019-fix2-build.log

      - name: Verify APK identity and package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DEVELOP-UGANDA-V280-19-FIX2-CAMERA-ENGINE.apk'
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.sentongoharuna.pulse' versionCode='28192' versionName='280.19.2-camera-engine'" apk-badging.txt
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          test -s "$OUT"

      - name: Upload V280-19 FIX2 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-19-FIX2-CAMERA-ENGINE-APK
          path: |
            DEVELOP-UGANDA-V280-19-FIX2-CAMERA-ENGINE.apk
            DEVELOP-UGANDA-V280-19-FIX2-CAMERA-ENGINE.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload camera-engine audit and build log
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-19-FIX2-CAMERA-ENGINE-AUDIT
          path: |
            v172-source/V280-19-FIX2-CAMERA-ENGINE-AUDIT.txt
            v172-source/v28019-fix2-build.log
            apk-badging.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-19-FIX2-CAMERA-ENGINE-BUILD-LOG
