      - name: S5.01 truth safety and real-data acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaDirectorOverlayView.kt"
          E="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewObservationEngine.kt"
          X="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          G="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewSignalGraphRenderer.kt"
          P="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewCameraEngine.kt"

          python3 - "$C" "$D" "$E" "$X" "$G" "$P" <<'PY'
          from pathlib import Path
          import sys
          camera, director, engine, exporter, graph, policy = (Path(p).read_text() for p in sys.argv[1:])

          required = {
              "camera": (
                  "interviewBurnInEnabled = true",
                  "s501_signal_burn_migrated",
                  "interviewObservationEngine?.observeAudio(levelDbfs, silenceMs)",
                  "interviewSummary = interview",
                  "MARK\\nQUESTION",
                  "NEW\\nBASELINE",
                  "DevelopUgandaInterviewCameraEngine.selectFrameRate(info)",
                  "DevelopUgandaInterviewCameraEngine.exposureCorrectionEv(measured)",
                  "isInterviewCamera() && interviewAnalysisEnabled",
                  "NOT A LIE DETECTOR • NO TRUTH OR DECEPTION VERDICT",
              ),
              "director": (
                  "measureInterviewFrame(imageForClose, primary)",
                  "upperBodyMotion = interviewMetrics?.upperBodyMotion",
                  "faceLuma = interviewMetrics?.faceLuma",
                  "faceHighlightPct = interviewMetrics?.faceHighlightPct",
                  "subjectId = \"--\"",
              ),
              "engine": (
                  "DU_INTERVIEW_BEHAVIOURAL_SIGNALS_V1",
                  "10_000L",
                  "HEAD MOVEMENT",
                  "UPPER-BODY MOTION",
                  "VOICE ENERGY CHANGE",
                  "PAUSE DURATION",
                  "SIGNAL CHANGE INDEX",
                  "DATA QUALITY",
                  "recording_elapsed_ms",
                  "Measured behavioural signals only. Not a lie detector",
              ),
              "exporter": (
                  "val interviewSummary:",
                  "interviewSummary = request.take.interviewSummary",
                  "interviewRenderer.draw(canvas, it, elapsedMs)",
                  "setFrameRate(DevelopUgandaInterviewCameraEngine.TARGET_FPS)",
              ),
              "graph": (
                  "INTERVIEW • MEASURED BEHAVIOURAL SIGNALS",
                  "BODY",
                  "HEAD",
                  "EYES",
                  "VOICE",
                  "CHANGE",
                  "questionMarkersMs",
                  "NOT A LIE DETECTOR • NO TRUTH/DECEPTION VERDICT",
              ),
              "policy": (
                  "R6-S5.01-INTERVIEW-EVIDENCE-ENGINE",
                  "TARGET_FPS = 30",
                  "selectFrameRate",
                  "exposureCorrectionEv",
              ),
          }
          sources = dict(camera=camera, director=director, engine=engine, exporter=exporter, graph=graph, policy=policy)
          for group, tokens in required.items():
              folded = sources[group]
              for token in tokens:
                  assert token in folded, f"{group}: {token}"

          forbidden = (
              "TRUTH SCORE",
              "LIE SCORE",
              "DECEPTION PROBABILITY",
              'LABEL = "LYING"',
              'LABEL = "TRUTHFUL"',
              "DECEPTIONPROBABILITY",
              "TRUTHSCORE",
              "LIESCORE",
              'physicalComposure >= 70 -> "AGITATED"',
          )
          joined = "\n".join((camera, director, engine, exporter, graph, policy)).upper()
          for token in forbidden:
              assert token.upper() not in joined, token
          assert "SELF-TOUCH" not in engine
          assert "FACIAL TENSION" not in engine
          print("S5.01 REAL-DATA + SAFETY GATE • PASS")
          PY

