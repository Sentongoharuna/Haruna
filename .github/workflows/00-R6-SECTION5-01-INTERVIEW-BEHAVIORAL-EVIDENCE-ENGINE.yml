name: R6 SECTION5 01 - INTERVIEW BEHAVIORAL EVIDENCE ENGINE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-R6-SECTION5-01-INTERVIEW-BEHAVIORAL-EVIDENCE-ENGINE.yml"]
permissions:
  contents: read
concurrency:
  group: r6-section5-01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Restore exact accepted S4.06C forward baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=".github/workflows/00-R6-SECTION4-06C-COMPILE-REPAIR-LIVE-EVIDENCE.yml"
          test -s "$BASE"
          echo "67674cedfac556840bc65d3aa7020ab5fc1ed7fd0ea0e6f3c7b5d71a0c733653  $BASE" | sha256sum -c -

          python3 - "$BASE" <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          source = Path(sys.argv[1]).read_text().splitlines()
          scripts = {}
          current_name = None
          index = 0
          while index < len(source):
              line = source[index]
              if line.startswith("      - name: "):
                  current_name = line.split(": ", 1)[1]
              if current_name and line == "        run: |":
                  index += 1
                  body = []
                  while index < len(source):
                      candidate = source[index]
                      if not candidate.strip():
                          body.append("")
                          index += 1
                          continue
                      if not candidate.startswith("          "):
                          break
                      body.append(candidate[10:])
                      index += 1
                  scripts[current_name] = "\n".join(body) + "\n"
                  continue
              index += 1

          recipe = (
              "Restore exact accepted S4.05 baseline",
              "Apply compact S4.06 live evidence upgrade",
              "S4.06 visible feature and protection gate",
              "S4.06C repair missing asynchronous ghost-reference API",
              "Verify final R6 through S4.06 contracts",
              "Update stale title contract and verify protected source",
          )
          missing = [name for name in recipe if name not in scripts]
          if missing:
              raise SystemExit("S5.01 STOP: S4.06C recipe incomplete: " + ", ".join(missing))
          environment = os.environ.copy()
          environment.setdefault("GITHUB_RUN_NUMBER", "0")
          for name in recipe:
              print(f"::group::{name}", flush=True)
              subprocess.run(
                  ["bash"],
                  input=scripts[name],
                  text=True,
                  check=True,
                  cwd=Path.cwd(),
                  env=environment,
              )
              print("::endgroup::", flush=True)
          print("EXACT S4.06C FORWARD BASELINE RESTORED")
          PY

      - name: Lock immediate S4.06C inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'SHA'
