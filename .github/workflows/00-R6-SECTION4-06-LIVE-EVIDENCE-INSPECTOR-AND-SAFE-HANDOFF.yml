          python3 - "$C" "$I" "$E" "$T" /tmp/r6-s302-forward.patch <<'PY'
          from pathlib import Path
          import re,sys

          contract,inbox,editor,tests,patch=(Path(x).read_text() for x in sys.argv[1:])

          # A real switch and a pure source-resolution contract, not another
          # menu label. BRAND defaults when both immutable files are playable.
          for token in (
              "data class SourceSelection(",
              "fun resolveSourceSelection(",
              'status = "${selected.name} SELECTED"',
              'status = "CLEAN FALLBACK ACTIVE"',
              'status = "BRAND ONLY ACTIVE"',
              'status = "NO PLAYABLE SOURCE"',
              "cleanPlayable && brandPlayable",
              "cleanPlayable -> SourceSelection(",
              "brandPlayable -> SourceSelection(",
          ): assert token in contract, token

          # Pending or empty MediaStore rows are never treated as playable.
          for token in (
              "val isPlayable: Boolean",
              "get() = !isPending && (sizeBytes ?: 1L) > 0L",
              "brand?.takeIf { it.isPlayable }",
              "clean?.takeIf { it.isPlayable }",
              "fun sourceFor(",
          ): assert token in inbox, token
          default_block=inbox[inbox.index("val defaultVideo"):inbox.index("fun sourceFor(")]
          assert "?: brand" not in default_block
          assert default_block.count("takeIf { it.isPlayable }") == 2

          # Literal SwitchCompat, persisted through the guarded preference
          # proxy, and re-resolved at every Open/Play/Share click.
          for token in (
              "import androidx.appcompat.widget.SwitchCompat",
              'duSharedPreferences("develop_uganda_section3_source", MODE_PRIVATE)',
              '"prefer_brand_${takeId.uppercase(Locale.US)}"',
              'text = "CLEAN  ← SOURCE →  BRAND"',
              'textOn = "BRAND"',
              'textOff = "CLEAN"',
              "private fun inboxSourceSelection(",
              "fun selectedSource(): Pair<",
              'action("OPEN IN EDITOR • CHECKING"',
              'action("PLAY SELECTED • CHECKING"',
              'action("SHARE SELECTED • CHECKING"',
              "SOURCE SWITCH • ${selection.status} • ${selection.reason}",
          ): assert token in editor, token
          assert "getSharedPreferences(" not in editor
          assert editor.count("val (selection, video) = selectedSource()") == 3
          assert editor.count("take.sourceFor(selection.variant)") >= 2

          # Existing Section 3 delivery remains present and originals remain
          # read-only: explicit source playback, join, captions and final.
          for token in (
              "PLAY CLEAN • ORIGINAL",
              "PLAY BRAND • BURNED DETAILS",
              "ADD CLEAN TO MARKED JOIN",
              "REVIEW / CONFIRM CAPTIONS",
              "EXPORT FINAL • CAPTIONED BRAND",
              "FINAL READY • BRAND + CONFIRMED CAPTIONS • ORIGINALS PRESERVED",
              "DevelopUgandaTakeMarks.forClip",
              "assembleBrand(",
              "SHARE SOCIAL",
          ): assert token in editor, token

          # The compiled device suite carries exact READY/fallback/only/none
          # cases without adding an unbounded connected-device task.
          for token in (
              '"section3SourceSwitchResolvesExactSources"',
              "brandDefault.variant == DevelopUgandaSection3MediaContract.Variant.BRAND",
              "cleanChoice.variant == DevelopUgandaSection3MediaContract.Variant.CLEAN",
              "processingFallback.forcedFallback",
              "brandOnly.variant == DevelopUgandaSection3MediaContract.Variant.BRAND",
              "unavailable.variant == null",
          ): assert token in tests, token

          paths=set(re.findall(r"^diff --git a/(\S+) b/",patch,re.M))
          expected={
              "app/build.gradle.kts",
              "app/src/androidTest/java/com/sentongoharuna/pulse/DevelopUgandaFiveModeInstrumentation.kt",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaEditorActivity.kt",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaMediaInbox.kt",
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaSection3MediaContract.kt",
          }
          assert paths==expected, (paths,expected)
          print("S3.02 FUNCTION GATE • REAL SWITCH + PERSISTENCE + SAFE FALLBACK + SELECTED ACTIONS")
          PY

