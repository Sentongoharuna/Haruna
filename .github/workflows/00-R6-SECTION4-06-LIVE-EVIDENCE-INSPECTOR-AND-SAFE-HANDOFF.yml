              "1080P60 H264 NO-STAB",
              "1080P30 H264 STAB",
              "1080P30 H264 NO-STAB",
              "R60 UNIVERSAL SAFE",
          )
          missing=[value for value in exact if value not in engine]
          if missing:
              raise SystemExit("S2.04 R60 CONTRACT MISSING: "+", ".join(missing))

          bind=between(
              activity,"    private fun bindCamera()","    private fun drawStrongRecordedText("
          ).decode()
