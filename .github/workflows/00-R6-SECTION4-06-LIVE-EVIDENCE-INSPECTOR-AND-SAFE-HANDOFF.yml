      - name: Section 2.05 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          L="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorEngine.kt"
          S="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorStudioActivity.kt"
          P="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveGradePanel.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"

          grep -q 'versionCode = 28605' "$G"
          grep -q '286.05-r6-section2-05-strong-luts-full-burn' "$G"
          grep -q 'minSdk = 23' "$G"
          grep -q 'val camerax = "1.6.1"' "$G"
          grep -q 'const val MAX_MASTER_STRENGTH = 200' "$C"
          grep -q 'private const val AUTHORED_IMPACT_AT_100 = 1.60f' "$C"
          grep -q 'private const val EXTRA_IMPACT_100_TO_200 = 0.90f' "$C"
          grep -q 'effectiveStrength(selection.strength)' "$C"
          grep -q 'val strength = effectiveStrength(strengthPercent)' "$C"
          grep -q 'max = DevelopUgandaColorEngine.MAX_MASTER_STRENGTH' "$S"
          grep -q 'max = DevelopUgandaColorEngine.MAX_MASTER_STRENGTH' "$P"
          grep -q 'styledDetails(brandHeader(request.take, cleanProbe))' "$D"
          grep -q 'val burnDetails: List<String> = emptyList()' "$D"
          grep -q 'CameraX.*CLEAN URI remains read-only' "$D"
          grep -q 'burnDetails = details' "$A"
          grep -q 'burnDetails = details' "$L"

          python3 - "$A" "$L" "$C" "$S" "$P" "$D" "$R" <<'PY'
          from pathlib import Path
          import hashlib,sys

          activity,live,color,studio,panel,dual,r60=(Path(x).read_text() for x in sys.argv[1:])

          def without_between(text,start_marker,end_marker):
              start=text.index(start_marker)
              end=text.index(end_marker,start)
              return (text[:start]+text[end:]).encode()

          # Only the two take-metadata builders may change in the two camera
          # activities. This protects every R6 visual and recording control.
          assert hashlib.sha256(without_between(
              activity,
              "    private fun f9CreateTakeMetadata",
              "    private fun f9FinishTakeMetadata",
          )).hexdigest()=="befe350990f94d8089db71eb72113c523dbd1fd8a134c1e36fe0540498b1ad48"
          assert hashlib.sha256(without_between(
              live,
              "    private fun f9CreateLiveTake",
              "    private fun toggleRecording",
          )).hexdigest()=="55eb1da1c891c86a26850eb49a6c6c3fd0628917650c97c9f4077989ecb27985"

          protected={
              "r60": hashlib.sha256(r60.encode()).hexdigest(),
              "navigator": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt").read_bytes()).hexdigest(),
              "broadcast": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt").read_bytes()).hexdigest(),
              "profiles": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt").read_bytes()).hexdigest(),
              "routes": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaAdditiveCameraModes.kt").read_bytes()).hexdigest(),
              "manifest": hashlib.sha256(Path("app/src/main/AndroidManifest.xml").read_bytes()).hexdigest(),
          }
          expected={
              "r60": "e5e1f0dbb314a540b2472e1bdd171bb55c2db0628b22e7ef8c344b6ba9fd053e",
              "navigator": "4dba2231022031c309722d6fb7f72c4906ceda36a5f936b29e23e9bff1cf6c9e",
              "broadcast": "deed862236dfe39e70cadd51fddc2921d98baddbc954f19a017444a11a28d0a0",
              "profiles": "1473514e17ba42117da519adc15b0773a3fbac6da1b715192b5debc2fae80bbb",
              "routes": "a61683f428c5a713331f05ee50dc0aac237995482f807fc6f7523e5d99454a66",
              "manifest": "85b91bd34b78b11eb5c9a1b4cc4e42414f0f9a601f165a2a2f6f0700662de65c",
          }
          assert protected==expected, {
              key:(expected.get(key),protected.get(key))
              for key in expected if expected.get(key)!=protected.get(key)
          }

          # One curve drives both the visible monitor and saved COLOR_MASTER.
          assert color.count("effectiveStrength(selection.strength)") == 1
          assert color.count("effectiveStrength(strengthPercent)") == 1
          assert "selection.strength / 100f" not in color
          assert color.count("MAX_MASTER_STRENGTH") >= 4
          def impact(percent):
              normalized=max(0,min(200,percent))/100.0
              return normalized*1.60 if normalized<=1.0 else 1.60+(normalized-1.0)*0.90
          assert impact(0)==0.0
          assert abs(impact(100)-1.60)<0.0001
          assert abs(impact(200)-2.50)<0.0001
          assert studio.count("MAX_MASTER_STRENGTH") >= 2
          assert panel.count("MAX_MASTER_STRENGTH") >= 2

          # Every recording path produces CLEAN first and independently queues BRAND.
          assert activity.count("f9DualOutputExporter.enqueue(") == 1
          assert live.count("f9LiveDualOutputExporter.enqueue(") == 1
          assert 'DISPLAY_NAME, "${safeId}_BRAND.mp4"' in dual
          assert ".setUri(request.cleanUri)" in dual
          assert 'openOutputStream(uri, "w")' in dual
          assert "openOutputStream(request.cleanUri" not in dual
          assert "styledDetails(brandHeader(request.take, cleanProbe))" in dual

          common_details=(
              "STRONG RANGE 200%",
              "DEVICE ",
              "BAT ",
              "THERM ",
              "AUDIO ",
              "LUT ",
              "FORMAT ",
              "LENS ",
          )
          assert all(value in activity for value in common_details)
          assert all(value in live for value in common_details)
          for value in ("GPS %.5f, %.5f","ALT %.0f m","WX ","TAKE "):
              assert value in dual
          for value in ("probe.width","probe.height","FPS","ISO ","Mbps"):
              assert value in dual

          # Exact accepted R60 compression-resistant engine remains byte-for-byte.
          for value in (
              "const val TARGET_BITRATE_BPS = 15_000_000",
              "const val CONTRAST = 0.050f",
              "const val SATURATION = 3.0f",
              "const val LIGHTNESS = 0.75f",
              "const val RED_SCALE = 1.009f",
              "const val GREEN_SCALE = 1.003f",
              "const val BLUE_SCALE = 0.998f",
              "private fun setVideoMimeTypeApi23(",
              "R60 UNIVERSAL SAFE",
          ):
              assert value in r60
          print("S2.05 VERIFIED • 200% STRONG LUTS • FULL DETAIL CLEAN + BRAND • R6/R60 LOCKED")
          PY

