      - name: Section 2.10 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          H="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewHudView.kt"
          L="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt"
          M="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaDynamicBurnMonitor.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorEngine.kt"
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"

          grep -q 'versionCode = 28610' "$G"
          grep -q '286.10-r6-section2-10-interview-report-signals' "$G"
          grep -q 'minSdk = 23' "$G"

          python3 - "$A" "$D" "$H" "$L" "$M" "$C" "$R" <<'PY'
          from pathlib import Path
          import hashlib,sys

          activity,dual,hud,live,monitor,color,r60=[Path(x).read_text() for x in sys.argv[1:]]

          # Interview now has an explicit report-only renderer. It keeps
          # editorial identity, subject, place, audio and timecode, while the
          # other four modes retain S2.09 technical telemetry.
          assert 'val interviewReportOnly = sample.mode.equals("INTERVIEW", true)' in monitor
          assert '"DEVELOP UGANDA REPORT"' in monitor
          for token in ('"REPORT ${sample.reportId', '"STORY ${sample.storyId',
                        '"REPORTER ${sample.operator', '"SUBJECT ${sample.subjectId',
                        '"PLACE ${sample.locationName', '"AUDIO ${sample.audioDbfs'):
              assert token in monitor, token
          assert 'if (interviewReportOnly)' in monitor
          assert '"LAT ${sample.latitude' in monitor
          assert '"EXP ISO ${sample.iso' in monitor
          assert '"SYS BAT ${sample.batteryPct' in monitor
          assert 'val reportId: String? = null' in monitor
          assert 'val storyId: String? = null' in monitor
          assert 'val subjectId: String? = null' in monitor

          # The older Interview instrument view must not call its exposure or
          # system blocks, and its supplied telemetry must be editorial only.
          on_draw=hud[hud.index("override fun onDraw"):hud.index("private fun drawExposureBlock")]
          assert "drawExposureBlock(" not in on_draw
          assert "drawSystemBlock(" not in on_draw
          assert "remainingMinutes?.let" not in on_draw
          interview_feed=activity[activity.index("private fun f9InterviewTelemetry"):
                                  activity.index("private val f9InterviewTelemetryRunnable")]
          for forbidden in ("iso =", "shutterNs =", "exposureEv =", "remainingMinutes =",
                            "batteryPercent =", "thermalState ="):
              assert forbidden not in interview_feed, forbidden
          for required in ("audioDbfs =", "timecode =", "takeNumber =", "currentSilenceMs ="):
              assert required in interview_feed, required
          assert 'add("DEVELOP UGANDA • INTERVIEW REPORT")' in activity
          assert 'add("GRAPHICS LOWER THIRD • REPORT ID • TIMECODE")' in activity
          assert 'subjectId = f9InterviewSubjectId' in activity

          # Three-colour page lamps are event-driven, preview-only and dark at
          # idle: green ready, red blocked, blue while work is moving.
          for token in (
              "enum class DevelopUgandaWorkflowSignal",
              "DevelopUgandaWorkflowSignal.OFF -> 0L",
              "DevelopUgandaWorkflowSignal.READY -> now + 2_800L",
              "DevelopUgandaWorkflowSignal.NOT_READY -> now + 4_200L",
              "DevelopUgandaWorkflowSignal.PROCESSING -> Long.MAX_VALUE",
              "if ((now / 360L) % 2L != 0L) return",
              "DevelopUgandaWorkflowSignal.READY -> 0xFF39E75F.toInt()",
              "DevelopUgandaWorkflowSignal.NOT_READY -> 0xFFFF3B30.toInt()",
              "DevelopUgandaWorkflowSignal.PROCESSING -> 0xFF2F80ED.toInt()",
              "drawWorkflowSignal(canvas, now)",
          ): assert token in monitor, token
          assert "DevelopUgandaWorkflowSignal" not in dual
          assert activity.count("f9WorkflowSignal(DevelopUgandaWorkflowSignal.PROCESSING") >= 5
          assert activity.count("f9WorkflowSignal(DevelopUgandaWorkflowSignal.READY") >= 2
          assert activity.count("f9WorkflowSignal(DevelopUgandaWorkflowSignal.NOT_READY") >= 7
          assert live.count("f9LiveWorkflowSignal(DevelopUgandaWorkflowSignal.PROCESSING") >= 4
          assert live.count("f9LiveWorkflowSignal(DevelopUgandaWorkflowSignal.READY") >= 2
          assert live.count("f9LiveWorkflowSignal(DevelopUgandaWorkflowSignal.NOT_READY") >= 4

          # S2.09 dynamic BRAND, strong LUT, exact R60 and frozen R6 visual
          # contracts remain the accepted forward chain.
          assert "DevelopUgandaTimelineDetailBurnOverlay(" in dual
          assert "telemetryTimeline: List<DevelopUgandaBurnSample>" in dual
          assert "private const val AUTHORED_IMPACT_AT_100 = 2.75f" in color
          assert "private const val EXTRA_IMPACT_100_TO_200 = 2.25f" in color
          assert hashlib.sha256(r60.encode()).hexdigest()=="e5e1f0dbb314a540b2472e1bdd171bb55c2db0628b22e7ef8c344b6ba9fd053e"
          protected={
              "navigator": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt").read_bytes()).hexdigest(),
              "broadcast": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt").read_bytes()).hexdigest(),
              "profiles": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt").read_bytes()).hexdigest(),
              "routes": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaAdditiveCameraModes.kt").read_bytes()).hexdigest(),
              "manifest": hashlib.sha256(Path("app/src/main/AndroidManifest.xml").read_bytes()).hexdigest(),
          }
