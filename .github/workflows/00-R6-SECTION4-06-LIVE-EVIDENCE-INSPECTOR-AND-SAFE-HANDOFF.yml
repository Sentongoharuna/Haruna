      - name: Section 2.09 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          L="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt"
          M="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaDynamicBurnMonitor.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorEngine.kt"
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"

          grep -q 'versionCode = 28609' "$G"
          grep -q '286.09-r6-section2-09-dynamic-monitor-burn' "$G"
          grep -q 'minSdk = 23' "$G"
          grep -q 'tag = "s209_dynamic_burn_monitor"' "$M"
          grep -q 'private class DevelopUgandaTimelineDetailBurnOverlay' "$D"
          ! grep -q 'private class DevelopUgandaPermanentDetailBurnOverlay' "$D"

          python3 - "$A" "$D" "$L" "$M" "$C" "$R" <<'PY'
          from pathlib import Path
          import hashlib,sys

          activity,dual,live,monitor,color,r60=[Path(x).read_text() for x in sys.argv[1:]]

          # The monitor must be an actual full-preview child in both camera
          # activities, not another export-only or dead-code change.
          assert "f9DynamicBurnMonitorView = DevelopUgandaDynamicBurnMonitorView(this)" in activity
          assert "f9LiveDynamicBurnMonitorView = DevelopUgandaDynamicBurnMonitorView(this)" in live
          assert activity.count("f9UpdateDynamicBurnMonitor()") >= 2
          assert live.count("f9UpdateLiveDynamicMonitor()") >= 3
          assert 'tag = "s209_dynamic_burn_monitor"' in monitor
          assert "isClickable = false" in monitor and "isFocusable = false" in monitor

          # Five camera identities own distinct blinking digital signals.
          expected_colors={
              '"MAIN" -> 0xFF39E75F.toInt()': "MAIN GREEN",
              '"LIVE" -> 0xFFFF3B30.toInt()': "LIVE RED",
              '"INTERVIEW" -> 0xFF2F80ED.toInt()': "INTERVIEW BLUE",
              '"TIKTOK" -> 0xFF050505.toInt()': "TIKTOK BLACK",
              '"STATUS" -> 0xFF006B3C.toInt()': "WHATSAPP DARK GREEN",
          }
          for token in expected_colors: assert token in monitor
          assert 'sample.mode.equals("TIKTOK", true)' in monitor
          assert "signalRingPaint" in monitor
          assert "blinkOn = (SystemClock.elapsedRealtime() / 420L)" in monitor

          # The rail is compact but its critical fields stay continuously
          # visible and use truthful UNKNOWN/-- fallbacks rather than guesses.
          for token in (
              '"LAT ${sample.latitude', '"LON ${sample.longitude',
              '"GPS ${sample.accuracyM', '"NAV $heading', '"ALT ${sample.altitudeM',
              '"EXP ISO ${sample.iso', '"WB ${sample.whiteBalance} | LUT ${sample.lut}',
              '"MIC ${sample.audioDbfs', '"SYS BAT ${sample.batteryPct',
              '"DATE ${localDate.format(sampleDate)}"', 'utcClock',
          ): assert token in monitor, token
          assert "width * 0.36f" in monitor
          assert "0x70031829" in monitor

          # CameraX Start/Status/Finalize own the recorded timeline. LIVE also
          # requests fresh GPS updates instead of freezing last-known values.
          assert "private val f9BurnTimeline = ArrayList<DevelopUgandaBurnSample>()" in activity
          assert "private val f9LiveBurnTimeline = ArrayList<DevelopUgandaBurnSample>()" in live
          for token in ("f9CaptureBurnSample(0L, force = true)", "f9CaptureBurnSample(durationMs, force = true)"):
              assert token in activity
          for token in ("f9CaptureLiveBurnSample(0L, force = true)", "f9CaptureLiveBurnSample(finalDurationMs, force = true)"):
              assert token in live
          assert "requestLocationUpdates(" in live and "1_000L" in live
          assert "removeUpdates(f9LiveLocationListener)" in live

          # BRAND remains S2.08's one burn texture, but it now redraws by
          # presentation timestamp from a binary-searched telemetry timeline.
          brand=dual[dual.index("private fun startTransform("):dual.index("private fun startAssemblyTransform(")]
          assert "DevelopUgandaTimelineDetailBurnOverlay(" in brand
          assert "request.take.telemetryTimeline" in brand
          assert "OverlayEffect(overlays)" in brand
          assert "DevelopUgandaBrandIdentity.overlays(" not in brand
          overlay=dual[dual.index("private class DevelopUgandaTimelineDetailBurnOverlay"):]
          assert "CanvasOverlay(true)" in overlay
          assert "presentationTimeUs / 1_000L" in overlay
          assert "sampleIndexAt(elapsedMs)" in overlay
          assert "timeBucket = elapsedMs / 100L" in overlay
          assert "canvas.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR)" in overlay
          assert "telemetryTimeline: List<DevelopUgandaBurnSample>" in dual

          # S2.05 strong LUT, S2.03/R60 engine, and R6 visual/navigation files
          # are still the accepted forward chain and were not rebuilt backward.
          assert "private const val AUTHORED_IMPACT_AT_100 = 2.75f" in color
          assert "private const val EXTRA_IMPACT_100_TO_200 = 2.25f" in color
          assert hashlib.sha256(r60.encode()).hexdigest()=="e5e1f0dbb314a540b2472e1bdd171bb55c2db0628b22e7ef8c344b6ba9fd053e"
          protected={
              "navigator": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt").read_bytes()).hexdigest(),
              "broadcast": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt").read_bytes()).hexdigest(),
              "profiles": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt").read_bytes()).hexdigest(),
              "routes": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaAdditiveCameraModes.kt").read_bytes()).hexdigest(),
              "manifest": hashlib.sha256(Path("app/src/main/AndroidManifest.xml").read_bytes()).hexdigest(),
          }
          assert protected=={
              "navigator": "4dba2231022031c309722d6fb7f72c4906ceda36a5f936b29e23e9bff1cf6c9e",
              "broadcast": "deed862236dfe39e70cadd51fddc2921d98baddbc954f19a017444a11a28d0a0",
              "profiles": "1473514e17ba42117da519adc15b0773a3fbac6da1b715192b5debc2fae80bbb",
              "routes": "a61683f428c5a713331f05ee50dc0aac237995482f807fc6f7523e5d99454a66",
              "manifest": "85b91bd34b78b11eb5c9a1b4cc4e42414f0f9a601f165a2a2f6f0700662de65c",
          }
          print("S2.09 VERIFIED • VISIBLE CHANGING MONITOR • FIVE SIGNAL COLOURS • TIMED GPS BRAND")
          PY

