      - name: Section 2.06 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          L="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorEngine.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"

          grep -q 'versionCode = 28606' "$G"
          grep -q '286.06-r6-section2-06-visible-lut-burn-output' "$G"
          grep -q 'minSdk = 23' "$G"
          grep -q 'val camerax = "1.6.1"' "$G"
          grep -q 'private const val AUTHORED_IMPACT_AT_100 = 2.75f' "$C"
          grep -q 'private const val EXTRA_IMPACT_100_TO_200 = 2.25f' "$C"
          grep -q 'internal fun createLutEffect(' "$C"
          grep -q 'val colorSelection: DevelopUgandaColorEngine.ResolvedSelection' "$D"
          grep -q 'DevelopUgandaColorEngine.createLutEffect(' "$D"
          grep -q 'buildList<Effect>' "$D"
          grep -q 'lut?.let(::add)' "$D"
          grep -q 'add(OverlayEffect(overlays))' "$D"
          grep -q 'confirmedCues = null' "$D"
          grep -q 'DevelopUgandaCaptionReview.prepare' "$D"
          grep -q '_BRAND_LUT_BURN.mp4' "$D"
          grep -q 'setScale(0.62f, 0.62f)' "$D"
          grep -q 'AbsoluteSizeSpan(34)' "$D"
          grep -q 'colorScope = v229ColorScope()' "$A"
          grep -q 'colorScope = v229LiveColorScope()' "$L"
          grep -q '"STATUS", "TIKTOK"' "$A"
          ! grep -q '"${f9Take.takeId}_CLEAN"' "$A"

          python3 - "$A" "$L" "$C" "$D" "$R" <<'PY'
          from pathlib import Path
          import hashlib,sys

          activity,live,color,dual,r60=(Path(x).read_text() for x in sys.argv[1:])

          # Prove the LUT is first and the readable overlay is second in the
          # same BRAND render. TikTok must consume that completed BRAND URI.
          lut_call=dual.index("DevelopUgandaColorEngine.createLutEffect(")
          effect_list=dual.index("val videoEffects = buildList<Effect>",lut_call)
          lut_add=dual.index("lut?.let(::add)",effect_list)
          overlay_add=dual.index("add(OverlayEffect(overlays))",effect_list)
          set_effects=dual.index(".setEffects(Effects(emptyList(), videoEffects))",overlay_add)
          assert lut_call < effect_list < lut_add < overlay_add < set_effects
          assert dual.index("prepareReviewedCaptions(request)") < dual.index(
              "startTransform(request, probe, confirmedCues = null)"
          )
          assert 'DISPLAY_NAME, "${safeId}_BRAND_LUT_BURN.mp4"' in dual

          route=activity[activity.index("private fun f9HandleDualOutput"):activity.index(
              "private fun f9ShowInterviewSettingsSheet"
          )]
          assert '"STATUS", "TIKTOK"' in route
          assert 'exportAdditiveDelivery(it, "${outcome.take.takeId}_BRAND")' in route
          finalize=activity[activity.index("is VideoRecordEvent.Finalize"):]
          assert '"${f9Take.takeId}_CLEAN"' not in finalize
          assert "f9DualOutputExporter.enqueue(event.outputResults.outputUri, f9Take)" in finalize

          # The stronger curve is shared by monitor, COLOR_MASTER and BRAND.
          assert color.count("effectiveStrength(selection.strength)") == 1
          assert color.count("effectiveStrength(strengthPercent)") == 1
          def impact(percent):
              normalized=max(0,min(200,percent))/100.0
              return normalized*2.75 if normalized<=1.0 else 2.75+(normalized-1.0)*2.25
          assert impact(0)==0.0
          assert abs(impact(100)-2.75)<0.0001
          assert abs(impact(200)-5.00)<0.0001

          # Exact accepted R60 compression-resistant engine remains untouched.
          assert hashlib.sha256(r60.encode()).hexdigest()=="e5e1f0dbb314a540b2472e1bdd171bb55c2db0628b22e7ef8c344b6ba9fd053e"
          protected={
              "navigator": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt").read_bytes()).hexdigest(),
              "broadcast": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt").read_bytes()).hexdigest(),
              "profiles": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt").read_bytes()).hexdigest(),
              "routes": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaAdditiveCameraModes.kt").read_bytes()).hexdigest(),
              "manifest": hashlib.sha256(Path("app/src/main/AndroidManifest.xml").read_bytes()).hexdigest(),
          }
          expected={
              "navigator": "4dba2231022031c309722d6fb7f72c4906ceda36a5f936b29e23e9bff1cf6c9e",
              "broadcast": "deed862236dfe39e70cadd51fddc2921d98baddbc954f19a017444a11a28d0a0",
              "profiles": "1473514e17ba42117da519adc15b0773a3fbac6da1b715192b5debc2fae80bbb",
              "routes": "a61683f428c5a713331f05ee50dc0aac237995482f807fc6f7523e5d99454a66",
              "manifest": "85b91bd34b78b11eb5c9a1b4cc4e42414f0f9a601f165a2a2f6f0700662de65c",
          }
          assert protected==expected
          print("S2.06 VERIFIED • 5.00x LUT CEILING • IMMEDIATE FULL BURN • TIKTOK USES BRAND")
          PY

