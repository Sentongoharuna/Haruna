          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          L="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorEngine.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"

          grep -q 'versionCode = 28607' "$G"
          grep -q '286.07-r6-section2-07-serial-brand-export' "$G"
          grep -q 'minSdk = 23' "$G"
          grep -q 'val camerax = "1.6.1"' "$G"
          grep -q 'private const val AUTHORED_IMPACT_AT_100 = 2.75f' "$C"
          grep -q 'private const val EXTRA_IMPACT_100_TO_200 = 2.25f' "$C"
          grep -q '_BRAND_LUT_BURN.mp4' "$D"
          grep -q 'AudioEncoderSettings.Builder().setBitrate(256_000)' "$D"
          grep -q 'val builtTransformer = Transformer.Builder(context)' "$D"
          grep -q 'builtTransformer.start(composition, temp.absolutePath)' "$D"
          grep -q 'setVideoMimeType(MimeTypes.VIDEO_H264)' "$D"
          grep -q 'clean.width != brand.width' "$D"
          grep -q 'durationToleranceMs = max(100L, frameMs \* 2L)' "$D"
          grep -q 'S2.07 fallback starts only after BRAND has released the codec' "$A"
          grep -q 'BRAND already owns the selected 17³ LUT' "$A"
          grep -q 'BRAND owns the encoder first' "$L"

          python3 - "$A" "$L" "$C" "$D" "$R" <<'PY'
          from pathlib import Path
          import hashlib,sys

          activity,live,color,dual,r60=(Path(x).read_text() for x in sys.argv[1:])

          # Camera Finalize owns only CLEAN -> BRAND. It may not start the
          # secondary COLOR_MASTER while BRAND is acquiring the encoder.
          finalize_start=activity.index("is VideoRecordEvent.Finalize")
          finalize_end=activity.index("                        else -> Unit",finalize_start)
          finalize=activity[finalize_start:finalize_end]
          assert "f9DualOutputExporter.enqueue(event.outputResults.outputUri, f9Take)" in finalize
          assert "scheduleV233ColorMaster(" not in finalize

          handler=activity[activity.index("private fun f9HandleDualOutput"):activity.index(
              "private fun f9ShowInterviewSettingsSheet"
          )]
          assert handler.index("if (!outcome.complete)") < handler.index("scheduleV233ColorMaster(")
          assert '"STATUS", "TIKTOK"' in handler
          assert 'exportAdditiveDelivery(it, "${outcome.take.takeId}_BRAND")' in handler
          assert handler.count("scheduleV233ColorMaster(") == 2

          # LIVE follows the same codec order: enqueue in Finalize, then start
          # COLOR_MASTER only from the exporter's completion callback.
          live_finalize_start=live.index("is VideoRecordEvent.Finalize")
          live_finalize_end=live.index("    private fun showLowerThirdEditor()",live_finalize_start)
          live_finalize=live[live_finalize_start:live_finalize_end]
          assert "f9LiveDualOutputExporter.enqueue(event.outputResults.outputUri, f9Take)" in live_finalize
          assert "scheduleV233LiveColorMaster(" not in live_finalize
          live_callback=live[live.index("private val f9LiveDualOutputExporter"):live.index(
              "private var f9LiveTake"
          )]
          assert "scheduleV233LiveColorMaster(" in live_callback

          # BRAND is H.264/AAC and its start cannot throw through the Activity.
          brand_start=dual.index("private fun startTransform(")
          brand_end=dual.index("private fun startAssemblyTransform(",brand_start)
          brand=dual[brand_start:brand_end]
          assert "prepareReviewedCaptions(request)" not in dual[dual.index("private fun startNext()"):brand_start]
          assert ".setVideoMimeType(MimeTypes.VIDEO_H264)" in brand
          assert "AudioEncoderSettings.Builder().setBitrate(256_000)" in brand
          assert "runCatching {\n            builtTransformer.start" in brand
          assert "releaseActiveBrandLut()" in brand
          assert "clean.width != brand.width" in dual
          assert "clean.videoSamples != brand.videoSamples" in dual
          assert "Frame timestamp sequence differs" in dual

          # Strong LUT and exact accepted TikTok R60 engine stay unchanged.
          assert "effectiveStrength(selection.strength)" in color
          assert hashlib.sha256(r60.encode()).hexdigest()=="e5e1f0dbb314a540b2472e1bdd171bb55c2db0628b22e7ef8c344b6ba9fd053e"
          protected={
              "navigator": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt").read_bytes()).hexdigest(),
              "broadcast": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt").read_bytes()).hexdigest(),
              "profiles": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt").read_bytes()).hexdigest(),
              "routes": hashlib.sha256(Path("app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaAdditiveCameraModes.kt").read_bytes()).hexdigest(),
              "manifest": hashlib.sha256(Path("app/src/main/AndroidManifest.xml").read_bytes()).hexdigest(),
          }
          expected={
              "navigator": "4dba2231022031c309722d6fb7f72c4906ceda36a5f936b29e23e9bff1cf6c9e",
              "broadcast": "deed862236dfe39e70cadd51fddc2921d98baddbc954f19a017444a11a28d0a0",
              "profiles": "1473514e17ba42117da519adc15b0773a3fbac6da1b715192b5debc2fae80bbb",
              "routes": "a61683f428c5a713331f05ee50dc0aac237995482f807fc6f7523e5d99454a66",
              "manifest": "85b91bd34b78b11eb5c9a1b4cc4e42414f0f9a601f165a2a2f6f0700662de65c",
          }
          assert protected==expected
          print("S2.07 VERIFIED • BRAND FIRST • SERIAL CODEC • FULL LUT/BURN OUTPUT")
          PY

