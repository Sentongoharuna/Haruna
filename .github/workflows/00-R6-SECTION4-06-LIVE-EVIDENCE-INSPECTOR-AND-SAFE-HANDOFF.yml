      - name: Section 2.08 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaColorEngine.kt"
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"

          grep -q 'versionCode = 28608' "$G"
          grep -q '286.08-r6-section2-08-one-texture-full-burn' "$G"
          grep -q 'minSdk = 23' "$G"
          grep -q 'val camerax = "1.6.1"' "$G"
          grep -q 'private const val AUTHORED_IMPACT_AT_100 = 2.75f' "$C"
          grep -q 'private const val EXTRA_IMPACT_100_TO_200 = 2.25f' "$C"
          grep -q 'private class DevelopUgandaPermanentDetailBurnOverlay' "$D"
          grep -q 'CanvasOverlay(true)' "$D"
          grep -q 'PERMANENT BRAND BURN | CLEAN MASTER PRESERVED' "$D"
          grep -q 'NO_BURN_FALLBACK_' "$A"

          python3 - "$A" "$D" "$R" <<'PY'
          from pathlib import Path
          import hashlib,sys

          activity=Path(sys.argv[1]).read_text()
          dual=Path(sys.argv[2]).read_text()
          r60=Path(sys.argv[3]).read_text()

          # The ordinary per-take BRAND path must submit exactly one permanent
          # Canvas burn texture. Old independent identity/detail TextOverlays
          # may not return to this low-grade-phone path.
          brand_start=dual.index("private fun startTransform(")
          brand_end=dual.index("private fun startAssemblyTransform(",brand_start)
          brand=dual[brand_start:brand_end]
          assert "DevelopUgandaPermanentDetailBurnOverlay(" in brand
          assert "DevelopUgandaBrandIdentity.overlays(" not in brand
          assert "TextOverlay.createStaticTextOverlay(" not in brand
          assert "OverlayEffect(overlays)" in brand
          assert "startTransform(request, probe, confirmedCues = null)" in dual

          overlay_start=dual.index("private class DevelopUgandaPermanentDetailBurnOverlay")
          overlay=dual[overlay_start:]
          assert "CanvasOverlay(true)" in overlay
          assert "canvas.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR)" in overlay
          assert "renderedWidth" in overlay and "renderedHeight" in overlay
          assert "paint.breakText" in overlay
          assert 'add("PERMANENT BRAND BURN | CLEAN MASTER PRESERVED")' in overlay

          header_start=dual.index("private fun brandHeader")
          header_end=dual.index("private fun brandTechnicalLine",header_start)
          header=dual[header_start:header_end]
          assert 'append("LAT ")' in header
          assert 'append(" | LON ")' in header
          assert header.count('?: "UNKNOWN"') >= 4
          assert 'String.format(Locale.US, "%.6f", it)' in header

          finish_start=activity.index("private fun f9FinishTakeMetadata")
          finish_end=activity.index("private fun f9HandleDualOutput",finish_start)
          finish=activity[finish_start:finish_end]
          assert "val finalSnapshot = f9CreateTakeMetadata(initial.takeId)" in finish
          for field in ("locationName", "latitude", "longitude", "altitudeM", "weather", "burnDetails"):
              assert f"{field} = finalSnapshot.{field}" in finish

          # S2.07's serialization and exact R60 engine remain protected.
          handler=activity[activity.index("private fun f9HandleDualOutput"):activity.index(
              "private fun f9ShowInterviewSettingsSheet"
          )]
