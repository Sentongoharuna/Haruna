                  raise SystemExit("S4.03 STOP: general-hub anchor missing or ambiguous: "+before[:80])
              hub_text=hub_text.replace(before,after,1)

          console_old="        page.addView(buildV28012ProWorkflowConsole())\n"
          if hub_text.count(console_old) != 1:
              raise SystemExit("S4.03 STOP: technical console anchor missing or ambiguous")
          console_new=(
              "        page.addView(\n"
              "            DevelopUgandaSection4ChronologicalWorkflow.advancedDetails(\n"
              "                this,\n"
              "                buildV28012ProWorkflowConsole(),\n"
              "            ),\n"
              "            LinearLayout.LayoutParams(\n"
              "                ViewGroup.LayoutParams.MATCH_PARENT,\n"
              "                ViewGroup.LayoutParams.WRAP_CONTENT,\n"
              "            ).apply {\n"
              "                topMargin = space(8)\n"
              "                bottomMargin = space(8)\n"
              "            },\n"
              "        )\n"
          )
          hub.write_text(hub_text.replace(console_old,console_new,1))

          news_text=news.read_text()
          news_old='"develop.uganda NEWSROOM",'
          news_new='"develop.uganda NEWSROOM • GUIDED REVIEW & DELIVERY",'
          if news_text.count(news_old) != 1:
              raise SystemExit("S4.03 STOP: newsroom title anchor missing or ambiguous")
          news.write_text(news_text.replace(news_old,news_new,1))
          print("S4.03 APPLIED • LIVE COACH APP GUIDE + FRIENDLY PAGES + OPTIONAL TECHNICAL DETAILS")
          PY

