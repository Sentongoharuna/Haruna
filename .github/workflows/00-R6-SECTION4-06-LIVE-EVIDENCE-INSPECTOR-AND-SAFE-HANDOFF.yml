      - name: Section 2.04 repair R60 for API23 CameraX
        shell: bash
        run: |
          set -euo pipefail
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"
          python3 - "$R" "$G" <<'PY'
          from pathlib import Path
          import sys

          engine_path=Path(sys.argv[1])
          gradle_path=Path(sys.argv[2])
          engine=engine_path.read_text()
          gradle=gradle_path.read_text()

          import_old="import androidx.camera.video.ExperimentalMimeTypeApi\n"
          if engine.count(import_old) != 1:
              raise SystemExit("S2.04 STOP: ExperimentalMimeTypeApi import anchor missing")
          engine=engine.replace(import_old,"",1)

          supports_old='''    @OptIn(ExperimentalMimeTypeApi::class)
              fun supportsHevc(): Boolean =
                  runCatching {
                      Recorder.getSupportedVideoMimeTypes()
                          .contains(MediaFormat.MIMETYPE_VIDEO_HEVC)
                  }.getOrDefault(false)
          '''
          supports_new='''    fun supportsHevc(): Boolean =
                  runCatching {
                      android.media.MediaCodecList(android.media.MediaCodecList.ALL_CODECS)
                          .codecInfos
                          .any { codec ->
                              codec.isEncoder &&
                                  codec.supportedTypes.any { type ->
                                      type.equals(MediaFormat.MIMETYPE_VIDEO_HEVC, ignoreCase = true)
                                  }
                          }
                  }.getOrDefault(false)
          '''
          if engine.count(supports_old) != 1:
              raise SystemExit("S2.04 STOP: S2.03 HEVC probe anchor missing")
          engine=engine.replace(supports_old,supports_new,1)

          configure_old='''    @OptIn(ExperimentalMimeTypeApi::class)
              fun configureRecorder(
                  builder: Recorder.Builder,
                  quality: Quality,
                  profile: Profile,
              ) {
                  if (quality == Quality.FHD) {
                      // Exact R60 primary: do not silently negotiate away from FHD.
                      builder.setQualitySelector(QualitySelector.from(Quality.FHD))
                  }
                  builder.setTargetVideoEncodingBitRate(bitrateFor(quality, profile))
                  if (profile.useHevc) {
                      builder
                          .setVideoCapabilitiesSource(
                              Recorder.VIDEO_CAPABILITIES_SOURCE_CODEC_CAPABILITIES
                          )
                          .setVideoMimeType(MediaFormat.MIMETYPE_VIDEO_HEVC)
                  }
              }
          '''
          configure_new='''    /**
               * CameraX 1.6.1 already has the MIME-aware MediaSpec pipeline internally,
               * but its public Recorder MIME setter arrived only in the API-24 CameraX
               * 1.7 alpha. Keep the accepted API-23 CameraX runtime and set the same
               * pinned MediaSpec value through a guarded, version-locked bridge.
               *
               * Any bridge mismatch throws into the existing R60 retry ladder, which
               * immediately selects H.264 instead of crashing or mislabelling a take.
               */
              private fun setVideoMimeTypeApi23(
                  builder: Recorder.Builder,
                  mimeType: String,
              ) {
                  val mediaSpecField = builder.javaClass
                      .getDeclaredField("mMediaSpecBuilder")
                      .apply { isAccessible = true }
                  val mediaSpecBuilder = checkNotNull(mediaSpecField.get(builder))
                  val consumerType = androidx.core.util.Consumer::class.java
                  val configureVideo = mediaSpecBuilder.javaClass
                      .getMethod("configureVideo", consumerType)
                  val mimeConsumer = androidx.core.util.Consumer<Any> { videoSpecBuilder ->
                      videoSpecBuilder.javaClass
                          .getMethod("setMimeType", String::class.java)
                          .invoke(videoSpecBuilder, mimeType)
                      Unit
                  }
                  configureVideo.invoke(mediaSpecBuilder, mimeConsumer)
              }

              fun configureRecorder(
                  builder: Recorder.Builder,
                  quality: Quality,
                  profile: Profile,
              ) {
                  if (quality == Quality.FHD) {
                      // Exact R60 primary: do not silently negotiate away from FHD.
                      builder.setQualitySelector(QualitySelector.from(Quality.FHD))
                  }
                  builder.setTargetVideoEncodingBitRate(bitrateFor(quality, profile))
                  if (profile.useHevc) {
                      builder.setVideoCapabilitiesSource(
                          Recorder.VIDEO_CAPABILITIES_SOURCE_CODEC_CAPABILITIES
                      )
                      setVideoMimeTypeApi23(builder, MediaFormat.MIMETYPE_VIDEO_HEVC)
                  }
              }
          '''
          if engine.count(configure_old) != 1:
              raise SystemExit("S2.04 STOP: S2.03 recorder anchor missing")
          engine=engine.replace(configure_old,configure_new,1)

          replacements=(
              ('versionCode = 28603','versionCode = 28604'),
              ('versionName = "286.03-r6-section2-03-tiktok-r60-engine-only"',
               'versionName = "286.04-r6-section2-04-tiktok-r60-api23-compat"'),
              ('    val camerax = "1.7.0-alpha03"',
               '    // S2.04: exact accepted API-23 CameraX runtime. The TikTok-only R60\n'
               '    // engine uses CameraX 1.6.1\'s existing MIME-aware MediaSpec pipeline.\n'
               '    val camerax = "1.6.1"'),
          )
          for old,new in replacements:
              if gradle.count(old) != 1:
                  raise SystemExit("S2.04 STOP: Gradle anchor missing: "+old)
              gradle=gradle.replace(old,new,1)

          engine_path.write_text(engine)
          gradle_path.write_text(gradle)
          PY

