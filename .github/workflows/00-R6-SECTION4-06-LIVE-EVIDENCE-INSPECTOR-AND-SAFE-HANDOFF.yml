      - name: Section 3.01 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          G="app/build.gradle.kts"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaSection3MediaContract.kt"
          I="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaMediaInbox.kt"
          E="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaEditorActivity.kt"
          RC="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaReviewedCaptions.kt"
          D="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          MAN="app/src/main/AndroidManifest.xml"

          grep -q 'versionCode = 28630' "$G"
          grep -q '286.30-r6-section3-01-complete-media-suite' "$G"
          grep -q 'minSdk = 23' "$G"

          python3 - "$C" "$I" "$E" "$RC" "$D" "$MAN" <<'PY'
          from pathlib import Path
          import hashlib,sys

          contract,inbox,editor,captions,dual,manifest=[Path(x).read_text() for x in sys.argv[1:]]

          # Exact CLEAN/BRAND pairing and honest, visible state contract.
          for token in (
              'READY("READY • CLEAN + BRAND")',
              'PROCESSING("PROCESSING • BRAND")',
              'MISSING_BRAND("MISSING • BRAND")',
              'MISSING_CLEAN("MISSING • CLEAN")',
              '"_BRAND_LUT_BURN" to Variant.BRAND',
              '"_BRAND" to Variant.BRAND',
              '"_CLEAN" to Variant.CLEAN',
              'if (outputPendingOrEmpty) return State.PROCESSING',
              'if (hasClean && hasBrand) return State.READY',
          ): assert token in contract, token
          assert '"_FINAL_CAPTIONED"' not in contract
          assert '"SOCIAL_MASTER"' not in contract

          for token in (
              "fun findPairedTakes(",
              "MediaStore.Video.Media.IS_PENDING",
              '"${MediaStore.Video.Media.DATE_ADDED} DESC"',
              ".sortedWith(compareByDescending<PairedTake> { it.dateAddedSeconds }",
              "DevelopUgandaSection3MediaContract.resolveState(",
              "BRAND is the review default; an unfinished BRAND falls back to CLEAN.",
          ): assert token in inbox, token
          paired=inbox[inbox.index("fun findPairedTakes("):inbox.index("fun packageVideo(")]
          assert "openOutputStream" not in paired
          assert "contentResolver.delete" not in paired

          # One visible route exposes the whole post-recording sequence.
          for token in (
              "SECTION 3 MEDIA SUITE",
              "MEDIA INBOX • CLEAN / BRAND",
              "OPEN IN EDITOR • $variant DEFAULT",
              "PLAY CLEAN • ORIGINAL",
              "ADD CLEAN TO MARKED JOIN",
              "REVIEW / CONFIRM CAPTIONS",
              "EXPORT FINAL • CAPTIONED BRAND",
              "shareInboxVideo(",
              "forceReview = true",
              "DevelopUgandaReviewedCaptionOverlay(transcript.cues)",
              "FINAL_CAPTIONED.mp4",
              "ORIGINALS PRESERVED",
          ): assert token in editor, token
          assert "forceReview: Boolean = false" in captions
          assert "if (!forceReview && !defaultEnabled(mode))" in captions

          # Existing real editor functions are retained and surfaced: take
          # marks, ordered multi-clip assembly, reviewed caption retiming,
          # final exports and Android sharing.
          for token in (
              "DevelopUgandaTakeMarks.forClip",
              "assembleBrand(",
              "exportWithMedia3(",
              "exportSocialMaster(",
              "SHARE SOCIAL",
          ): assert token in editor, token
          for token in (
              "fun assembleBrand(",
              "DevelopUgandaTranscriptArchive.retimeForAssembly",
              "ASSEMBLY BRAND SAVED",
              "CLEAN SOURCES PRESERVED",
          ): assert token in dual, token

          # Legacy storage access is bounded to Android 9 and below; modern
          # scoped-storage phones continue using app-owned rows/system picker.
          assert manifest.count('android.permission.READ_EXTERNAL_STORAGE') == 1
          assert manifest.count('android.permission.WRITE_EXTERNAL_STORAGE') == 1
          assert manifest.count('android:maxSdkVersion="28"') == 2

          # No label-only implementation: exercise the declared pairing cases
          # against the same suffix order and state decisions required above.
          def parse(name):
              stem=name.rsplit(".",1)[0]
              import re
              stem=re.sub(r" \(\d+\)$","",stem)
              up=stem.upper()
              for suffix,kind in (("_BRAND_LUT_BURN","BRAND"),("_BRAND","BRAND"),("_CLEAN","CLEAN")):
                  if up.endswith(suffix):
                      take=stem[:-len(suffix)].rstrip("_ ")
                      return (take,kind) if take else None
              return None
          clean=parse("MCAM_MAIN_20260921_120000_SEG001_CLEAN.mp4")
          brand=parse("MCAM_MAIN_20260921_120000_SEG001_BRAND_LUT_BURN.mp4")
          duplicate=parse("TIK_TIKTOK_20260921_120000_BRAND_LUT_BURN (1).mp4")
          assert clean==("MCAM_MAIN_20260921_120000_SEG001","CLEAN")
          assert brand==("MCAM_MAIN_20260921_120000_SEG001","BRAND")
          assert duplicate==("TIK_TIKTOK_20260921_120000","BRAND")
          assert parse("MCAM_MAIN_20260921_FINAL_CAPTIONED.mp4") is None
          print("S3.01 FUNCTION GATE • PAIR + REVIEW + JOIN + CAPTION + EXPORT + SHARE")
          PY

