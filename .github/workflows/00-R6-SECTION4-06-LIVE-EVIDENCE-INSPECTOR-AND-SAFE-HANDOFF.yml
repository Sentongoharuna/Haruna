          N="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt"

          grep -q 'versionCode = 28640' "$G"
          grep -q 'versionName = "286.40-r6-section4-02-chronological-workflow-status-lights"' "$G"
          echo "70dee23a0efa6eb37fb098407eb182b28f2afa34f66bce6172851ed70bf3df12  $W" | sha256sum -c -

          python3 - "$W" "$H" "$N" <<'PY'
          from pathlib import Path
          import sys

          workflow,hub,news=(Path(x).read_text() for x in sys.argv[1:])
          required=(
              'R6-S4.02-CHRONOLOGICAL-WORKFLOW-STATUS-LIGHTS',
              'Stage("ASSIGN", "ASSIGNMENT"',
              'Stage("READY", "READINESS"',
              'Stage("CAM", "CAMERA SELECTION"',
              'Stage("REC", "RECORDING"',
              'Stage("REVIEW", "REVIEW"',
              'Stage("OUTPUT", "OUTPUT"',
              'private const val GREEN = 0xFF39E75F',
              'private const val RED = 0xFFFF3B30',
              'private const val BLUE = 0xFF2F80ED',
              'signal == Signal.PROCESSING || signal == Signal.NOT_READY || movementPulse',
              'UNKNOWN NEVER BLOCKS',
              'freeGb in 0L..1L',
              'thermalStatus >= 4',
              'completed_at_',
              'PROCESS_MOVE_MS = 8_000L',
              'FAILURE_MOVE_MS = 4_200L',
              'if (launching) return',
              '}, 850L)',
              'DevelopUgandaV269SmartStoryDeskActivity::class.java',
              'DevelopUgandaCameraHealthActivity::class.java',
              'DevelopUgandaModeProfiles.all()',
              'DevelopUgandaV274MediaVaultActivity::class.java',
              'DevelopUgandaEditorActivity::class.java',
              'CLEAN / BRAND SOURCE SWITCH REMAINS PROTECTED',
          )
          for token in required:
              assert token in workflow, token
          forbidden=(
              'androidx.camera',
              'android.media.MediaCodec',
              'VideoCapture',
              'Recorder.Builder',
              'DevelopUgandaColorEngine.',
              'DevelopUgandaDynamicBurnMonitor.',
          )
          for token in forbidden:
              assert token not in workflow, token
          assert hub.count("DevelopUgandaSection4ChronologicalWorkflow.panel(") == 1
          assert news.count("DevelopUgandaSection4ChronologicalWorkflow.panel(") == 1
          assert "PAGE 1 • ASSIGN / READY / CAMERA / RECORD" in hub
          assert "PAGE 2 • REVIEW / CLEAN-BRAND / OUTPUT" in news
          assert hub.index("DevelopUgandaSection4ChronologicalWorkflow.panel(") < hub.index("buildV28012ProWorkflowConsole()")
          assert news.index("develop.uganda NEWSROOM") < news.index("DevelopUgandaSection4ChronologicalWorkflow.panel(")
          print("S4.02 FUNCTION GATE • VISIBLE SIX-STAGE FLOW + REAL ROUTES + MEASURED LIGHTS")
