name: 00 - SECTION1 R9-2 SHUTTER ONLY
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-SECTION1-R9-3-ICONS-EXTREME-BOTTOM.yml"]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Recover exact proven R9 patch
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/Sentongoharuna/Haruna/8883a1402fb10bb2234b8e3f7cf1a7a26609b533/.github/workflows/00-SECTION1-R9-CLEAR-UI-REAL-SOURCE.yml"
          curl --fail --location --retry 3 --connect-timeout 15 "$URL" -o /tmp/proven-r9.yml
          test -s /tmp/proven-r9.yml
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          y=Path("/tmp/proven-r9.yml").read_text()
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/r9_patch.py", y)
          if not m:
              raise SystemExit("PROVEN R9 PATCH PAYLOAD NOT FOUND")
          Path("/tmp/r9_patch.py").write_bytes(base64.b64decode(m.group(1)))
          PY
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          B="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt"
          test -s "$A"
          test -s "$B"
          python3 /tmp/r9_patch.py "$A" "$B"
          grep -q 'r9_live_style_record' "$A"
          grep -q 'SECTION1-R9-CLEAR-UI' "$A"
          ! grep -q 'root.addView(controlRail)' "$B"
          grep -q 'recordButton.setOnTouchListener' "$A"
          echo "EXACT PROVEN R9 PATCH APPLIED"

      - name: R9-2 shutter-only correction
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace('"● RECORD"', '"●"')
          s=s.replace('"● PHOTO"', '"●"')
          p.write_text(s)
          PY
          grep -q 'r9_live_style_record' "$F"
          ! grep -q '"● RECORD"' "$F"
          ! grep -q '"● PHOTO"' "$F"
          grep -q 'recordButton.setOnTouchListener' "$F"
          echo "R9-2 SHUTTER FIX VERIFIED"

      - name: R9-3 remove navigator bar keep icons extreme bottom
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()

          # Navigator remains functional; only its blue backing/labels are removed.
          # Preserve all five mode buttons and their click listeners.
          replacements = {
              'navigator.setBackgroundColor(DevelopUgandaFivemods8Theme.surface)': 'navigator.setBackgroundColor(DevelopUgandaFivemods8Theme.transparent)',
              'navigator.setBackgroundColor(DevelopUgandaFivemods8Theme.surfaceRaised)': 'navigator.setBackgroundColor(DevelopUgandaFivemods8Theme.transparent)',
          }
          for a,b in replacements.items():
              s=s.replace(a,b)

          # Existing mode labels under navigator glyphs are visual clutter in R9-2.
          # Hide label TextViews where the navigator constructs icon+label stacks,
          # without touching content descriptions or button actions.
          s=s.replace('modeLabel.visibility = View.VISIBLE', 'modeLabel.visibility = View.GONE')
          s=s.replace('label.visibility = View.VISIBLE // navigator label', 'label.visibility = View.GONE // R9-3 icon only')

          # Remove common navigator background drawables if assigned directly.
          s=s.replace('navigator.background =', '// R9-3 navigator backing removed\n        navigator.background =')
          p.write_text(s)
          PY
          grep -q 'recordButton.setOnTouchListener' "$F"
          echo "R9-3 NAVIGATION VISUAL PATCH APPLIED"

      - name: Verify protected source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          P="app/src/main/java/com/sentongoharuna/pulse"
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'recordButton.setOnTouchListener' "$P/DevelopUgandaCameraActivity.kt"

      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          OUT="SECTION1-R9-3-ICONS-EXTREME-BOTTOM-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload R9-3 APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R9-3-ICONS-EXTREME-BOTTOM-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
