name: Build develop.uganda five-mode APK

on:
  workflow_dispatch:
  push:
    paths:
      - develop_uganda_five_mode_source.zip
      - .github/workflows/build-develop-uganda-five-mode.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unpack five-mode source
        run: unzip -q develop_uganda_five_mode_source.zip -d source
      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: develop-uganda-five-mode-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
