      - name: Set V280-19 FIX1 artifact-delivery version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERSION'
          from pathlib import Path
          p=Path('v172-source/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          if 'versionCode = 28190' not in s:
              raise SystemExit('Expected V280/19 versionCode 28190 before FIX1 bump')
          if 'versionName = "280.19-field-reliability-production-qa-master"' not in s:
              raise SystemExit('Expected V280/19 versionName before FIX1 bump')
          s=s.replace('versionCode = 28190','versionCode = 28191',1)
          s=s.replace(
              'versionName = "280.19-field-reliability-production-qa-master"',
              'versionName = "280.19.1-apk-artifact-delivery"',
              1
          )
          p.write_text(s,encoding='utf-8')
          print('PASS: V280/19 FIX1 version metadata set.')
          PYVERSION

      - name: Verify V280-19 field reliability, preservation, routes, and stable core
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          HUB="$SRC/DevelopUgandaGeneralHubActivity.kt"
          V13="$SRC/DevelopUgandaV28013StableMasterRefinement.kt"
          V18="$SRC/DevelopUgandaV28018LiveOperatorIntelligence.kt"
          V19="$SRC/DevelopUgandaV28019FieldReliability.kt"
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT13='v172-source/V280-13-PRO-STABLE-MASTER-REFINEMENT-AUDIT.txt'
          AUDIT18='v172-source/V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH-AUDIT.txt'
          AUDIT19='v172-source/V280-19-FIELD-RELIABILITY-PRODUCTION-QA-AUDIT.txt'

          test -s "$V13"
          test -s "$V18"
          test -s "$V19"
          test -s "$AUDIT13"
          test -s "$AUDIT18"
          test -s "$AUDIT19"

          grep -q 'develop.uganda • V280/19 FIELD RELIABILITY MASTER' "$HUB"
          grep -q 'V280/19 • FIELD RELIABILITY + PRODUCTION QA' "$HUB"
          grep -q 'FIELD QA' "$HUB"
          grep -q 'DevelopUgandaV28019FieldReliability.beginSession' "$HUB"
          grep -q 'DevelopUgandaV28019FieldReliability.markHubResume' "$HUB"
          grep -q 'DevelopUgandaV28019FieldReliability.report' "$HUB"
          grep -q 'fun beginSession' "$V19"
          grep -q 'fun markHubResume' "$V19"
          grep -q 'fun report' "$V19"
          grep -q 'fun fullReport' "$V19"
          grep -q 'NO RUNTIME FAULT THIS SESSION' "$V19"
          grep -q 'versionCode = 28191' "$GRADLE"
          grep -q 'versionName = "280.19.1-apk-artifact-delivery"' "$GRADLE"

          # Working V280/18 intelligence remains present.
          grep -q 'fun sessionBar' "$V18"
          grep -q 'fun alert' "$V18"
          grep -q 'fun directorBrief' "$V18"
          grep -q 'fun continuityBrief' "$V18"

          # Proven capture/audio/safety path remains untouched and present.
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          ! grep -q 'AudioRecord.Builder()' "$CAM"

          # Key protected systems remain present.
          for f in \
            DevelopUgandaV262RemoteDirector.kt \
            DevelopUgandaV263MultiCamDirector.kt \
            DevelopUgandaV264LiveCutDirector.kt \
            DevelopUgandaV265ProxySyncReview.kt \
            DevelopUgandaV269SmartStoryDesk.kt \
            DevelopUgandaV274MediaVault.kt \
            DevelopUgandaV277LightingExposure.kt \
            DevelopUgandaV280SmartDirector.kt \
            DevelopUgandaV28012RuntimeGuard.kt \
            DevelopUgandaV28012SafeActions.kt
          do
            test -s "$SRC/$f"
          done

          # No empty click handlers and every routed Activity resolves.
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import re
          root=Path('v172-source')
          src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest))
          routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t):
                  empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty:
              raise SystemExit('Route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          print('PASS: %d routed Activities resolve; no empty click handlers.' % len(routes))
          PYAUDIT
          echo 'PASS: V280/19 field QA, routes, V280/18 intelligence, Director stack, and protected recording/audio core verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-19 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28019-build.log

      - name: Prepare and verify V280-19 FIX1 APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DEVELOP-UGANDA-V280-19-FIX1-APK-ARTIFACT-DELIVERY.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          echo "PASS: APK exists and is non-empty."
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload V280-19 FIX1 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-19-FIX1-APK-ARTIFACT-DELIVERY
          path: DEVELOP-UGANDA-V280-19-FIX1-APK-ARTIFACT-DELIVERY.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload V280-19 audits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-19-FIELD-RELIABILITY-PRODUCTION-QA-AUDITS
          path: |
            v172-source/V280-11-FULL-PRESERVATION-AUDIT.txt
            v172-source/V280-12-PRO-WORKFLOW-AUDIT.txt
            v172-source/V280-12-FIX1-RUNTIME-AUDIT.txt
            v172-source/V280-12-FIX2-PHONE-CRASH-AUDIT.txt
            v172-source/V280-12-FIX3-FULL-FUNCTION-BUTTON-AUDIT.txt
            v172-source/V280-13-PRO-STABLE-MASTER-REFINEMENT-AUDIT.txt
            v172-source/V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH-AUDIT.txt
            v172-source/V280-19-FIELD-RELIABILITY-PRODUCTION-QA-AUDIT.txt
          retention-days: 14

      - name: Upload V280-19 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-19-FIX1-BUILD-LOG
          path: v172-source/v28019-build.log
          if-no-files-found: ignore
          retention-days: 7
