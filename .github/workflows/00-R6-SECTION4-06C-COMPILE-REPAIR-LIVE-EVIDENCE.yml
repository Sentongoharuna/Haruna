name: R6 SECTION4 06C - COMPILE REPAIR LIVE EVIDENCE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-R6-SECTION4-06C-COMPILE-REPAIR-LIVE-EVIDENCE.yml"]
permissions:
  contents: read
concurrency:
  group: r6-section4-06c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Restore exact accepted S4.05 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=".github/workflows/00-R6-SECTION4-05-EXACT-SESSION-BINDING-AND-6-STAGE-TIMELINE.yml"
          test -s "$BASE"
          echo "746e1b56196d26932abc3ccebebcc9369e94c887242dce25e37f70cd1d811792  $BASE" | sha256sum -c -

          # Execute the locked S4.05 source recipe without copying its 543 KB
          # payload into this workflow. The same 14 forward source steps run
          # in their original order; final exact hashes consolidate the old
          # intermediate gates after restoration.
          python3 - "$BASE" <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          source = Path(sys.argv[1]).read_text().splitlines()
          steps = []
          current_name = None
          index = 0
          while index < len(source):
              line = source[index]
              if line.startswith("      - name: "):
                  current_name = line.split(": ", 1)[1]
              if current_name and line == "        run: |":
                  index += 1
                  body = []
                  while index < len(source):
                      candidate = source[index]
                      if not candidate.strip():
                          body.append("")
                          index += 1
                          continue
                      if not candidate.startswith("          "):
                          break
                      body.append(candidate[10:])
                      index += 1
                  steps.append((current_name, "\n".join(body) + "\n"))
                  continue
              index += 1

          recipe = (
              "Restore exact accepted S2.03 over R6 forward snapshot",
              "Section 2.04 repair R60 for API23 CameraX",
              "Section 2.05 stronger LUTs and full-detail BRAND companion",
              "Section 2.06 make the visible LUT burn output authoritative",
              "Section 2.07 serialize BRAND before every secondary export",
              "Section 2.08 replace fragile text stack with one permanent GPS burn texture",
              "Section 2.09 add visible dynamic monitor and timestamp burn",
              "Section 2.10 interview report-only graphics and event signals",
              "Section 3.01 complete Media Inbox editor and delivery",
              "Section 3.02 persistent CLEAN BRAND switch and safe source routing",
              "Section 4.02 visible chronological workflow and event lights",
              "Section 4.03 Live Coach navigation and friendly workflow pages",
              "Section 4.04 project workflow resume and recovery",
              "Section 4.05 exact session binding and six-stage timeline",
          )
          scripts = dict(steps)
          missing = [name for name in recipe if name not in scripts]
          if missing:
              raise SystemExit("COMPACT STOP: missing S4.05 recipe steps: " + ", ".join(missing))
          executed = []
          environment = os.environ.copy()
          environment.setdefault("GITHUB_RUN_NUMBER", "0")
          for name in recipe:
              script = scripts[name]
              if name == "Section 4.05 exact session binding and six-stage timeline":
                  # The accepted S4.04 recipe produces these two exact inputs.
                  # The oversized S4.05 file carried stale pre/final assertions
                  # for Media Vault and the already-single-line hub, even though
                  # its forward patch applies cleanly and produces the intended
                  # final Vault. Correct only those two assertions before replay.
                  corrections = (
                      (
                          "5c907b008d382aa767c0074f0929784a7f7101272935df93044e2209fb7e82f9",
                          "62e1574e8aad8c0d22764442d3063c328ee988739e42cefd23faf7cddbec17ac",
                      ),
                      (
                          "58ea5a6d07d5dfb2eee8f58fb0777e9ae6d12dd0518082126f09762a6d5d1e02",
                          "94d4f9b90fb15c8b17aa0f51d146a0d324d3fc408ff66297b76a71bc5a74c2aa",
                      ),
                  )
                  for stale, exact in corrections:
                      if script.count(stale) != 1:
                          raise SystemExit("COMPACT STOP: stale S4.05 assertion changed: " + stale)
                      script = script.replace(stale, exact, 1)
              print(f"::group::{name}", flush=True)
              subprocess.run(
                  ["bash"],
                  input=script,
                  text=True,
                  check=True,
                  cwd=Path.cwd(),
                  env=environment,
              )
              print("::endgroup::", flush=True)
              executed.append(name)

          if tuple(executed) != recipe:
              raise SystemExit("COMPACT STOP: exact S4.05 source recipe was not fully executed")
          print("EXACT S4.05 BASELINE RESTORED • 14 LOCKED FORWARD STEPS")
          PY

          sha256sum -c /tmp/s405-intentional.sha256
          sha256sum -c /tmp/s404-forward-protected.sha256

