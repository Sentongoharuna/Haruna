      - name: Update stale title contract and verify protected source
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT="ci/verify_source_contracts.py"
          python3 - "$CONTRACT" <<'PY'
          from pathlib import Path
          import sys

          contract = Path(sys.argv[1])
          source = contract.read_text()
          stale = "need('develop.uganda • V285 FIELD MASTER' in read(\"DevelopUgandaGeneralHubActivity.kt\"),"
          current = "need('develop.uganda • V286.44 FIELD PROOF MASTER' in read(\"DevelopUgandaGeneralHubActivity.kt\"),"
          if source.count(stale) != 1:
              raise SystemExit("S4.06B STOP: stale V285 title contract missing or ambiguous")
          contract.write_text(source.replace(stale, current, 1))
          print("SOURCE CONTRACT FORWARDED FROM V285 TO V286.44")
          PY
          python3 "$CONTRACT"

