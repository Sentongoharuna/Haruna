      - name: S4.06C repair missing asynchronous ghost-reference API
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV272FieldSoundContinuity.kt"
          V="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV274MediaVault.kt"
          echo "67fc075573529d8e9063211c5269408ebb21ae044d7a0c17243f64daabf689f6  $F" | sha256sum -c -
          echo "21e8617c3ba784894e444b602b67c110f0a97623dc6d2d32198c4ec968229ada  $V" | sha256sum -c -

          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          source = target.read_text()

          import_old = '''import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.view.View'''
          import_new = '''import android.media.AudioTrack
          import android.media.MediaMetadataRetriever
          import android.media.MediaRecorder
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.view.View'''
          if source.count(import_old) != 1:
              raise SystemExit("S4.06C STOP: V272 media import anchor missing or ambiguous")
          source = source.replace(import_old, import_new, 1)

          attach_anchor = "    fun attach(activity: DevelopUgandaCameraActivity, root: FrameLayout) {"
          if source.count(attach_anchor) != 1:
              raise SystemExit("S4.06C STOP: V272 attach anchor missing or ambiguous")
          helper = '''    fun saveReferenceFromTakeAsync(
                  context: Context,
                  takeUri: Uri,
                  takeId: String,
                  project: String,
                  sourceDateUtc: String,
                  state: JSONObject,
                  onComplete: (Boolean) -> Unit,
              ) {
                  thread(name = "du-ghost-reference", isDaemon = true) {
                      val saved = runCatching {
                          val retriever = MediaMetadataRetriever()
                          var frame: Bitmap? = null
                          try {
                              retriever.setDataSource(context, takeUri)
                              val durationMs = retriever
                                  .extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)
                                  ?.toLongOrNull()
                                  ?.coerceAtLeast(0L)
                                  ?: 0L
                              val frameAtUs = if (durationMs > 0L) {
                                  (durationMs / 3L).coerceAtLeast(250L) * 1_000L
                              } else {
                                  0L
                              }
                              frame = retriever.getFrameAtTime(
                                  frameAtUs,
                                  MediaMetadataRetriever.OPTION_CLOSEST_SYNC,
                              )
                              val bitmapSaved = saveReferenceBitmap(context, frame)
                              if (bitmapSaved) {
                                  state
                                      .put("take_id", takeId)
                                      .put("project", project)
                                      .put("source_date_utc", sourceDateUtc)
                                      .put("reference_origin", "MEDIA_VAULT_TAKE")
                                  saveState(context, state)
                              }
                              bitmapSaved
                          } finally {
                              runCatching { frame?.recycle() }
                              runCatching { retriever.release() }
                          }
                      }.getOrDefault(false)
                      Handler(Looper.getMainLooper()).post { onComplete(saved) }
                  }
              }

          '''
          source = source.replace(attach_anchor, helper + attach_anchor, 1)
          target.write_text(source)
          PY

