        run: |
          set -euo pipefail
          G="app/build.gradle.kts"
          H="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaGeneralHubActivity.kt"
          N="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaNewsroomActivity.kt"
          W4="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaSection4ProjectWorkflow.kt"
          S="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV269SmartStoryDesk.kt"
          V="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV274MediaVault.kt"

          echo "be0de58b3b41ad5f29afae4209ad37c7bea300091fb3a97a2925c699c040e76a  $W4" | sha256sum -c -
          echo "c036d55e7980491d2401e74aa57d56f785de608c767f90dce09f5f4d06dfaeb6  $S" | sha256sum -c -
          echo "21e8617c3ba784894e444b602b67c110f0a97623dc6d2d32198c4ec968229ada  $V" | sha256sum -c -
          echo "392f635c7ec68127916ba6b5447bbbbd9349a46b946d56b832a8077a6490fe3e  $G" | sha256sum -c -
