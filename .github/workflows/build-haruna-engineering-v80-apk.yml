name: Build Haruna Engineering V80 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-haruna-engineering-v80-apk.yml"
      - "haruna_app_v80.html"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Haruna Engineering V80 app
        shell: bash
        run: |
          mkdir -p www
          if [ -f "haruna_app_v80.html" ]; then
            cp haruna_app_v80.html www/index.html
          elif [ -f ".github/workflows/haruna-engineering-v80-apk.yml" ] && head -n 1 .github/workflows/haruna-engineering-v80-apk.yml | grep -qi '<!DOCTYPE html>'; then
            echo "Using the existing V80 HTML that was accidentally saved as a workflow file."
            cp .github/workflows/haruna-engineering-v80-apk.yml www/index.html
          else
            echo "Haruna Engineering V80 HTML source was not found."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor Android project
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "haruna-engineering-v80",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.harunaengineering.app",
            "appName": "Haruna Engineering",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Set V80 Android version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          text = text.replace("versionCode 1", "versionCode 80")
          text = text.replace('versionName "1.0"', 'versionName "1.0-v80"')
          text = text.replace("versionCode = 1", "versionCode = 80")
          text = text.replace('versionName = "1.0"', 'versionName = "1.0-v80"')
          p.write_text(text)
          PY

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Haruna-Engineering-V80.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haruna-Engineering-V80-APK
          path: output/Haruna-Engineering-V80.apk
          if-no-files-found: error
          retention-days: 30
