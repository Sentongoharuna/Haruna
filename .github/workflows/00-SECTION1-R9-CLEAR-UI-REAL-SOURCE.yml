name: 00 - SECTION1 R9 CLEAR UI REAL SOURCE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-SECTION1-R9-CLEAR-UI-REAL-SOURCE.yml"]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Apply R9 real camera UI source changes
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          B="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt"
          test -s "$A"; test -s "$B"
          echo '' | base64 -d > /tmp/r9_patch.py
          python3 /tmp/r9_patch.py "$A" "$B"
          grep -q 'r9_live_style_record' "$A"
          grep -q 'SECTION1-R9-CLEAR-UI' "$A"
          ! grep -q 'root.addView(controlRail)' "$B"
          grep -q 'recordButton.setOnTouchListener' "$A"
      - name: Verify protected source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          P="app/src/main/java/com/sentongoharuna/pulse"
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'recordButton.setOnTouchListener' "$P/DevelopUgandaCameraActivity.kt"
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          OUT="SECTION1-R9-CLEAR-UI-REAL-SOURCE-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R9-CLEAR-UI-REAL-SOURCE-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
