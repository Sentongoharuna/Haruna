name: R3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/R3.yml"]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Restore exact proven R9 clean base
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/Sentongoharuna/Haruna/8883a1402fb10bb2234b8e3f7cf1a7a26609b533/.github/workflows/00-SECTION1-R9-CLEAR-UI-REAL-SOURCE.yml"
          curl --fail --location --retry 3 --connect-timeout 15 "$URL" -o /tmp/proven-r9.yml
          python3 - <<'PY'
          from pathlib import Path
          import re,base64
          y=Path("/tmp/proven-r9.yml").read_text()
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/r9_patch.py",y)
          if not m: raise SystemExit("PROVEN R9 PATCH PAYLOAD NOT FOUND")
          Path("/tmp/r9_patch.py").write_bytes(base64.b64decode(m.group(1)))
          PY
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          B="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt"
          python3 /tmp/r9_patch.py "$A" "$B"
          grep -q 'r9_live_style_record' "$A"
          grep -q 'recordButton.setOnTouchListener' "$A"

      - name: Apply R9-2 R9-4 and R9-5 refinements
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          F12="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods12FieldUi.kt"
          python3 - "$A" "$F12" <<'PY'
          from pathlib import Path
          import sys,re
          a=Path(sys.argv[1]); s=a.read_text()
          f=Path(sys.argv[2]); u=f.read_text()

          # R9-2: dot-only shutter.
          s=s.replace('"● RECORD"','"●"').replace('"● PHOTO"','"●"')

          # R9-4: compact F12 strip and suppress duplicate narration.
          u=u.replace("setPadding(dp(6), dp(4), dp(6), dp(4))","setPadding(dp(4), dp(2), dp(4), dp(2))",1)
          u=u.replace("LinearLayout.LayoutParams(0, dp(22), 1f)","LinearLayout.LayoutParams(0, dp(18), 1f)")
          u=u.replace("LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(22))","LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(18))")
          marker="        f12CameraShell?.updateBroadcastStatus(f12Status)\n"
          if marker in s:
              s=s.replace(marker,marker+"        if (::previewNarrationPanel.isInitialized) previewNarrationPanel.visibility = View.GONE\n",1)

          # R9-5: true bare circular shutter. No rectangular backing.
          start=s.find("    private fun makeRecordButton(): Button {")
          end=s.find("    private fun space(width: Int): View {",start)
          if start<0 or end<0: raise SystemExit("record button function missing")
          b=s[start:end]
          b=re.sub(r'minWidth = dp\(\d+\)', 'minWidth = dp(72)', b)
          b=re.sub(r'minHeight = dp\(\d+\)', 'minHeight = dp(72)', b)
          b=re.sub(r'minimumWidth = dp\(\d+\)', 'minimumWidth = dp(72)', b)
          b=re.sub(r'minimumHeight = dp\(\d+\)', 'minimumHeight = dp(72)', b)
          b=b.replace("shape = GradientDrawable.RECTANGLE","shape = GradientDrawable.OVAL")
          b=re.sub(r'\s*cornerRadius\s*=.*\n','\n',b)
          s=s[:start]+b+s[end:]

          # Remove solid navigator backing globally only where it uses theme surface;
          # child icons and listeners are untouched.
          s=s.replace("setBackgroundColor(DevelopUgandaFivemods8Theme.surface)","setBackgroundColor(DevelopUgandaFivemods8Theme.transparent)")
          s=s.replace("setBackgroundColor(DevelopUgandaFivemods8Theme.surfaceRaised)","setBackgroundColor(DevelopUgandaFivemods8Theme.transparent)")

          a.write_text(s); f.write_text(u)
          PY
          grep -q 'r9_live_style_record' "$A"
          grep -q 'recordButton.setOnTouchListener' "$A"
          ! grep -q '"● RECORD"' "$A"
          ! grep -q '"● PHOTO"' "$A"
          echo "R9-5 FINAL CLEAN TRANSPORT VERIFIED"

      - name: R3 apply requested bottom layout after R9-5
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          N="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt"
          python3 - "$A" "$N" <<'PY'
          from pathlib import Path
          import sys
          a=Path(sys.argv[1]); n=Path(sys.argv[2])
          s=a.read_text(); nav=n.read_text()

          # Anchor specifically inside the visible v237 action row.
          row=s.find('tag = "v237_camera_action_row"')
          if row < 0: raise SystemExit("R3 STOP: action-row anchor missing")
          start=s.find("        actionRow.addView(",row)
          end=s.find("        bottomDeck.addView(actionRow)",start)
          if start < 0 or end < 0: raise SystemExit("R3 STOP: action-row children missing")
          old=s[start:end]
          if not all(x in old for x in ("lensButton","reportRecordArea","torchButton")):
              raise SystemExit("R3 STOP: unexpected visible action row")

          new = (
              "        // R3: shutter alone above five icons.\n"
              "        actionRow.addView(\n"
              "            reportRecordArea,\n"
              "            wrap(150, 62)\n"
              "        )\n\n"
          )
          s=s[:start]+new+s[end:]

          # R9-5 intentionally made shutter circular; change only this final geometry.
          f0=s.find("    private fun makeRecordButton(): Button {")
          f1=s.find("    private fun space(width: Int): View {",f0)
          if f0 < 0 or f1 < 0: raise SystemExit("R3 STOP: makeRecordButton missing")
          f=s[f0:f1]
          f=f.replace("shape = GradientDrawable.OVAL","shape = GradientDrawable.RECTANGLE")
          if "shape = GradientDrawable.RECTANGLE" not in f:
              raise SystemExit("R3 STOP: rectangle conversion failed")
          if "cornerRadius" not in f:
              f=f.replace("shape = GradientDrawable.RECTANGLE",
                          "shape = GradientDrawable.RECTANGLE\n                    cornerRadius = dp(14).toFloat()",1)
          s=s[:f0]+f+s[f1:]
          s=s.replace('"● RECORD"','"●"').replace('"● PHOTO"','"●"')

          # Remove the navigator panel and labels, preserving five click targets and 850ms handoff.
          pairs=[
            ("setBackgroundColor(DevelopUgandaFivemods8Theme.surfaceScrim(240))","setBackgroundColor(Color.TRANSPARENT)"),
            ("setBackgroundColor(DevelopUgandaFivemods8Theme.outlineScrim(53))","setBackgroundColor(Color.TRANSPARENT)"),
            ("translationY = dp(10).toFloat()","translationY = 0f"),
            ("setPadding(dp(8), dp(4), dp(8), dp(4))","setPadding(dp(8), 0, dp(8), 0)"),
            ("canvas.drawText(code, width * 0.5f, height * 0.98f, codePaint)","// R3 icon only; dot retained.")
          ]
          for before,after in pairs:
              if before not in nav: raise SystemExit("R3 STOP: navigator anchor missing: "+before)
              nav=nav.replace(before,after,1)

          active = '''if (active) {
                DevelopUgandaFivemods8Theme.surfaceRaised
            } else {
                DevelopUgandaFivemods8Theme.transparent
            }'''
          if active in nav:
              nav=nav.replace(active,"DevelopUgandaFivemods8Theme.transparent",1)

          a.write_text(s); n.write_text(nav)
          PY

      - name: R3 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          N="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt"
          python3 - "$A" "$N" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(); n=Path(sys.argv[2]).read_text()
          row=s.index('tag = "v237_camera_action_row"')
          start=s.index("actionRow.addView(",row)
          end=s.index("bottomDeck.addView(actionRow)",start)
          b=s[start:end]
          assert b.count("actionRow.addView(")==1
          assert "reportRecordArea" in b
          assert "lensButton" not in b
          assert "torchButton" not in b
          f0=s.index("private fun makeRecordButton(): Button")
          f1=s.index("private fun space(width: Int): View",f0)
          f=s[f0:f1]
          assert "GradientDrawable.RECTANGLE" in f
          assert "GradientDrawable.OVAL" not in f
          assert "surfaceScrim(240)" not in n
          assert "outlineScrim(53)" not in n
          assert "canvas.drawText(code," not in n
          assert "CAMERA_HANDOFF_SETTLE_MS = 850L" in n
          print("R3 VERIFIED")
          PY
          ! grep -q '"● RECORD"' "$A"
          ! grep -q '"● PHOTO"' "$A"

      - name: Verify protected contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          grep -q 'tag = "f12_status_strip"' app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods12FieldUi.kt
          grep -q 'recordButton.setOnTouchListener' app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt

      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          OUT="R3-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: R3-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
