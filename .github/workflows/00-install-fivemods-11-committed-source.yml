name: 00 - INSTALL FIVEMODS 11 COMMITTED SOURCE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-fivemods-11-committed-source
  cancel-in-progress: false

jobs:
  install-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          source_zip="Develop-Uganda-FIVEMODS-11-Committed-Source.zip"
          test -s "$source_zip"
          echo "dc56134a3093fe9f47cd8b5d16ae7395885eb97392c580d5ab6178ae6c115e2d  $source_zip" | sha256sum --check --strict

      - name: Install ordinary source and archive legacy workflows
        shell: bash
        run: |
          set -euo pipefail
          source_zip="Develop-Uganda-FIVEMODS-11-Committed-Source.zip"
          staging="$(mktemp -d)"
          trap 'rm -rf -- "$staging"' EXIT
          unzip -q "$source_zip" -d "$staging"
          source_root="$staging/Develop-Uganda-FIVEMODS-11"
          test -f "$source_root/app/build.gradle.kts"
          test -f "$source_root/ci/verify_source_contracts.py"

          mkdir -p archive/workflows .github/workflows
          shopt -s nullglob
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            base="$(basename "$workflow")"
            case "$base" in
              00-install-fivemods-11-committed-source.yml|00-build-develop-uganda-committed-source.yml)
                continue
                ;;
            esac
            destination="archive/workflows/${base}.disabled"
            if git ls-files --error-unmatch "$workflow" >/dev/null 2>&1; then
              git mv "$workflow" "$destination"
            else
              mv "$workflow" "$destination"
            fi
          done

          rsync -a --delete "$source_root/app/" app/
          rsync -a --delete "$source_root/ci/" ci/
          rsync -a --delete "$source_root/baseline/" baseline/
          rsync -a "$source_root/archive/" archive/
          find "$source_root" -maxdepth 1 -type f -exec cp -f -- {} ./ \;

          # The build workflow is supplied separately and is deliberately kept
          # visible at the top of Actions. No patch stack is copied back.
          test -f .github/workflows/00-build-develop-uganda-committed-source.yml
          python3 ci/verify_source_contracts.py

          git rm -f --ignore-unmatch "$source_zip"
          if test -e "$source_zip"; then rm -f -- "$source_zip"; fi

      - name: Commit ordinary source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "develop.uganda build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIVEMODS 11: import verified ordinary source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
