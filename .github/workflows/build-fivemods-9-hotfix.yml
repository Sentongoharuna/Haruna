name: Build Develop Uganda FIVEMODS 9 hotfix APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-fivemods-9-hotfix.yml"
      - "develop_uganda_five_mode_source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Rebuild FIVEMODS 8 snapshot and apply FIVEMODS 9 hotfix
        shell: bash
        run: |
          set -euo pipefail
          test -f develop_uganda_five_mode_source.zip
          rm -rf source .fivemods9hotfix
          unzip -q develop_uganda_five_mode_source.zip -d source
          mkdir -p .fivemods9hotfix
