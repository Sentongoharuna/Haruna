          FIVEMODS_7_PATCH

          # Preserve the compile repair required by the older source ZIP.
          perl -0pi -e 's/\bselectAllOnFocus\s*=\s*true\b/setSelectAllOnFocus(true)/g' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStatusPolicy.kt

          # The app still opens at the established hub, not a camera page.
          grep -F 'android:name=".DevelopUgandaGeneralHubActivity"' source/app/src/main/AndroidManifest.xml
          grep -F '<category android:name="android.intent.category.LAUNCHER"/>' source/app/src/main/AndroidManifest.xml

          # Fivemods.7 keeps named defaults together, while using the existing
          # per-mode report-camera preferences for its new editable keys.
          test -f source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          test -f source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Mp4FastStart.kt
          grep -F 'TIKTOK_UPLOAD_TARGET_BITRATE_BPS = 12_000_000' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'TIKTOK_UPLOAD_FLOOR_BITRATE_BPS = 8_000_000' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'TIKTOK_DEFAULT_UPLOAD_CAP_MB = 72' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'develop_uganda_report_camera_' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          ! grep -F 'develop_uganda_fivemods7_encoder_profiles' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'STATUS_DEFAULT_SEGMENT_SECONDS = 30' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'STATUS_DEFAULT_READY_CAP_MB = 14' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'STATUS_HARD_LIMIT_MB = 16' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'INTERVIEW_DEFAULT_FPS = 30' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt
          grep -F 'INTERVIEW_OPTIONAL_FPS = 24' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods7Settings.kt

          # Platform delivery copies are fresh H.264/AAC CBR renders with MP4
          # metadata at the front. CameraX clean masters are not rewritten.
          grep -F 'BITRATE_MODE_CBR' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt
          grep -F 'Fivemods7Mp4FastStart.ensure' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt
          grep -F 'TikTok clip is too long' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt
          grep -F 'statusSegmentDurationMs' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStatusPolicy.kt
          grep -F 'MimeTypes.VIDEO_H265' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewAnnotatedExporter.kt
          grep -F 'Observed physical signals only. Not an indicator of truthfulness.' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewHudView.kt

          # Main Cam and Live Cam do not consume Fivemods.7 profiles.
          ! grep -F 'Fivemods7' source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaLiveActivity.kt

      - name: Build fivemods.7 debug APK
        working-directory: source
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: fivemods.7-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
