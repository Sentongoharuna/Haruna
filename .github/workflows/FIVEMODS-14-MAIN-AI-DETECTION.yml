name: FIVEMODS 14 - MAIN AI Detection Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Add ML Kit dependencies and MAIN camera detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('app/build.gradle.kts')
          s=gradle.read_text()
          assert 'dependencies {' in s
          for dependency in ['com.google.mlkit:pose-detection:18.0.0-beta5','com.google.mlkit:text-recognition:16.0.1']:
              if dependency not in s: s=s.replace('dependencies {',f'dependencies {{\n    implementation("{dependency}")',1)
          gradle.write_text(s)
          activity=Path('app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt')
          s=activity.read_text()
          anchor='        v261ApplyAnamorphicPreview()'
          assert anchor in s, 'MAIN preview anchor missing: stop, do not produce unchanged APK'
          if 'duAiDetectionController' not in s:
              cls='open class DevelopUgandaCameraActivity : AppCompatActivity(), SensorEventListener {'
              assert cls in s
              s=s.replace(cls,cls+'\n    private var duAiDetectionController: DevelopUgandaAiDetectionController? = null',1)
              s=s.replace(anchor,anchor+'''\n        // MAIN-only screen overlay; the video encoder and camera bindings remain unchanged.\n        if (this.javaClass == DevelopUgandaCameraActivity::class.java) {\n            duAiDetectionController = DevelopUgandaAiDetectionController(this, root, previewView)\n            duAiDetectionController?.attach()\n        }\n''',1)
          activity.write_text(s)
          PY
          mkdir -p app/src/main/java/com/sentongoharuna/pulse
          echo "" | base64 -d > app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaAiDetectionController.kt
          git diff --stat
          grep -q 'duAiDetectionController?.attach()' app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt
      - name: Compile and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-14-MAIN-AI-DETECTION-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload change evidence
        if: always()
        run: git diff > /tmp/fivemods-14-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FIVEMODS-14-SOURCE-DIFF
          path: /tmp/fivemods-14-diff.txt
          if-no-files-found: warn
