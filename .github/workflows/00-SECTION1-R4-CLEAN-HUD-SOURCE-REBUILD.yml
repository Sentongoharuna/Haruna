name: 00 - SECTION1 R4 CLEAN HUD SOURCE REBUILD
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-SECTION1-R4-CLEAN-HUD-SOURCE-REBUILD.yml"]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: R4 rebuild actual camera chrome
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt"
          test -s "$F"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          start='            listOf(cleanButton, lockButton, markButton, guideButton, handButton, nightButton, dimButton).forEach {'
          a=s.find(start)
          if a<0: raise SystemExit("legacy rail source block not found")
          b=s.find('            applyChromeColor()',a)
          if b<0: raise SystemExit("legacy rail end not found")
          replacement='''            // SECTION1-R4: permanent legacy rail removed from preview.
            // The existing Activity recordButton remains the real record control.
            controlRail.visibility = View.GONE
'''
          s=s[:a]+replacement+s[b:]
          s=s.replace('visibility = if (prefs.getBoolean("guides", false)) View.VISIBLE else View.GONE','visibility = View.GONE',1)
          p.write_text(s)
          PY
          grep -q 'SECTION1-R4: permanent legacy rail removed from preview' "$F"
          ! grep -q 'root.addView(controlRail)' "$F"
      - name: Verify R4 single HUD owner and recording preservation
        shell: bash
        run: |
          set -euo pipefail
          P="app/src/main/java/com/sentongoharuna/pulse"
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'DevelopUgandaFivemods12CameraShell.attach' "$P/DevelopUgandaCameraActivity.kt"
          grep -q 'DevelopUgandaFivemods12CameraShell.attach' "$P/DevelopUgandaLiveActivity.kt"
          grep -q 'recordButton' "$P/DevelopUgandaCameraActivity.kt"
          echo "R4 SOURCE UI CHANGE PRESENT"
      - name: Verify protected source contracts
        run: python3 ci/verify_source_contracts.py
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          OUT="SECTION1-R4-CLEAN-HUD-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R4-CLEAN-HUD-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
