          test -f source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewHudView.kt
          python3 - <<'PYTHON'
          from pathlib import Path
          policy = Path("source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStatusPolicy.kt")
          source = policy.read_text(encoding="utf-8")
          old = "selectAllOnFocus = true"
          new = "setSelectAllOnFocus(true)"
          if old in source:
              source = source.replace(old, new)
              policy.write_text(source, encoding="utf-8")
          verified = policy.read_text(encoding="utf-8")
          if old in verified or new not in verified:
              raise SystemExit("Status Policy select-all compatibility repair was not verified")
          PYTHON
          python3 .fivemods9hotfix/repair_existing_f9.py finish

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Name and checksum the repaired APK
        run: |
          set -euo pipefail
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          cp source/app/build/outputs/apk/debug/app-debug.apk f9-repair-audit/FIVEMODS-9-Interview-Home-Repair.apk
          cd f9-repair-audit
          sha256sum FIVEMODS-9-Interview-Home-Repair.apk > APK-SHA256.txt

      - name: Upload FIVEMODS 9 Interview and workflow home repair APK
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-9-Interview-Home-Repair-${{ github.run_number }}
          path: |
            f9-repair-audit/FIVEMODS-9-Interview-Home-Repair.apk
            f9-repair-audit/APK-SHA256.txt
            f9-repair-audit/verification.json
            f9-repair-audit/source-repairs.diff
          if-no-files-found: error

      - name: Upload repair verification and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-9-Repair-Checks-${{ github.run_number }}
          path: |
            f9-repair-audit/*.json
            f9-repair-audit/*.diff
            f9-repair-audit/*.patch
          if-no-files-found: error
