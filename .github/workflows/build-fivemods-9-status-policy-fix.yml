          def verify_home():
              ns = '{http://schemas.android.com/apk/res/android}'
              manifest = ET.fromstring(read(SOURCE / 'app/src/main/AndroidManifest.xml'))
              registered = {a.get(ns + 'name') for a in manifest.findall('application/activity')}
              launchers = [a.get(ns + 'name') for a in manifest.findall('application/activity')
                           if any(c.get(ns + 'name') == 'android.intent.category.LAUNCHER' for c in a.findall('intent-filter/category'))]
              require(launchers == ['.DevelopUgandaGeneralHubActivity'], f'Wrong launcher: {launchers}')
              require('.DevelopUgandaNewsroomActivity' in registered, 'Newsroom registration missing')
              hub = read(PACKAGE / 'DevelopUgandaGeneralHubActivity.kt')
              for anchor in ('setContentView(buildHome())', 'page.addView(buildV28012ProWorkflowConsole())',
                             '1 • PREPARE • PROJECT / HEALTH / AUDIO / CAMERA',
                             '2 • SHOOT • FRAME / LIGHT / FOCUS / RECORD',
                             'DevelopUgandaNewsroomActivity::class.java'):
                  require(hub.count(anchor) == 1, f'Home workflow anchor absent or ambiguous: {anchor}')
              require(hub.count('routeCard(') == 36, 'Home route-card inventory changed')
              targets = set(re.findall(r'(DevelopUganda\w+Activity)::class\.java', hub))
              for name in targets:
                  require('.' + name in registered, f'Home destination unregistered: {name}')
              console = read(PACKAGE / CONSOLE)
              require('"%s • %s • S%03d T%03d | MIC %s | BAT %s | %dGB | THERM %s | READY %d%%"' in console,
                      'F8 percent-safe status ribbon missing')
              newsroom = read(PACKAGE / 'DevelopUgandaNewsroomActivity.kt')
              require('        showHome()' in newsroom and 'private fun openReportCamera()' in newsroom, 'Original second home/camera route missing')


          if __name__ == '__main__':
              require(len(sys.argv) == 2 and sys.argv[1] in ('prepare', 'finish'), 'Usage: repair_existing_f9.py prepare|finish')
              {'prepare': prepare, 'finish': finish}[sys.argv[1]]()
          F9_REPAIR_PY
