name: Build Haruna Engineering V80 APK FIX2 ORIGINAL BASE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/haruna-engineering-v80-apk-fix2-original.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Haruna Engineering V80 app
        shell: bash
        run: |
          mkdir -p www
          if [ -f "haruna_app_v80.html" ]; then
            cp haruna_app_v80.html www/index.html
          elif [ -f ".github/workflows/haruna-engineering-v80-apk.yml" ] && head -n 1 .github/workflows/haruna-engineering-v80-apk.yml | grep -qi '<!DOCTYPE html>'; then
            echo "Using existing Haruna Engineering V80 HTML source."
            cp .github/workflows/haruna-engineering-v80-apk.yml www/index.html
          else
            echo "ERROR: Haruna Engineering V80 HTML source not found."
            exit 1
          fi

          test -s www/index.html
          grep -qi "<html" www/index.html
          echo "V80 HTML ready: $(wc -c < www/index.html) bytes"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor Android project
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "haruna-engineering-v80",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.harunaengineering.app",
            "appName": "Haruna Engineering",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

          test -s android/app/src/main/assets/public/index.html
          echo "Bundled V80 HTML verified."

      - name: Force reliable local V80 loading
        shell: bash
        run: |
          cat > android/app/src/main/java/com/harunaengineering/app/MainActivity.java <<'EOF'
          package com.harunaengineering.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(6, 26, 43));
                  getWindow().setNavigationBarColor(Color.rgb(6, 26, 43));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(7, 9, 13));
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(false);
                  s.setUseWideViewPort(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/public/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set Android app version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          text = text.replace("versionCode 1", "versionCode 81")
          text = text.replace('versionName "1.0"', 'versionName "1.0-v80-fix2"')
          text = text.replace("versionCode = 1", "versionCode = 81")
          text = text.replace('versionName = "1.0"', 'versionName = "1.0-v80-fix2"')
          p.write_text(text)
          PY

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Haruna-Engineering-V80-FIX2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haruna-Engineering-V80-FIX2-APK
          path: output/Haruna-Engineering-V80-FIX2.apk
          if-no-files-found: error
          retention-days: 30
