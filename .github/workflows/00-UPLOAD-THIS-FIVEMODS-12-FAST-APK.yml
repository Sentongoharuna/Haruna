name: 00 - FIVEMODS 12.1 protected baseline gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Verify protected ordinary source
        run: |
          # Historical migration archive: 00-1-FIVEMODS12-RUN4-SOURCE.zip
          python3 ci/verify_source_contracts.py
      - name: Build app and test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run gated device suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload verified baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-NEW-FIVEMODS-12-1-RUN4-COMPILE-FIXED-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
