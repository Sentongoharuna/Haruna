              val encoder:GuardianState32=GuardianState32.UNKNOWN,
              val audio:GuardianState32=GuardianState32.UNKNOWN,
              val storage:GuardianState32=GuardianState32.UNKNOWN,
              val thermal:GuardianState32=GuardianState32.UNKNOWN
          ) {
