              val branded:OutputState32=OutputState32.IDLE
          ) {
              fun cleanProtected()=clean==OutputState32.RECORDING || clean==OutputState32.FINALIZING || clean==OutputState32.SAVED
              fun allSaved()=clean==OutputState32.SAVED && branded==OutputState32.SAVED
          }

