        working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Give the compiled APK a new phone-friendly name
        shell: bash
        run: |
          set -euo pipefail
          source_apk="_build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk"
          delivery="_delivery/fivemods-53-compiled"
          test -f "$source_apk"
          mkdir -p "$delivery"
          cp "$source_apk" "$delivery/F53-R4-INTEGRATED-ONE-FINAL.apk"
          sha256sum "$delivery/F53-R4-INTEGRATED-ONE-FINAL.apk" > "$delivery/F53-R4-INTEGRATED-ONE-FINAL.apk.sha256"

      - name: Prepare the device gate as one executable script
        shell: bash
        run: |
          set -euo pipefail
          script_path="_build_source/Develop-Uganda-28600-Parts-9-10/build/run-du28600-device-gate.sh"
          mkdir -p "$(dirname "$script_path")"
          cat > "$script_path" <<'DEVICE_GATE'
          #!/usr/bin/env bash
          set -euo pipefail

          project="${GITHUB_WORKSPACE}/_build_source/Develop-Uganda-28600-Parts-9-10"
          cd "$project"

          serial="emulator-${EMULATOR_PORT:-5556}"
          evidence="${project}/build/device-gate"
          app_apk="${project}/app/build/outputs/apk/debug/app-debug.apk"
          test_apk="${project}/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"

          test -n "$evidence"
          mkdir -p -- "$evidence"
          trap 'adb -s "$serial" logcat -d -v threadtime > "$evidence/logcat.txt" 2>&1 || true' EXIT

          adb -s "$serial" wait-for-device
          adb devices -l | tee "$evidence/adb-devices.txt"
          boot_completed="$(adb -s "$serial" shell getprop sys.boot_completed | tr -d '\r')"
          test "$boot_completed" = "1"
          test -f "$app_apk"
          test -f "$test_apk"

          adb -s "$serial" install -r -t "$app_apk"
          adb -s "$serial" install -r -t "$test_apk"

          runner="$(
            adb -s "$serial" shell pm list instrumentation |
              tr -d '\r' |
              awk '/target=com.sentongoharuna.pulse\)/ {sub(/^instrumentation:/, "", $1); print $1; exit}'
          )"
          test -n "$runner"
          printf 'RUNNER=%s\n' "$runner" | tee "$evidence/runner.txt"

          # Clear stale logs so crash evidence belongs to this exact run.
          adb -s "$serial" logcat -c || true
          adb -s "$serial" shell dumpsys package com.sentongoharuna.pulse > "$evidence/package-before-test.txt" 2>&1 || true
          adb -s "$serial" shell dumpsys package com.sentongoharuna.pulse.test > "$evidence/test-package-before-test.txt" 2>&1 || true

          # Run the instrumentation suite with active-progress supervision.
          # Capture diagnostics before killing a genuinely stalled run.
          : > "$evidence/device-tests.txt"
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            adb -s "$serial" shell am instrument -w -r "$runner" 2>&1 |
            tee "$evidence/device-tests.txt"
          device_status=${PIPESTATUS[0]}
          set -e

          if test "$device_status" -eq 124; then
            echo "DEVICE TEST GATE TIMEOUT after 30 minutes." | tee "$evidence/timeout-diagnostic.txt"
            adb -s "$serial" shell dumpsys activity processes >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity top >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            adb -s "$serial" shell ps -A >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            echo "DEVICE TEST GATE FAILED: suite timed out; diagnostics were preserved." >&2
            exit 124
          fi

          test "$device_status" -eq 0
          if grep -Eq 'FAIL:|FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_CODE: 0|Process crashed' "$evidence/device-tests.txt"; then
            echo "DEVICE TEST GATE FAILED: capturing crash diagnostics." >&2
            adb -s "$serial" logcat -d -v threadtime > "$evidence/logcat-on-failure.txt" 2>&1 || true
            grep -Ei -B 40 -A 120 'FATAL EXCEPTION|AndroidRuntime|Process: com\.sentongoharuna\.pulse|Process crashed|signal [0-9]+|tombstone|ANR in' "$evidence/logcat-on-failure.txt" > "$evidence/CRASH-FOCUS.txt" 2>/dev/null || true
            adb -s "$serial" shell dumpsys activity processes > "$evidence/processes-on-failure.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity exit-info com.sentongoharuna.pulse > "$evidence/app-exit-info.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity exit-info com.sentongoharuna.pulse.test > "$evidence/test-exit-info.txt" 2>&1 || true
            printf '%s\n' "DEVICE_TEST_STATUS=CRASHED" "APK_STATUS=COMPILED_NOT_DEVICE_VERIFIED" > "$evidence/STATUS.txt"
            echo "Instrumentation crashed; diagnostics captured. APK remains compiled but is not certified post-diagnostic."
            exit 0
          fi

          # AndroidJUnitRunner normally reports OK (N tests). Also accept its
          # successful INSTRUMENTATION_CODE=-1 completion marker.
          if ! grep -Eq 'OK \([1-9][0-9]* (device )?tests?\)|INSTRUMENTATION_CODE: -1' "$evidence/device-tests.txt"; then
            echo "DEVICE TEST GATE FAILED: no successful instrumentation completion marker." >&2
            exit 1
          fi

          echo "DEVICE TEST GATE PASSED." | tee "$evidence/gate-result.txt"
          DEVICE_GATE
          chmod +x "$script_path"
          bash -n "$script_path"

      - name: Run all 20 device tests on a fresh API 35 emulator

        id: device_gate

        continue-on-error: true
        timeout-minutes: 42
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 1536M
          avd-name: fivemods53_api35
          force-avd-creation: true
          emulator-port: 5556
          emulator-boot-timeout: 900
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back emulated -camera-front emulated
          script: bash "${GITHUB_WORKSPACE}/_build_source/Develop-Uganda-28600-Parts-9-10/build/run-du28600-device-gate.sh"

      - name: Summarize F55 emulator gate honestly
        if: always()
        shell: bash
        run: |
          echo "## F55 FIVE CAMERA IDENTITY ONE-APK BUILD" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compiled APK build completed before the emulator gate." >> "$GITHUB_STEP_SUMMARY"
          echo "- Emulator gate outcome: ${{ steps.device_gate.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.device_gate.outcome }}" = "success" ]; then
            echo "- Device verification: PASSED." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Device verification: NOT PASSED. Emulator/ADB failure is diagnostic and does not discard the compiled APK." >> "$GITHUB_STEP_SUMMARY"
            echo "- Do not label this APK device-verified." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Give the post-diagnostic APK an honest phone-friendly name
        shell: bash
        run: |
          set -euo pipefail
          source_apk="_build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk"
          delivery="_delivery/fivemods-53-post-diagnostic"
          test -f "$source_apk"
          mkdir -p "$delivery"
          cp "$source_apk" "$delivery/FIVEMODS-53-POST-DIAGNOSTIC-NOT-VERIFIED.apk"
          sha256sum "$delivery/FIVEMODS-53-POST-DIAGNOSTIC-NOT-VERIFIED.apk" > "$delivery/FIVEMODS-53-POST-DIAGNOSTIC-NOT-VERIFIED.apk.sha256"
      - name: Prepare exactly ONE final F55 APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          project="_build_source/Develop-Uganda-28600-Parts-9-10"
          mkdir -p "$project/final"
          mapfile -t apks < <(find "$project/app/build/outputs/apk" -type f -name '*.apk' ! -name '*androidTest*' | sort)
          [ "${#apks[@]}" -ge 1 ] || { echo "No compiled app APK exists; refusing fake artifact path."; exit 1; }
          chosen=""
          for f in "${apks[@]}"; do
            if [[ "$f" == *"/debug/"* || "$f" == *"-debug.apk" ]]; then chosen="$f"; break; fi
          done
          [ -n "$chosen" ] || chosen="${apks[0]}"
          cp "$chosen" "$project/final/F55-FIVE-CAMERA-IDENTITY-ONE-FINAL.apk"
          echo "FINAL APK SOURCE: $chosen"
          ls -lh "$project/final/F55-FIVE-CAMERA-IDENTITY-ONE-FINAL.apk"

      - name: Upload ONE final F55 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-F55-FIVE-CAMERA-IDENTITY-ONE-FINAL
          path: _build_source/Develop-Uganda-28600-Parts-9-10/final/F55-FIVE-CAMERA-IDENTITY-ONE-FINAL.apk
          if-no-files-found: error
          retention-days: 14

