              DevelopUgandaCameraPage.LIVE -> F55CameraIdentity(page,F55RecIdentity.LIVE_BROADCAST_TALLY,listOf("LOCAL REC","STREAM","BITRATE","NETWORK","AUDIO"))
              DevelopUgandaCameraPage.TIKTOK -> F55CameraIdentity(page,F55RecIdentity.TIKTOK_CREATOR_PROGRESS,listOf("9:16","FPS","DURATION","FRAMING","EXPOSURE"))
              DevelopUgandaCameraPage.STATUS -> F55CameraIdentity(page,F55RecIdentity.STATUS_RED_RING,listOf("MASTER TIME","SEGMENT TIME","FRAMING"))
              DevelopUgandaCameraPage.INTERVIEW -> F55CameraIdentity(page,F55RecIdentity.INTERVIEW_QUIET_TALLY,listOf("SUBJECT","FOCUS","AUDIO L","AUDIO R","TIMECODE"))
            }
          }
          KOTLIN
          # Keep the proven R11 enum untouched.
          for mode in MAIN LIVE TIKTOK STATUS; do grep -q "^[[:space:]]*${mode}," "$modefile" || exit 1; done
          grep -q "^[[:space:]]*INTERVIEW" "$modefile" || exit 1
