                  listOf(recorder,encoder,audio,storage,thermal).contains(GuardianState32.CRITICAL) -> GuardianState32.CRITICAL
                  listOf(recorder,encoder,audio,storage,thermal).contains(GuardianState32.DEGRADED) -> GuardianState32.DEGRADED
                  listOf(recorder,encoder,audio,storage,thermal).all { it==GuardianState32.HEALTHY } -> GuardianState32.HEALTHY
                  else -> GuardianState32.UNKNOWN
              }
          }

