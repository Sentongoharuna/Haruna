name: 00 - SECTION1 R10 LIVE STYLE ALL CAMS APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-SECTION1-R10-LIVE-STYLE-ALL-CAMS.yml"]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Apply R10 LIVE style all cams
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          test -s "$F"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          f=Path(sys.argv[1]); s=f.read_text()
          def one(old,new,label):
              global s
              if old not in s: raise SystemExit("R10 missing source contract: "+label)
              s=s.replace(old,new,1)

          one("        bottomDeck.addView(modeRow)\n","        modeRow.visibility = View.GONE\n","modeRow")
          one("        bottomDeck.addView(zoomRow)\n","        zoomRow.visibility = View.GONE\n","zoomRow")
          one("        bottomDeck.addView(exposureRow)\n","        exposureRow.visibility = View.GONE\n","exposureRow")
          one("                dp(150),\n                dp(62),\n                Gravity.CENTER\n",
              "                dp(82),\n                dp(82),\n                Gravity.CENTER\n","record state")
          one("                dp(132),\n                dp(50),\n                Gravity.CENTER\n",
              "                dp(76),\n                dp(76),\n                Gravity.CENTER\n","record button")
          one("            reportRecordArea,\n            wrap(150, 62)\n",
              "            reportRecordArea,\n            wrap(84, 84)\n","record area")
          one("            lensButton,\n            wrap(82, 46)\n",
              "            lensButton,\n            wrap(74, 42)\n","lens")
          one("            torchButton,\n            wrap(82, 46)\n",
              "            torchButton,\n            wrap(74, 42)\n","light")

          start=s.find("    private fun makeRecordButton(): Button {")
          end=s.find("    private fun space(width: Int): View {",start)
          if start<0 or end<0: raise SystemExit("R10 makeRecordButton missing")
          new_record='''    private fun makeRecordButton(): Button {
        return Button(this).apply {
            tag = "r10_live_style_record"
            text = "●"
            textSize = 20f
            isAllCaps = false
            setTextColor(DevelopUgandaFivemods8Theme.content)
            minWidth = dp(76)
            minHeight = dp(76)
            minimumWidth = dp(76)
            minimumHeight = dp(76)
            setPadding(0, 0, 0, 0)
            background = GradientDrawable().apply {
                shape = GradientDrawable.OVAL
                setColor(DevelopUgandaFivemods8Theme.transparent)
                setStroke(dp(2), DevelopUgandaFivemods8Theme.record)
            }
            contentDescription = "Record"
        }
    }

'''
          s=s[:start]+new_record+s[end:]

          old='''        if (
            ::recordButton.isInitialized &&
            recording == null
        ) {
            recordButton.text =
                if (
                    captureModes[
                        captureModeIndex
                    ] == "PHOTO"
                ) {
                    "● PHOTO"
                } else {
                    "● RECORD"
                }
        }
'''
          new='''        if (::recordButton.isInitialized) {
            recordButton.text = "●"
            recordButton.contentDescription =
                if (captureModes[captureModeIndex] == "PHOTO") "Photo shutter"
                else if (recording != null) "Stop recording"
                else "Record"
        }
'''
          one(old,new,"record refresh")

          old='''        listOf(
            modeRow,
            reportToolsRow,
            reportAdvancedRow,
            reportDisplayRow,
            reportOutputRow,
            reportDirectorRow,
            zoomRow,
            exposureRow
        ).forEach {
            it.visibility =
                visibility
        }
'''
          new='''        listOf(
            reportToolsRow,
            reportAdvancedRow,
            reportDisplayRow,
            reportOutputRow,
            reportDirectorRow
        ).forEach { it.visibility = visibility }
        modeRow.visibility = View.GONE
        zoomRow.visibility = View.GONE
        exposureRow.visibility = View.GONE
'''
          one(old,new,"operator restore")

          marker="        f12CameraShell?.updateBroadcastStatus(f12Status)\n"
          addition='''        f12CameraShell?.updateBroadcastStatus(f12Status)

        // SECTION1-R10: F12 status strip is the single owner of top telemetry.
        if (::previewNarrationPanel.isInitialized) previewNarrationPanel.visibility = View.GONE
        if (::brandView.isInitialized) brandView.visibility = View.GONE
        if (::statusView.isInitialized) statusView.visibility = View.GONE
        if (::timecodeView.isInitialized) timecodeView.visibility = View.GONE
        if (::formatView.isInitialized) formatView.visibility = View.GONE
        if (::locationView.isInitialized) locationView.visibility = View.GONE
        if (::weatherView.isInitialized) weatherView.visibility = View.GONE
        if (::systemView.isInitialized) systemView.visibility = View.GONE
'''
          one(marker,addition,"single owner")
          f.write_text(s)
          PY
          grep -q 'r10_live_style_record' "$F"
          grep -q 'SECTION1-R10: F12 status strip is the single owner' "$F"
          grep -q 'recordButton.setOnTouchListener' "$F"
          ! grep -q 'bottomDeck.addView(modeRow)' "$F"
      - name: Verify protected contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          P=app/src/main/java/com/sentongoharuna/pulse
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'recordButton.setOnTouchListener' "$P/DevelopUgandaCameraActivity.kt"
          grep -q 'DevelopUgandaFivemods12CameraShell.attach' "$P/DevelopUgandaCameraActivity.kt"
          grep -q 'DevelopUgandaFivemods12CameraShell.attach' "$P/DevelopUgandaLiveActivity.kt"
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          OUT="SECTION1-R10-LIVE-STYLE-ALL-CAMS-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R10-LIVE-STYLE-ALL-CAMS-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
