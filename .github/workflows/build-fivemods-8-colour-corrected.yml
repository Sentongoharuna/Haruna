          KaouSnI7WNWh1hSgJovsoW3LB1XX/88Hbf0PQLeDTsYzAAA=
          """))
          apply_patch("FIVEMODS 8 colour correction", correction_payload)

          # Retain the existing fixed-workflow Kotlin compiler repairs.
          status_policy = Path(
              "source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStatusPolicy.kt"
          )
          status_policy.parent.mkdir(parents=True, exist_ok=True)
          status_policy.write_bytes(embedded_gzip_block("FIVEMODS_8_STATUS_POLICY"))
          status_text = status_policy.read_text(encoding="utf-8")
          status_text = re.sub(
              r"(fun TextView\.setSelectAllOnFocus\(\) \{\s*)",
              r"\1    setSelectAllOnFocus(true)\n",
              status_text,
              count=1,
          )
          status_policy.write_text(status_text, encoding="utf-8")

          repairs = [
              (
                  Path(
                      "source/app/src/main/java/com/sentongoharuna/pulse/InterviewAnnotatedExporter.kt"
                  ),
                  "val interviewOverlays =\n            mutableListOf(",
                  "val interviewOverlays: MutableList<TextureOverlay> =\n            mutableListOf(",
              ),
              (
                  Path(
                      "source/app/src/main/java/com/sentongoharuna/pulse/VideoTagExporter.kt"
                  ),
                  "val overlays =\n            mutableListOf(",
                  "val overlays: MutableList<TextureOverlay> =\n            mutableListOf(",
              ),
          ]
          for target, old, new in repairs:
              source = target.read_text(encoding="utf-8")
              if "import com.sentongoharuna.pulse.TextureOverlay" not in source:
                  source = source.replace(
                      "import com.sentongoharuna.pulse.TextOverlay\n",
                      "import com.sentongoharuna.pulse.TextOverlay\n"
                      "import com.sentongoharuna.pulse.TextureOverlay\n",
                      1,
                  )
              if old not in source:
                  raise SystemExit(f"Expected Kotlin repair site not found: {target}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload colour-corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: fivemods.8-colour-corrected-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
