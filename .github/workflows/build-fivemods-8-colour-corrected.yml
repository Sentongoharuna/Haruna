              "@color/du_system_chrome" not in styles_text
              or "@color/du_accent" not in styles_text
          ):
              raise SystemExit("Expected AppTheme colour bindings not found.")
          styles_file.write_text(styles_text, encoding="utf-8")

          # Kotlin 2.2 requires the existing @ColorInt annotations on
          # getter-only XML resource properties to use the getter target.
          # This changes no colour value, token, or app behavior.
          theme_reader = Path(
              "source/app/src/main/java/com/sentongoharuna/pulse/"
              "DevelopUgandaFivemods8Theme.kt"
          )
          theme_reader_text = theme_reader.read_text(encoding="utf-8")
          theme_reader_text, getter_annotations = re.subn(
              r"(?m)^(\s*)@ColorInt\s+val\s+",
              r"\1@get:ColorInt val ",
              theme_reader_text,
          )
          if getter_annotations != 10:
              raise SystemExit(
                  "Expected ten XML resource getter annotations in the theme reader."
              )
          theme_reader.write_text(theme_reader_text, encoding="utf-8")

          # Retain the existing fixed-workflow Kotlin compiler repairs.
          status_policy = Path(
              "source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStatusPolicy.kt"
          )
          status_policy.parent.mkdir(parents=True, exist_ok=True)
          status_policy.write_bytes(embedded_gzip_block("FIVEMODS_8_STATUS_POLICY"))
          status_policy.write_text(
              re.sub(
                  r"\bselectAllOnFocus\s*=\s*true\b",
                  "setSelectAllOnFocus(true)",
                  status_policy.read_text(encoding="utf-8"),
              ),
              encoding="utf-8",
          )

          repairs = [
              (
                  Path(
                      "source/app/src/main/java/com/sentongoharuna/pulse/"
                      "DevelopUgandaInterviewAnnotatedExporter.kt"
                  ),
                  "val interviewOverlays =\n            mutableListOf(",
                  "val interviewOverlays: MutableList<TextureOverlay> =\n            mutableListOf(",
              ),
              (
                  Path(
                      "source/app/src/main/java/com/sentongoharuna/pulse/"
                      "DevelopUgandaVideoTagExporter.kt"
                  ),
                  "val overlays =\n            mutableListOf(",
                  "val overlays: MutableList<TextureOverlay> =\n            mutableListOf(",
              ),
          ]
          for target, old, new in repairs:
              source = target.read_text(encoding="utf-8")
              if "import androidx.media3.effect.TextureOverlay" not in source:
                  source = source.replace(
                      "import androidx.media3.effect.TextOverlay\n",
                      "import androidx.media3.effect.TextOverlay\n"
                      "import androidx.media3.effect.TextureOverlay\n",
                      1,
                  )
              if old not in source:
                  raise SystemExit(f"Expected Kotlin repair site not found: {target}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          # Build-only D8/R8 compatibility update. AGP 8.11.1 brings a newer
          # D8/R8 than the failing 8.9.x line, without changing app code,
          # controls, routing, settings, defaults, capture, or encoding.
          root_build = Path("source/build.gradle.kts")
          root_build_text = root_build.read_text(encoding="utf-8")
          root_build_text, agp_replacements = re.subn(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r"\g<1>8.11.1\g<2>",
              root_build_text,
              count=1,
          )
          if agp_replacements != 1:
              raise SystemExit("Expected Android Gradle Plugin declaration not found.")
          root_build.write_text(root_build_text, encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload colour-corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: fivemods.8-colour-corrected-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
