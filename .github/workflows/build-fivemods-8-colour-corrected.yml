name: Build Develop Uganda FIVEMODS 8 colour-corrected APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-fivemods-8.yml"
      - ".github/workflows/build-fivemods-8-colour-corrected.yml"
      - "develop_uganda_five_mode_source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Rebuild FIVEMODS 8 and apply approved colour correction
        shell: bash
        run: |
          set -euo pipefail
          test -f develop_uganda_five_mode_source.zip
          test -f .github/workflows/build-fivemods-8.yml

          rm -rf source
          unzip -q develop_uganda_five_mode_source.zip -d source

          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          from pathlib import Path

          base_workflow = Path(".github/workflows/build-fivemods-8.yml").read_text(
              encoding="utf-8"
          )

          def embedded_gzip_block(name: str) -> bytes:
              marker = f"base64 -d <<'{name}'"
              marker_start = base_workflow.index(marker)
              payload_start = base_workflow.index("\n", marker_start) + 1
              payload_end = base_workflow.index(f"\n{name}\n", payload_start)
              encoded = re.sub(r"\s+", "", base_workflow[payload_start:payload_end])
              return gzip.decompress(base64.b64decode(encoded))

          def apply_patch(label: str, payload: bytes) -> None:
              result = subprocess.run(
                  ["patch", "-d", "source", "-p1", "--batch", "--forward"],
                  input=payload,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f"Unable to apply {label} patch.")

          # Start from the existing FIVEMODS 8 workflow's complete base patch.
          apply_patch("FIVEMODS 8 base", embedded_gzip_block("FIVEMODS_8_PATCH"))

