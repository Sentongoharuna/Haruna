          styles_text = styles_file.read_text(encoding="utf-8")
          styles_text = styles_text.replace(
              "@color/fivemods8_system_chrome",
              "@color/du_system_chrome",
          ).replace(
              "@color/fivemods8_accent",
              "@color/du_accent",
          )
