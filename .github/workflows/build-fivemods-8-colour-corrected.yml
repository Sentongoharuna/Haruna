name: Build Develop Uganda FIVEMODS 8 colour-corrected APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-fivemods-8.yml"
      - ".github/workflows/build-fivemods-8-colour-corrected.yml"
      - "develop_uganda_five_mode_source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Rebuild FIVEMODS 8 and apply approved colour correction
        shell: bash
        run: |
          set -euo pipefail
          test -f develop_uganda_five_mode_source.zip
          test -f .github/workflows/build-fivemods-8.yml

          rm -rf source
          unzip -q develop_uganda_five_mode_source.zip -d source

          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          from pathlib import Path

          base_workflow = Path(".github/workflows/build-fivemods-8.yml").read_text(
              encoding="utf-8"
          )

          def embedded_gzip_block(name: str) -> bytes:
              marker = f"base64 -d <<'{name}'"
              marker_start = base_workflow.index(marker)
              payload_start = base_workflow.index("\n", marker_start) + 1
              closing_marker = re.search(
                  rf"(?m)^[ \t]*{re.escape(name)}[ \t]*(?:\r?\n|$)",
                  base_workflow[payload_start:],
              )
              if closing_marker is None:
                  raise SystemExit(f"Embedded block terminator not found: {name}")
              payload_end = payload_start + closing_marker.start()
              encoded = re.sub(r"\s+", "", base_workflow[payload_start:payload_end])
              return gzip.decompress(base64.b64decode(encoded))

          def apply_patch(label: str, payload: bytes) -> None:
              result = subprocess.run(
                  ["patch", "-d", "source", "-p1", "--batch", "--forward"],
                  input=payload,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f"Unable to apply {label} patch.")

          def without_file_diff(payload: bytes, path: str) -> bytes:
              text = payload.decode("utf-8")
              start = text.find(f"diff --git a/{path} b/{path}\n")
              if start < 0:
                  raise SystemExit(f"Expected correction diff not found: {path}")
              end = text.find("diff --git ", start + 1)
              if end < 0:
                  end = len(text)
              return (text[:start] + text[end:]).encode("utf-8")

          # Start from the existing FIVEMODS 8 workflow's complete base patch.
          apply_patch("FIVEMODS 8 base", embedded_gzip_block("FIVEMODS_8_PATCH"))

          # Apply the existing FIVEMODS 8 colour pass before its correction.
