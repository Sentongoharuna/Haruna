          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import shutil

          def fail(message: str) -> None:
              raise SystemExit(f"{os.environ['DU_OVERLAY_STAGE']}: {message}")

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source = Path("source")
          work = Path(os.environ["DU_OVERLAY_DIR"])
          payload_root = work / "payload"
          manifest = json.loads(base64.b64decode(os.environ["DU_OVERLAY_MANIFEST_B64"]))
          archive = work / "payload.tar.gz"
          if sha(archive) != manifest["payload_sha256"]:
              fail("embedded payload checksum mismatch")

          planned = []
          for item in manifest["files"]:
              relative = PurePosixPath(item["path"])
              if relative.is_absolute() or ".." in relative.parts:
                  fail(f"unsafe payload path: {relative}")
              target = source.joinpath(*relative.parts)
              staged = payload_root.joinpath(*relative.parts)
              if not staged.is_file():
                  fail(f"payload file missing: {relative}")
              if sha(staged) != item["result_sha256"]:
                  fail(f"payload file checksum mismatch: {relative}")
              expected = item["base_sha256"]
              if expected is None:
                  if target.exists():
                      fail(f"expected new file already exists: {relative}")
              elif not target.is_file():
                  fail(f"required base file missing: {relative}")
              elif sha(target) != expected:
                  fail(f"base file changed; refusing an ambiguous merge: {relative}")
              planned.append((relative, staged, target, item["result_sha256"]))

          for relative, staged, target, expected in planned:
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(staged, target)
              if sha(target) != expected:
                  fail(f"installed file checksum mismatch: {relative}")

          report = {
              "stage": manifest["label"],
              "payload_sha256": manifest["payload_sha256"],
              "changed_files": [str(item[0]) for item in planned],
              "source_hashes_after": {str(item[0]): item[3] for item in planned},
          }
          (work / "audit" / "overlay.json").write_text(json.dumps(report, indent=2) + "\n")
          print(f"PASS: {manifest['label']} installed with {len(planned)} exact file overlays")
          PYTHON
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import re

          SOURCE = Path("source")
          PACKAGE = SOURCE / "app/src/main/java/com/sentongoharuna/pulse"
          AUDIT = Path("f10-complete-audit")
          AUDIT.mkdir(exist_ok=True)

          def need(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(f"FIVEMODS 10 complete verification: {message}")

          def read(name: str) -> str:
              path = PACKAGE / name
              need(path.is_file(), f"required file missing: {name}")
              return path.read_text(encoding="utf-8")

          camera = read("DevelopUgandaCameraActivity.kt")
          expected_scrims = {38: 2, 66: 4, 82: 2}
          for alpha, expected in expected_scrims.items():
              found = camera.count(f"DevelopUgandaFivemods8Theme.surfaceScrim({alpha})")
              need(found == expected, f"surfaceScrim({alpha}) count changed: {found} != {expected}")
          need("du_viewfinder_indicator_backing" not in camera,
               "opaque viewfinder backing token reached CameraActivity")

          def selected(text: str, start: str, end: str, label: str) -> str:
              need(text.count(start) == 1, f"{label} start anchor changed")
              need(text.count(end) == 1, f"{label} end anchor changed")
              return text[text.index(start):text.index(end, text.index(start))]

          exposure = selected(camera, "    // FIVEMODS 10: the phone's ambient-light sensor",
                              "\n    private fun f9UpdateAudioTelemetry(", "FIVEMODS 10 exposure")
          need("ambientLux" not in exposure and "requestedEv" not in exposure,
               "ambient-light exposure override returned")
          need("sceneExposureTarget.coerceIn(" in exposure and
               exposure.count("setExposureCompensationIndex(requestedIndex)") == 1,
               "operator/neutral AE policy changed")
          controls = selected(camera, "    private fun v244ApplyCamera2Controls(): String {",
                              "\n    internal fun v244CycleShutterAngle(): String {", "Camera2 controls")
          need(controls.count("CaptureRequest.CONTROL_AE_MODE_OFF") == 1, "manual exposure branch changed")
          need(controls.count("CaptureRequest.CONTROL_AE_MODE_ON") == 1, "automatic exposure branch changed")
          need(controls.count("CaptureRequest.CONTROL_AE_LOCK,\n                        false") == 1,
               "Interview AE unlock changed")
          need(camera.count("f9InterviewFrameRateRange") == 3, "Interview FPS helper inventory changed")

          navigator = read("DevelopUgandaCameraModeNavigator.kt")
          for anchor in ("CAMERA_HANDOFF_SETTLE_MS = 850L", "releaseCamera()", "outer.postDelayed(",
                         "DevelopUgandaCameraModeRoutes.launch(activity, destination)"):
              need(navigator.count(anchor) == 1, f"release handoff changed: {anchor}")

          profiles = read("DevelopUgandaModeProfiles.kt")
          need(re.search(r"navigatorOrder\s*=\s*listOf\(\s*main\s*,\s*live\s*,\s*tikTok\s*,\s*status\s*,\s*interview\s*\)", profiles),
               "five-mode navigator order changed")
          need(profiles.count("stages = listOf(") == 5, "per-mode stage lists missing")
          need(profiles.count("DevelopUgandaModeStage(DevelopUgandaCameraPage.") >= 25,
               "mode-owned stage inventory unexpectedly small")
          for required in ("STREAM_KEY", "CONNECTION", "SEGMENT", "SHARE", "SUBJECT_LOCK", "MARKERS", "DELIVERY"):
              need(f'"{required}"' in profiles, f"per-mode stage missing: {required}")

          presentation = read("DevelopUgandaBroadcastPresentation.kt")
          need("enum class DevelopUgandaButtonWeight" in presentation, "shared three-weight button system missing")
          for state in ("PRIMARY", "SECONDARY", "TERTIARY", "DESTRUCTIVE"):
              need(state in presentation, f"button weight missing: {state}")
          need("du_primary_action" in presentation and "styleActionSurface" in presentation,
               "single-primary/shared surface routing missing")
          need("useDevelopUgandaMotion" in presentation and "systemReduceMotion" in presentation,
               "shared motion/reduce-motion routing missing")

          readout = read("DevelopUgandaLiveReadout.kt")
          for anchor in ("DevelopUgandaRollingMetricBuffer", "60_000L", "DevelopUgandaMetricTrendView",
                         "DevelopUgandaMotionLevel", "OFF", "STANDARD", "FULL"):
              need(anchor in readout, f"metric/motion component missing: {anchor}")
          need("TRANSITION_ANIMATION_SCALE" in readout, "system reduce-motion default is not respected")

          chrome = read("DevelopUgandaBroadcastCameraChrome.kt")
          for anchor in ("MODE", "FORMAT", "CODEC", "TC", "BAT", "FREE", "AUDIO",
                         "ACTION SAFE", "TITLE SAFE", "CLEAN", "HOLD UNLOCK", "left_handed",
                         "dark_adapt", "screen_dim", "OrientationEventListener"):
              need(anchor in chrome, f"camera chrome capability missing: {anchor}")
          need("setBackgroundColor(DevelopUgandaFivemods8Theme.transparent)" in chrome,
               "camera chrome is not explicitly transparent")
          need("Handler(" not in chrome and "postDelayed(" not in chrome,
               "camera chrome introduced a timer")
          need(re.search(r"0x[0-9A-Fa-f]{6,8}|#[0-9A-Fa-f]{6,8}", chrome) is None,
               "camera chrome introduced a colour literal")
          need("DevelopUgandaBroadcastCameraChrome.attach(" in camera,
               "shared camera chrome is not attached to CameraActivity")
          live = read("DevelopUgandaLiveActivity.kt")
          need("DevelopUgandaBroadcastCameraChrome.attach(" in live,
               "shared camera chrome is not attached to LiveActivity")

          motion = read("DevelopUgandaV273MotionShotControl.kt")
          need("line = Paint(Paint.ANTI_ALIAS_FLAG).apply { strokeWidth = 2.0f; color = DevelopUgandaFivemods8Theme.outline }" in motion,
               "motion guide line/centre distinction missing")

          captions = read("DevelopUgandaReviewedCaptions.kt")
          transcript_engine = read("DevelopUgandaTranscriptEngine.kt")
          for anchor in ("DRAFT_REVIEW_REQUIRED", "CONFIRMED_UNTIMED", "caption_burn_allowed",
                         "DevelopUgandaReviewedCaptionOverlay", "wrapTwoLines", "WORD CONFIDENCE UNAVAILABLE",
                         "PACE", "PAUSE", "seal_scope"):
              need(anchor.lower() in captions.lower(), f"reviewed caption contract missing: {anchor}")
          need("No cloud recognizer was substituted" in transcript_engine,
               "on-device-only recognizer honesty contract missing")
          need("mode.equals(\"TIKTOK\", true) || mode.equals(\"STATUS\", true)" in captions,
               "per-mode caption defaults changed")
          need("word_confidence\", JSONObject.NULL" in captions,
               "missing recognizer confidence is not explicit")
          need("Handler(" not in captions and "postDelayed(" not in captions,
               "caption review introduced a timer")

          exporter = read("DevelopUgandaFivemods9DualOutputExporter.kt")
          need("overlays += DevelopUgandaReviewedCaptionOverlay(cues)" in exporter,
               "reviewed captions are not in the existing BRAND overlay chain")
          need("prepareReviewedCaptions" in exporter and "DevelopUgandaCaptionReview.prepare" in exporter,
               "mandatory caption review gate missing")
          for contract in ("clean.videoSamples != brand.videoSamples", "Timeline origin differs",
                           "Frame timestamp sequence differs", "CLEAN SAVED • BRAND MISSING"):
              need(contract in exporter, f"CLEAN/BRAND verification contract changed: {contract}")

          hud = read("DevelopUgandaInterviewHudView.kt")
          need('"PACE" to "AFTER REVIEW"' in hud and '"PAUSE" to "AFTER REVIEW"' in hud,
               "review-only Interview channels not labelled")
          need('"TOUCH"' not in selected(hud, "    private fun drawChannelBlock(",
                                          "\n    private fun drawTrendBlock(", "Interview channels"),
               "unmeasured TOUCH channel is still advertised")
          need('"TENSE"' not in selected(hud, "    private fun drawChannelBlock(",
                                          "\n    private fun drawTrendBlock(", "Interview channels"),
               "unmeasured TENSE channel is still advertised")

          newsroom = read("DevelopUgandaNewsroomActivity.kt")
          for anchor in ("CONFIRMED TRANSCRIPT ARCHIVE", "Search what was said", "NO TRANSCRIPT",
                         "showPlayback", "formatTranscriptTime"):
              need(anchor in newsroom, f"searchable archive capability missing: {anchor}")

          build = (SOURCE / "app/build.gradle.kts").read_text(encoding="utf-8")
          need('versionCode = 28220' in build and
               'versionName = "282.20-fivemods10-broadcast-reviewed-captions"' in build,
               "final build identity changed")

          all_files = sorted(path for path in SOURCE.rglob("*") if path.is_file())
          source_hashes = {str(path.relative_to(SOURCE)): hashlib.sha256(path.read_bytes()).hexdigest() for path in all_files}
          report = {
              "build": "FIVEMODS 10 broadcast presentation + reviewed captions",
              "fix1_merged": True,
              "fivemods10_exposure_preserved": True,
              "surface_scrim_counts": expected_scrims,
              "opaque_viewfinder_token_in_camera": False,
              "clean_master_captioned": False,
              "brand_caption_gate": "operator-confirmed, recognizer-timed cues only",
              "caption_defaults": {"MAIN": False, "LIVE": False, "TIKTOK": True, "STATUS": True, "INTERVIEW": False},
              "platform_overlay_measurements": "ABSENT; no platform coverage number is fabricated",
              "caption_placement": "central lower field in the existing BRAND overlay pass; two lines maximum",
              "word_confidence": "ABSENT from the on-device engine; no confidence value is displayed",
              "touch_tense_channels": "ABSENT from the observation engine and removed from the live placeholder",
              "pace_pause_channels": "DERIVED after review from confirmed words and real cue gaps",
              "new_timers": 0,
              "source_sha256": source_hashes,
          }
          (AUDIT / "verification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          (AUDIT / "SOURCE-SHA256.txt").write_text(
              "".join(f"{value}  {name}\n" for name, value in source_hashes.items()),
              encoding="utf-8",
          )
          print("PASS: FIX1, FIVEMODS 10 protections, broadcast presentation and reviewed BRAND captions verified")
          PYTHON
      - name: Build FIVEMODS 10 broadcast captions APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify, name and checksum top-level APK
        shell: bash
        run: |
          set -euo pipefail
          apk="source/app/build/outputs/apk/debug/app-debug.apk"
          output="Develop-Uganda-FIVEMODS-10-Broadcast-Reviewed-Captions.apk"
          checksum="Develop-Uganda-FIVEMODS-10-Broadcast-Reviewed-Captions-SHA256.txt"
          test -s "$apk" || { echo "::error::Gradle completed without a non-empty APK"; exit 1; }
          cp "$apk" "$output"
          sha256sum "$output" > "$checksum"
          test -s f10-complete-audit/verification.json
          test -s f10-complete-audit/SOURCE-SHA256.txt

      - name: Upload top-level APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-APK-Develop-Uganda-FIVEMODS-10-Broadcast-Captions-${{ github.run_number }}
          path: |
            Develop-Uganda-FIVEMODS-10-Broadcast-Reviewed-Captions.apk
            Develop-Uganda-FIVEMODS-10-Broadcast-Reviewed-Captions-SHA256.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-10-Broadcast-Captions-Checks-${{ github.run_number }}
          path: |
            f10-complete-audit/*.json
            f10-complete-audit/*.txt
            .fivemods10-complete/*/audit/*.json
            f10-exposure-audit/*.json
            f10-exposure-audit/*.diff
            f9-repair-audit/*.json
            f9-repair-audit/*.diff
            f9-repair-audit/*.patch
          if-no-files-found: error

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-10-Broadcast-Captions-Failure-${{ github.run_number }}
          path: |
            f10-complete-audit/*
            .fivemods10-complete/*/audit/*
            f10-exposure-audit/*
            f9-repair-audit/*
          if-no-files-found: ignore
