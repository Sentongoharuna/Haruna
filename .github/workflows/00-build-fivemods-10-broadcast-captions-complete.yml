                          return
                      }

                      // Restore the real F8 handoff order: release this mode first,
                      // allow the physical camera/surface to settle, then open a fresh
                      // destination Activity. REORDER_TO_FRONT could revive a stale,
                      // already-paused camera Activity.
                      handoffInFlight = true
                      releaseCamera()
                      strip.postDelayed(
                          {
                              if (!activity.isFinishing && !activity.isDestroyed) {
                                  if (DevelopUgandaV270Guidance.safeOpen(activity, destination.activity)) {
                                      activity.finish()
                                  }
                              }
                          },
                          CAMERA_HANDOFF_SETTLE_MS
                      )
                  }'''
              text = exact(text, old, new, 'ordered mode navigation')
              require('FLAG_ACTIVITY_REORDER_TO_FRONT' not in text, 'Stale-Activity reorder flag survived')
              return text


          def repair_camera_handoff(text):
              """Give the shared F9 CameraActivity its existing F8 pre-switch release hook."""
              anchor = '''    private fun isInterviewCamera(): Boolean =
                  additiveModeProfile()?.page == DevelopUgandaCameraPage.INTERVIEW

          '''
              helper = '''    /** Release only while idle, before the shared navigator opens another mode. */
              private fun releaseCameraForModeSwitch() {
                  if (recording != null) return
                  try {
                      provider?.unbindAll()
                  } catch (_: Exception) {
                  }
                  try {
                      overlayEffect?.close()
                  } catch (_: Exception) {
                  }
                  // ProcessCameraProvider is process-wide. Clear this Activity's handle
                  // so its later onDestroy cannot unbind the destination's new session.
                  provider = null
                  overlayEffect = null
                  camera = null
                  videoCapture = null
                  imageCapture = null
              }

          '''
              text = exact(text, anchor, anchor + helper, 'CameraActivity release hook')
              text = exact(
                  text,
                  '                    canNavigate = { recording == null && !statusSegmentRestartPending }\n',
                  '                    canNavigate = { recording == null && !statusSegmentRestartPending },\n'
                  '                    releaseCamera = ::releaseCameraForModeSwitch\n',
                  'CameraActivity navigator callback',
              )
              return text


          def repair_live_handoff(text):
              """Retain Live's provider long enough to release it before a mode switch."""
              text = exact(
                  text,
                  '''    private var camera: Camera? = null
              private var videoCapture: VideoCapture<Recorder>? = null''',
                  '''    private var liveCameraProvider: ProcessCameraProvider? = null
              private var camera: Camera? = null
              private var videoCapture: VideoCapture<Recorder>? = null''',
                  'Live provider handle',
              )
              anchor = '    private fun loadLiveIdentity() {'
              helper = '''    /** Release Live while idle before opening another camera mode. */
              private fun releaseLiveCameraForModeSwitch() {
                  if (recording != null) return
                  try {
                      liveCameraProvider?.unbindAll()
                  } catch (_: Exception) {
                  }
                  try {
                      overlayEffect?.close()
                  } catch (_: Exception) {
                  }
                  liveCameraProvider = null
                  overlayEffect = null
                  camera = null
                  videoCapture = null
              }

          '''
              text = exact(text, anchor, helper + anchor, 'Live release hook')
              text = exact(
                  text,
                  '                val provider =\n                    future.get()\n\n                provider.unbindAll()',
                  '                val provider =\n                    future.get()\n\n'
                  '                liveCameraProvider = provider\n                provider.unbindAll()',
                  'Live provider assignment',
              )
              text = exact(
                  text,
                  '                canNavigate = { recording == null }\n',
                  '                canNavigate = { recording == null },\n'
                  '                releaseCamera = ::releaseLiveCameraForModeSwitch\n',
                  'Live navigator callback',
              )
              return text


          def finish():
              before = inventory()
              camera_path = PACKAGE / CAMERA
              console_path = PACKAGE / CONSOLE
              live_path = PACKAGE / LIVE
              navigator_path = PACKAGE / NAVIGATOR
              camera_before, console_before = read(camera_path), read(console_path)
              live_before, navigator_before = read(live_path), read(navigator_path)
