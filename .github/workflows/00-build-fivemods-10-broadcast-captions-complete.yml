          def verify_home():
              ns = '{http://schemas.android.com/apk/res/android}'
              manifest = ET.fromstring(read(SOURCE / 'app/src/main/AndroidManifest.xml'))
              registered = {a.get(ns + 'name') for a in manifest.findall('application/activity')}
              launchers = [a.get(ns + 'name') for a in manifest.findall('application/activity')
                           if any(c.get(ns + 'name') == 'android.intent.category.LAUNCHER' for c in a.findall('intent-filter/category'))]
              require(launchers == ['.DevelopUgandaGeneralHubActivity'], f'Wrong launcher: {launchers}')
