name: Develop Uganda - Five Mode Presentation Repair FIX1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-fivemods-8.yml"
      - ".github/workflows/build-fivemods-five-mode-presentation-repair-fix1.yml"
      - "develop_uganda_five_mode_source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare failure evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p failure-evidence
          printf '%s\n' "Five Mode Presentation Repair FIX1 started at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > failure-evidence/runner.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          task_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$task_sdk_root" || { echo "::error::Android SDK root is missing: $task_sdk_root"; exit 1; }
          echo "ANDROID_SDK_ROOT=$task_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$task_sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$task_sdk_root/platforms/android-36/android.jar" ]] || ! find "$task_sdk_root/build-tools" -maxdepth 2 -type f -name aapt2 -print -quit | grep -q .; then
            task_sdkmanager="$(command -v sdkmanager || true)"
            if [[ -z "$task_sdkmanager" ]]; then
              task_sdkmanager="$(find "$task_sdk_root/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
            fi
            test -x "$task_sdkmanager" || { echo "::error::sdkmanager is missing; cannot install Android API 36"; exit 1; }
            "$task_sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
          test -f "$task_sdk_root/platforms/android-36/android.jar" || { echo "::error::Android API 36 platform is unavailable"; exit 1; }

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unzip, apply REAL FIVEMODS 8, then colour work only
        shell: bash
        run: |
          set -euo pipefail
          test -f develop_uganda_five_mode_source.zip || { echo "::error::Missing develop_uganda_five_mode_source.zip"; exit 1; }
          test -f .github/workflows/build-fivemods-8.yml || { echo "::error::Missing REAL FIVEMODS 8 base workflow; no substitute is allowed"; exit 1; }

          test ! -e source || { echo "::error::source already exists; Build A requires a fresh checkout"; exit 1; }
          test ! -e build-a-audit || { echo "::error::build-a-audit already exists; Build A requires a fresh checkout"; exit 1; }
          unzip -q develop_uganda_five_mode_source.zip -d source

          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          import shutil
          import subprocess
          from pathlib import Path

          audit = Path("build-a-audit")
          audit.mkdir()
          shutil.copytree("source", audit / "zip-source")

          def exact(text, old, new, label, expected=1):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} anchors, found {count}")
              return text.replace(old, new)

          def regex(text, pattern, new, label, expected=1):
              # Count ALL matches before substitution. Never cap re.subn(count=...).
              compiled = re.compile(pattern, re.MULTILINE)
              count = len(list(compiled.finditer(text)))
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} anchors, found {count}")
              result, changed = compiled.subn(new, text)
              if changed != expected:
                  raise SystemExit(f"{label}: substitution count changed unexpectedly: {changed}")
              return result

          # Regression test: duplicated matches MUST fail before replacement.
          for invalid in ("absent", "anchor anchor"):
              try:
                  regex(invalid, r"anchor", "changed", "regex uniqueness self-test")
              except SystemExit:
                  pass
              else:
                  raise SystemExit("regex uniqueness self-test FAILED")
          assert regex("anchor", r"anchor", "changed", "regex self-test") == "changed"

          base_workflow = Path(".github/workflows/build-fivemods-8.yml").read_text(
              encoding="utf-8"
          )

          def embedded_gzip_block(name: str) -> bytes:
              marker = f"base64 -d <<'{name}'"
              if base_workflow.count(marker) != 1:
                  raise SystemExit(f"Expected exactly one REAL base block: {name}")
              marker_start = base_workflow.index(marker)
              payload_start = base_workflow.index("\n", marker_start) + 1
              closing_markers = list(re.finditer(
                  rf"(?m)^[ \t]*{re.escape(name)}[ \t]*(?:\r?\n|$)",
                  base_workflow[payload_start:],
              ))
              if len(closing_markers) != 1:
                  raise SystemExit(f"Expected exactly one embedded block terminator: {name}")
              payload_end = payload_start + closing_markers[0].start()
              encoded = re.sub(r"\s+", "", base_workflow[payload_start:payload_end])
              return gzip.decompress(base64.b64decode(encoded, validate=True))

          def apply_patch(label: str, payload: bytes) -> None:
              result = subprocess.run(
                  ["patch", "-d", "source", "-p1", "--batch", "--forward", "--fuzz=0", "--no-backup-if-mismatch"],
                  input=payload,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f"Unable to apply {label} patch.")

          def without_file_diff(payload: bytes, path: str) -> bytes:
              text = payload.decode("utf-8")
              start = text.find(f"diff --git a/{path} b/{path}\n")
              if text.count(f"diff --git a/{path} b/{path}\n") != 1:
                  raise SystemExit(f"Expected correction diff not found: {path}")
              end = text.find("diff --git ", start + 1)
              if end < 0:
                  end = len(text)
              return (text[:start] + text[end:]).encode("utf-8")

          # Start from the existing FIVEMODS 8 workflow's complete base patch.
          base_payload = embedded_gzip_block("FIVEMODS_8_PATCH")
          (audit / "real-f8.patch").write_bytes(base_payload)
          apply_patch("FIVEMODS 8 base", base_payload)
          # This compatibility bridge is supplied by the REAL F8 workflow,
          # alongside FIVEMODS_8_PATCH. It is not the F9 Status-policy payload.
          status_policy = Path("source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStatusPolicy.kt")
          if not status_policy.is_file():
              raise SystemExit(f"Required F8 Status policy source is missing: {status_policy}")
          status_policy_payload = embedded_gzip_block("FIVEMODS_8_STATUS_POLICY")
          if b"selectAllOnFocus" in status_policy_payload:
              raise SystemExit("Unexpected incompatible Status-policy bridge in REAL F8 workflow")
          status_policy.write_bytes(status_policy_payload)
          shutil.copytree("source", audit / "real-f8-source")
          (audit / "provenance.json").write_text(json.dumps({
              "chain": ["source ZIP", "REAL FIVEMODS_8_PATCH", "F8 colour work + alpha repair", "STOP"],
              "zip_sha256": hashlib.sha256(Path("develop_uganda_five_mode_source.zip").read_bytes()).hexdigest(),
              "base_workflow_sha256": hashlib.sha256(base_workflow.encode()).hexdigest(),
              "base_patch_sha256": hashlib.sha256(base_payload).hexdigest(),
          }, indent=2) + "\n", encoding="utf-8")

          # Apply the existing FIVEMODS 8 colour pass before its correction.
          colour_pass_payload = gzip.decompress(base64.b64decode("""
          H4sICCINqGoCA0ZJVkVNT0RTOC1DT0xPVVItUEFTUy5wYXRjaADsXdty4kiavvdTqIm+gC0b6wA6
