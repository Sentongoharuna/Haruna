                  styles_text,
                  f'<item name="android:{item}">@color/{old_name}</item>',
                  f'<item name="android:{item}">@color/{new_name}</item>',
                  f"AppTheme {item}",
              )
          styles_file.write_text(styles_text, encoding="utf-8")

