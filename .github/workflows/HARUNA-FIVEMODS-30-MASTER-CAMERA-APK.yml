          cat > "$project/FIVEMODS-30-CAMERA-COMMAND.txt" <<'EOF'
          FIVEMODS 30 — MASTER CAMERA
          - Preserve FIVEMODS 13–27, both workflow pages and all five camera modes.
          - REC Engine Guard permits one start/stop request at a time and prevents duplicate callbacks/double-start UI.
          - Circular REC remains circular; immediate touch feedback is separate from real RECORDING confirmation.
          - Exposure/zoom/focus/WB/lens/torch/FPS values update only after the camera layer accepts the command.
          - Build Card feature states: ACTIVE / SUPPORTED / UNAVAILABLE / FAILED / UNKNOWN.
          - A feature that is visible but cannot reach the real camera must report FAILED rather than ACTIVE.
          - Build Card actions use TEST / OPEN / STATUS where safe and meaningful.
          - Curved-card rule remains consistent across workflow/build/control/diagnostic/last-take/dialog surfaces.
          - Reduce unnecessary cards; simple information uses spacing/typography instead.
          - Ordinary camera and five-mode icons remain background-free with >=48dp invisible touch targets.
          - Histogram remains VERTICAL only, edge-flush when collapsed, expanding inward without resizing preview.
          - Histogram uses local contrast only; no large permanent background panel.
          - Edge tools coordinate exposure/focus/zoom/lens/histogram/audio and avoid gesture conflicts.
          - Control auto-hide timing follows the tool: quick selections hide sooner, active manual adjustments remain longer.
          - Thin Camera Command Bar may show lens/shutter/ISO/WB/profile only from real known values.
          - Tapping a Command Bar value opens its corresponding real control instead of duplicating buttons.
          - MAIN/LIVE/TIKTOK/STATUS/INTERVIEW retain mode-specific operator priorities.
          - Interview subject/topic UI stays compact and expandable.
          - During REC collapse Build Card/settings/nonessential analysis and keep essential recording HUD only.
          - Remaining time is calculated only from known free storage + active bitrate/profile; otherwise UNKNOWN.
          - Last Take reports CLEAN/BRANDED SAVED only when each finalized output actually exists.
          - When bounded recovery fails, expose a clear RESTART CAMERA action.
          - Recover the affected mode locally where architecture permits rather than resetting unrelated mode state.
          - Technical touch-map diagnostics may display real invisible hit targets for debugging.
          - Compact performance state is FULL / REDUCED / CORE; details remain in diagnostics.
          - Workflow Build Card shows F28 MASTER CAMERA / NEW IN F28 / VERIFY FEATURES while OPEN CAMERA remains dominant.
          - Camera Build Card supports CHECK REC / CHECK HAPTICS / CHECK LENSES / CHECK AUDIO / CHECK STORAGE / OPEN DIAGNOSTICS.
          - Preserve CLEAN/BRANDED separation, camera-first entry, bounded recovery and performance priority.
          - No fabricated telemetry, no unnecessary wholesale capture-engine rewrite, no whole-preview darkening regression.
          EOF

          # FIVEMODS 30 — MASTER CAMERA camera-readiness/recording layer.
          cat > "$pkgdir/Fivemods29ShootReady.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class ShootReadiness29 { READY_TO_RECORD, LIMITED, ACTION_REQUIRED }
          enum class RecordState29 { READY, PREARMING, STARTING, RECORDING, FINALIZING, FAILED }
          enum class ThermalState29 { NORMAL, WARM, LIMITED, UNKNOWN }
          enum class OutputState29 { UNKNOWN, FINALIZING, SAVED, FAILED }

          data class ShootReadyState29(
              val readiness:ShootReadiness29,
              val reason:String?=null,
              val requiredAction:String?=null
          )

          data class DualOutputState29(
              val clean:OutputState29=OutputState29.UNKNOWN,
              val branded:OutputState29=OutputState29.UNKNOWN
          ) {
              fun allSaved()=clean==OutputState29.SAVED && branded==OutputState29.SAVED
          }

          data class RecordPrearm29(
              val cameraReady:Boolean,
              val requiredAudioReady:Boolean,
              val storageReady:Boolean,
              val inFlight:Boolean=false
          ) {
              fun mayPrearm()=cameraReady && requiredAudioReady && storageReady && !inFlight
              fun mayRecord()=cameraReady && requiredAudioReady && storageReady
          }

          object Fivemods29ShootReadyRules {
              const val MIN_TOUCH_TARGET_DP=48
              const val UI_MOTION_MS=160L
              fun recordShape()="CIRCLE"
              fun ordinaryIconHasVisibleBackground()=false
              fun monitoringMayEnterClean()=false
              fun optionalSystemMayBlockCoreRecord()=false

              fun readiness(cameraReady:Boolean,audioReady:Boolean,storageReady:Boolean)=when {
                  !cameraReady -> ShootReadiness29.ACTION_REQUIRED
                  !audioReady -> ShootReadiness29.ACTION_REQUIRED
                  !storageReady -> ShootReadiness29.ACTION_REQUIRED
                  else -> ShootReadiness29.READY_TO_RECORD
              }
          }
          KOTLIN

          cat > "$project/FIVEMODS-30-SHOOT-READY.txt" <<'EOF'
          FIVEMODS 30 — MASTER CAMERA
          - Preserve FIVEMODS 13–28, both workflow pages and all five modes.
          - Add one honest camera-entry state: READY TO RECORD / LIMITED / ACTION REQUIRED.
          - Pre-arm the recording path when camera + required audio + storage are genuinely ready to reduce REC startup work.
          - Circular REC remains circular and reflects real READY/PREARMING/STARTING/RECORDING/FINALIZING/FAILED states.
          - If REC start is rejected, immediately return to a truthful state and show the concrete reason.
          - Extend F28 control verification to stabilization/FPS/resolution/audio route/manual exposure/manual focus where supported.
          - Show brief SET/NOT SUPPORTED acknowledgement only after real command acceptance/rejection.
          - Capability-safe presets restore only supported values and adapt unsupported values honestly.
          - Preserve safe per-mode state and avoid unnecessary session recreation when switching modes.
          - Do not black out preview for cosmetic mode-change animation; show SWITCHING CAMERA only for real reconfiguration.
          - Histogram remains thin, vertical and edge-based; clipping uses compact top/bottom indication.
          - Edge HUD prioritizes context such as audio clipping in INTERVIEW or stream health in LIVE.
          - Focus reticle stays compact/background-free and communicates SEARCHING/LOCKED/LOST without another large card.
          - AE lock appears as a small edge-ruler lock indication.
          - Camera Command Bar remains thin and may swipe to secondary real-known values rather than overcrowding one row.
          - During REC automatically enter mode-appropriate Clean View; one tap may temporarily reveal safe controls.
          - Audio warnings use real silence/clipping/route-change state and do not unnecessarily stop video.
          - CLEAN and BRANDED finalization are reported independently; never hide partial output failure behind a generic SAVED state.
          - Remaining-time/storage warnings use real storage/profile data where known and otherwise UNKNOWN.
          - Thermal state is NORMAL/WARM/LIMITED/UNKNOWN only from real device information; analysis throttles before recording.
          - Workflow Page 1 becomes Shoot Board with selected mode/mission/MASTER CAMERA/Build Card/one dominant OPEN CAMERA action.
          - Workflow Page 2 Action Preflight presents recovery actions for genuine required failures; optional items remain secondary.
          - Permanent Build Card rule continues with VERIFY THIS BUILD and truthful built/active/device-support states.
          - Camera Build Card uses a compact sheet and keeps preview visible.
          - Touch Reliability 2.0 records TOUCH RECEIVED -> ACTION ACCEPTED/FAILED transitions, especially REC and mode switching.
          - First launch may safely self-check UI wiring/permissions state/camera enumeration/audio route without recording.
          - Emergency Core 3.0 retains preview/circular REC/required audio/focus/exposure/zoom where core camera remains healthy.
          - Performance order: capture/encoder -> required audio -> finalization -> essential controls -> monitoring -> diagnostics -> animation.
          - Preserve curved cards, background-free icons, vertical histogram, CLEAN/BRANDED separation and bounded recovery.
          - No fabricated telemetry, no unnecessary wholesale camera-engine rewrite, no whole-preview darkening regression.
          EOF

          # FIVEMODS 30 — MASTER CAMERA engine-source-of-truth layer.
          cat > "$pkgdir/Fivemods30MasterCamera.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class MasterRecordState30 { READY, PREARMING, STARTING, RECORDING, FINALIZING, SAVED, FAILED }
          enum class AcceptedState30 { REQUESTED, ACCEPTED, REJECTED, FAILED, UNKNOWN }
          enum class Capability30 { SUPPORTED, UNSUPPORTED, UNKNOWN }
          enum class MasterPerformance30 { FULL, REDUCED_ANALYSIS, ESSENTIAL_ONLY, EMERGENCY_MASTER }

          data class AcceptedCameraValue30(
              val key:String,
              val requested:String?=null,
              val accepted:String?=null,
              val state:AcceptedState30=AcceptedState30.UNKNOWN,
              val reason:String?=null
          ) {
              fun displayValue():String? = accepted.takeIf { state==AcceptedState30.ACCEPTED }
          }

          data class MasterRecording30(
              val state:MasterRecordState30=MasterRecordState30.READY,
              val errorCode:Int?=null,
              val errorReason:String?=null,
              val audioActive:Boolean?=null
          ) {
              fun mayShowSaved()=state==MasterRecordState30.SAVED
              fun isActuallyRecording()=state==MasterRecordState30.RECORDING
          }

          data class SessionFeatureGroup30(
              val resolution:String?=null,
              val fps:Int?=null,
              val hdr:Boolean?=null,
              val stabilization:Boolean?=null,
              val capability:Capability30=Capability30.UNKNOWN
          )

          object Fivemods30MasterRules {
              const val MIN_TOUCH_TARGET_DP=48
              const val UI_MOTION_MS=160L
              fun recordShape()="CIRCLE"
              fun ordinaryIconHasVisibleBackground()=false
              fun monitoringMayEnterClean()=false
              fun optionalSystemMayBlockCoreRecord()=false

              // UI reports accepted engine state, never request intent.
              fun mayPublish(value:AcceptedCameraValue30)=value.state==AcceptedState30.ACCEPTED

              // SAVED is legal only after real finalization.
              fun mayPublishSaved(recording:MasterRecording30)=recording.state==MasterRecordState30.SAVED

              fun performance(thermalPressure:Boolean,droppedFrames:Long?,advancedFailure:Boolean)=when {
                  advancedFailure -> MasterPerformance30.EMERGENCY_MASTER
                  droppedFrames!=null && droppedFrames>0L -> MasterPerformance30.ESSENTIAL_ONLY
                  thermalPressure -> MasterPerformance30.REDUCED_ANALYSIS
                  else -> MasterPerformance30.FULL
              }
          }
          KOTLIN

          cat > "$project/FIVEMODS-30-MASTER-CAMERA.txt" <<'EOF'
          FIVEMODS 30 — MASTER CAMERA
          - Preserve FIVEMODS 13–29, both workflow pages and all five modes.
          - Establish one authoritative REC controller/state machine for the circular REC control.
          - UI must never claim RECORDING from touch intent alone; engine state is the source of truth.
          - SAVED is shown only after actual recording finalization succeeds.
          - Resolve complete session feature combinations before applying resolution/FPS/HDR/stabilization combinations.
          - Expose only hardware/session-supported FPS and high-speed choices; unsupported values remain unavailable/unknown.
          - If a requested feature group is unsupported, use an honest supported fallback rather than black/frozen preview.
          - Avoid unnecessary full camera unbind/rebind for small control changes.
          - Histogram/peaking/tracking analysis must release frames promptly and throttle before blocking capture.
          - Vertical histogram, circular REC, curved cards and background-free ordinary icons remain permanent.
          - Low-light boost and torch-strength controls appear only when genuine device/API support exists.
          - Translate real recording errors into concrete operator-facing reasons where the engine provides them.
          - Verify required audio start separately from video recording state.
          - Persistent-recording architecture may be prepared cautiously but must not be forced into unsupported mode transitions.
          - F28 command-acceptance rule is mandatory for exposure/focus/WB/lens/torch/FPS/resolution/stabilization/audio-route values.
          - Master Command Bar displays only real accepted values and opens the corresponding control when tapped.
          - Exposure/focus and zoom/lens/histogram/audio remain coordinated edge systems.
          - During REC keep circular STOP/tally/timecode/audio/remaining time and critical warnings; collapse nonessential UI.
          - Recovery restores last ACCEPTED supported settings rather than merely requested UI values.
          - Failures in Interview tracking or LIVE networking must remain isolated from unrelated camera modes/core local recording.
          - Emergency Master Camera retains preview/circular REC/required audio/exposure/focus/zoom when advanced systems fail.
          - Workflow Page 1 becomes Master Shoot Board with mode/mission/ready/profile/F30 Build Card and dominant OPEN CAMERA.
          - Workflow Page 2 Master Preflight gives actions for required camera/audio/storage failures; optional telemetry remains secondary.
          - Permanent Build Card rule continues with live REC ENGINE/CAMERA SESSION/FPS/LENSES/AUDIO/STORAGE/LOW LIGHT/TORCH/HAPTICS/RECOVERY checks.
          - Build Card distinguishes F30 NEW / INHERITED / DEVICE SUPPORTED / ACTIVE / FAILED.
          - Diagnostics timeline records camera state changes, recording events, accepted/rejected commands and recovery attempts without storing video/audio content.
          - Performance priority: recording/encoder -> required audio -> file finalization -> preview -> essential controls -> monitoring -> diagnostics -> animation.
          - Preserve CLEAN/BRANDED separation, camera-first entry and bounded recovery.
          - No fabricated telemetry, no unnecessary wholesale engine rewrite, no whole-preview darkening regression.
          EOF

          # Record the FIVEMODS 30 source contract for the build artifact.
          cat > "$project/FIVEMODS-30-UPGRADE.txt" <<'EOF'
          FIVEMODS 30
          - Existing five-mode camera and two workflow pages preserved.
          - Existing capture/encode engine preserved; recovery wraps it rather than replacing it.
          - Android CAMERA/RECORD_AUDIO permissions remain mandatory where required.
          - Optional readiness remains advisory and cannot block camera entry.
          - Haptic helper retained for tap/select/confirm/reject interactions.
          - Bounded preview recovery primitives added: stall detection, two retries, honest failure.
          - No whole-preview darkening changes; local control backing only.
          - Unsupported capabilities must use honest supported fallbacks.
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Verify protected source contracts
        working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
        run: python3 ci/verify_source_contracts.py

      - name: Build app, test APK and unit tests
        working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Give the compiled APK a new phone-friendly name
        shell: bash
        run: |
          set -euo pipefail
          source_apk="_build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk"
          delivery="_delivery/fivemods-30-compiled"
          test -f "$source_apk"
          mkdir -p "$delivery"
          cp "$source_apk" "$delivery/FIVEMODS-30-MASTER-CAMERA.apk"
          sha256sum "$delivery/FIVEMODS-30-MASTER-CAMERA.apk" > "$delivery/FIVEMODS-30-MASTER-CAMERA.apk.sha256"

      - name: Upload FIVEMODS 30 compiled APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-FIVEMODS-30-MASTER-CAMERA-${{ github.run_number }}
          path: _delivery/fivemods-30-compiled/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare the device gate as one executable script
        shell: bash
        run: |
          set -euo pipefail
          script_path="_build_source/Develop-Uganda-28600-Parts-9-10/build/run-du28600-device-gate.sh"
          mkdir -p "$(dirname "$script_path")"
          cat > "$script_path" <<'DEVICE_GATE'
          #!/usr/bin/env bash
          set -euo pipefail

          project="${GITHUB_WORKSPACE}/_build_source/Develop-Uganda-28600-Parts-9-10"
          cd "$project"

          serial="emulator-${EMULATOR_PORT:-5556}"
          evidence="${project}/build/device-gate"
          app_apk="${project}/app/build/outputs/apk/debug/app-debug.apk"
          test_apk="${project}/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"

          test -n "$evidence"
          mkdir -p -- "$evidence"
          trap 'adb -s "$serial" logcat -d -v threadtime > "$evidence/logcat.txt" 2>&1 || true' EXIT

          adb -s "$serial" wait-for-device
          adb devices -l | tee "$evidence/adb-devices.txt"
          boot_completed="$(adb -s "$serial" shell getprop sys.boot_completed | tr -d '\r')"
          test "$boot_completed" = "1"
          test -f "$app_apk"
          test -f "$test_apk"

          adb -s "$serial" install -r -t "$app_apk"
          adb -s "$serial" install -r -t "$test_apk"

          runner="$(
            adb -s "$serial" shell pm list instrumentation |
              tr -d '\r' |
              awk '/target=com.sentongoharuna.pulse\)/ {sub(/^instrumentation:/, "", $1); print $1; exit}'
          )"
          test -n "$runner"
          printf 'RUNNER=%s\n' "$runner" | tee "$evidence/runner.txt"

          # Clear stale logs so crash evidence belongs to this exact run.
          adb -s "$serial" logcat -c || true
          adb -s "$serial" shell dumpsys package com.sentongoharuna.pulse > "$evidence/package-before-test.txt" 2>&1 || true
          adb -s "$serial" shell dumpsys package com.sentongoharuna.pulse.test > "$evidence/test-package-before-test.txt" 2>&1 || true

          # Run the instrumentation suite with active-progress supervision.
          # Capture diagnostics before killing a genuinely stalled run.
          : > "$evidence/device-tests.txt"
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            adb -s "$serial" shell am instrument -w -r "$runner" 2>&1 |
            tee "$evidence/device-tests.txt"
          device_status=${PIPESTATUS[0]}
          set -e

          if test "$device_status" -eq 124; then
            echo "DEVICE TEST GATE TIMEOUT after 30 minutes." | tee "$evidence/timeout-diagnostic.txt"
            adb -s "$serial" shell dumpsys activity processes >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity top >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            adb -s "$serial" shell ps -A >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            echo "DEVICE TEST GATE FAILED: suite timed out; diagnostics were preserved." >&2
            exit 124
          fi

          test "$device_status" -eq 0
          if grep -Eq 'FAIL:|FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_CODE: 0|Process crashed' "$evidence/device-tests.txt"; then
            echo "DEVICE TEST GATE FAILED: capturing crash diagnostics." >&2
            adb -s "$serial" logcat -d -v threadtime > "$evidence/logcat-on-failure.txt" 2>&1 || true
            grep -Ei -B 40 -A 120 'FATAL EXCEPTION|AndroidRuntime|Process: com\.sentongoharuna\.pulse|Process crashed|signal [0-9]+|tombstone|ANR in' "$evidence/logcat-on-failure.txt" > "$evidence/CRASH-FOCUS.txt" 2>/dev/null || true
            adb -s "$serial" shell dumpsys activity processes > "$evidence/processes-on-failure.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity exit-info com.sentongoharuna.pulse > "$evidence/app-exit-info.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity exit-info com.sentongoharuna.pulse.test > "$evidence/test-exit-info.txt" 2>&1 || true
            printf '%s\n' "DEVICE_TEST_STATUS=CRASHED" "APK_STATUS=COMPILED_NOT_DEVICE_VERIFIED" > "$evidence/STATUS.txt"
            echo "Instrumentation crashed; diagnostics captured. APK remains compiled but is not certified post-diagnostic."
            exit 0
          fi

          # AndroidJUnitRunner normally reports OK (N tests). Also accept its
          # successful INSTRUMENTATION_CODE=-1 completion marker.
          if ! grep -Eq 'OK \([1-9][0-9]* (device )?tests?\)|INSTRUMENTATION_CODE: -1' "$evidence/device-tests.txt"; then
            echo "DEVICE TEST GATE FAILED: no successful instrumentation completion marker." >&2
            exit 1
          fi

          echo "DEVICE TEST GATE PASSED." | tee "$evidence/gate-result.txt"
          DEVICE_GATE
          chmod +x "$script_path"
          bash -n "$script_path"

      - name: Run all 20 device tests on a fresh API 35 emulator
        timeout-minutes: 42
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 1536M
          avd-name: fivemods30_api35
          force-avd-creation: true
          emulator-port: 5556
          emulator-boot-timeout: 900
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back emulated -camera-front emulated
          script: bash "${GITHUB_WORKSPACE}/_build_source/Develop-Uganda-28600-Parts-9-10/build/run-du28600-device-gate.sh"

      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DU28600-FIVEMODS-30-SELF-DIAGNOSTIC-EVIDENCE-${{ github.run_number }}
          path: _build_source/Develop-Uganda-28600-Parts-9-10/build/device-gate/*
          if-no-files-found: warn
          retention-days: 14

      - name: Give the post-diagnostic APK an honest phone-friendly name
        shell: bash
        run: |
          set -euo pipefail
          source_apk="_build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk"
          delivery="_delivery/fivemods-30-post-diagnostic"
          test -f "$source_apk"
          mkdir -p "$delivery"
          cp "$source_apk" "$delivery/FIVEMODS-30-POST-DIAGNOSTIC-NOT-VERIFIED.apk"
          sha256sum "$delivery/FIVEMODS-30-POST-DIAGNOSTIC-NOT-VERIFIED.apk" > "$delivery/FIVEMODS-30-POST-DIAGNOSTIC-NOT-VERIFIED.apk.sha256"

      - name: Upload FIVEMODS 30 post-diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-DU28600-FIVEMODS-30-POST-DIAGNOSTIC-NOT-VERIFIED-${{ github.run_number }}
          path: _delivery/fivemods-30-post-diagnostic/*
          if-no-files-found: error
          retention-days: 14
