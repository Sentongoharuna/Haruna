name: 00 - BUILD DEVELOP UGANDA 28600 PARTS 9-10 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Develop-Uganda-28600-Parts-9-10-source.zip"
      - ".github/workflows/00-BUILD-DEVELOP-UGANDA-28600-PARTS-9-10-APK.yml"
      - ".github/workflows/00-UPLOAD-THIS-FIVEMODS-12-FAST-APK.yml"

permissions:
  contents: read

concurrency:
  group: develop-uganda-28600-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out uploaded files
        uses: actions/checkout@v6

      - name: Extract the Android source
        shell: bash
        run: |
          set -euo pipefail
          archive="Develop-Uganda-28600-Parts-9-10-source.zip"
          project="_build_source/Develop-Uganda-28600-Parts-9-10"
          test -f "$archive"
          unzip -tq "$archive"
          mkdir -p "_build_source"
          unzip -q "$archive" -d "_build_source"
          test -f "$project/settings.gradle.kts"
          test -f "$project/app/build.gradle.kts"
          test -f "$project/ci/verify_source_contracts.py"
          grep -E "versionCode|versionName" "$project/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Verify protected source contracts
        working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
        run: python3 ci/verify_source_contracts.py

      - name: Build the app and instrumentation APKs
        working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload compiled APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: 00-DEVELOP-UGANDA-28600-PARTS-9-10-COMPILED-APK-${{ github.run_number }}
          path: _build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for the device gate
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the API 35 device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload device-verified APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DEVELOP-UGANDA-28600-PARTS-9-10-DEVICE-VERIFIED-APK-${{ github.run_number }}
          path: _build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
