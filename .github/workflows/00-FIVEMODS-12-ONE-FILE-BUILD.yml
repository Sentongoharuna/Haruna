name: 00 - FIVEMODS 12 ONE FILE APK BUILD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/00-FIVEMODS-12-ONE-FILE-BUILD.yml"

permissions:
  contents: read

concurrency:
  group: fivemods-12-one-file-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fivemods-12:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble FIVEMODS 12 source on this runner only
        shell: bash
        run: |
          set -euo pipefail
          base_zip="Develop-Uganda-FIVEMODS-11-Committed-Source.zip"
          base_hash="dc56134a3093fe9f47cd8b5d16ae7395885eb97392c580d5ab6178ae6c115e2d"
          overlay_hash="fa0d83005ecdb856274566a1ae85f1afad140620a7c8ac970d63f12a7d84638f"

          test -s "$base_zip" || {
            echo "The existing FIVEMODS 11 source ZIP is missing from the repository root."
            exit 1
          }
          echo "$base_hash  $base_zip" | sha256sum --check --strict

          staging="$(mktemp -d)"
          unzip -q "$base_zip" -d "$staging"
          source_root="$staging/Develop-Uganda-FIVEMODS-11"
