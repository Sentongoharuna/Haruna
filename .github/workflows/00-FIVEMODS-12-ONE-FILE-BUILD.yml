      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36 and emulator tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if test ! -x "$sdkmanager_bin"; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify protected source contracts
        run: python3 ci/verify_source_contracts.py

      - name: Compile debug app, test APK and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run five-mode device tests
        id: device_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Name and checksum debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" 00-FIVEMODS-12-FIELD-RELIABILITY.apk
          sha256sum 00-FIVEMODS-12-FIELD-RELIABILITY.apk > 00-FIVEMODS-12-FIELD-RELIABILITY-SHA256.txt
          device_test_outcome="${{ steps.device_tests.outcome }}"
          {
            echo "APK compile: PASSED"
            echo "Protected source contracts: PASSED"
            echo "Cloud emulator device tests: ${device_test_outcome^^}"
            echo "Signing: Android debug key"
          } > 00-FIVEMODS-12-BUILD-STATUS.txt
          {
            echo "### FIVEMODS 12 APK"
            echo "- APK compile: PASSED"
            echo "- Protected source contracts: PASSED"
            echo "- Cloud emulator device tests: ${device_test_outcome^^}"
            echo "- Download artifact: 00-DOWNLOAD-FIVEMODS-12-APK-RUN-${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-FIVEMODS-12-APK-RUN-${{ github.run_number }}
          path: |
            00-FIVEMODS-12-FIELD-RELIABILITY.apk
            00-FIVEMODS-12-FIELD-RELIABILITY-SHA256.txt
            00-FIVEMODS-12-BUILD-STATUS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-12-VERIFICATION-${{ github.run_number }}
          path: |
            build/verification/**
            app/build/reports/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
