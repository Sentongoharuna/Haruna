name: SECTION1 R7 LIVE STYLE TRANSPORT APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Apply R7 LIVE style transport
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt"
          test -s "$F"; test -s "$C"
          python3 - "$F" "$C" <<'PY'
          from pathlib import Path
          import re,sys
          f=Path(sys.argv[1]); c=Path(sys.argv[2]); s=f.read_text()
          def sub(pattern,repl,label,count=1):
              global s
              s2,n=re.subn(pattern,repl,s,count=count,flags=re.M|re.S)
              if n!=count: raise SystemExit(f"R7 {label} matches={n}")
              s=s2
          sub(r'^\s*bottomDeck\.addView\(modeRow\)\s*$', '        // SECTION1-R7: settings row removed from shooting surface.\n        modeRow.visibility = View.GONE','mode row')
          sub(r'^\s*bottomDeck\.addView\(zoomRow\)\s*$','        zoomRow.visibility = View.GONE','zoom row')
          sub(r'^\s*bottomDeck\.addView\(exposureRow\)\s*$','        exposureRow.visibility = View.GONE','exposure row')
          sub(r'reportRecordArea\.addView\(\s*recordButton,\s*FrameLayout\.LayoutParams\(\s*dp\(132\),\s*dp\(50\),\s*Gravity\.CENTER\s*\)\s*\)', 'reportRecordArea.addView(\n            recordButton,\n            FrameLayout.LayoutParams(dp(78), dp(78), Gravity.CENTER)\n        )','record geometry')
          sub(r'reportRecordArea,\s*wrap\(150,\s*62\)', 'reportRecordArea,\n            wrap(86, 86)','record area')
          start=s.find('    private fun makeRecordButton(): Button {')
          end=s.find('    private fun space(width: Int): View {',start)
          if start<0 or end<0: raise SystemExit('R7 makeRecordButton missing')
          new='''    private fun makeRecordButton(): Button {
        return Button(this).apply {
            tag = "section1_r7_live_style_record"
            text = "●"
            textSize = 22f
            isAllCaps = false
            setTextColor(DevelopUgandaFivemods8Theme.content)
            minWidth = dp(78)
            minHeight = dp(78)
            minimumWidth = dp(78)
            minimumHeight = dp(78)
            setPadding(0, 0, 0, 0)
            background = GradientDrawable().apply {
                shape = GradientDrawable.OVAL
                setColor(DevelopUgandaFivemods8Theme.transparent)
                setStroke(dp(2), DevelopUgandaFivemods8Theme.record)
            }
            contentDescription = "Record"
        }
    }

'''
          s=s[:start]+new+s[end:]
          pat=r'''        listOf\(
            modeRow,
            reportToolsRow,
            reportAdvancedRow,
            reportDisplayRow,
            reportOutputRow,
            reportDirectorRow,
            zoomRow,
            exposureRow
        \)\.forEach \{
            it\.visibility =
                visibility
        \}'''
          repl='''        listOf(
            reportToolsRow,
            reportAdvancedRow,
            reportDisplayRow,
            reportOutputRow,
            reportDirectorRow
        ).forEach { it.visibility = visibility }
        // SECTION1-R7: legacy rows never return over preview.
        modeRow.visibility = View.GONE
        zoomRow.visibility = View.GONE
        exposureRow.visibility = View.GONE'''
          sub(pat,repl,'operator visibility')
          f.write_text(s)
          x=c.read_text()
          x=x.replace('visibility = if (prefs.getBoolean("guides", false)) View.VISIBLE else View.GONE','visibility = View.GONE')
          x=x.replace('            root.addView(controlRail)\n            placeRail()\n','            // SECTION1-R7: legacy rail intentionally not mounted.\n            controlRail.visibility = View.GONE\n',1)
          c.write_text(x)
          PY
          grep -q 'section1_r7_live_style_record' "$F"
          grep -q 'SECTION1-R7: legacy rows never return' "$F"
          grep -q 'recordButton.setOnTouchListener' "$F"
      - name: Verify protected contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          P="app/src/main/java/com/sentongoharuna/pulse"
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'recordButton.setOnTouchListener' "$P/DevelopUgandaCameraActivity.kt"
          grep -q 'DevelopUgandaFivemods12CameraShell.attach' "$P/DevelopUgandaCameraActivity.kt"
      - name: Test and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SECTION1-R7-LIVE-STYLE-TRANSPORT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R7-LIVE-STYLE-TRANSPORT
          path: out/SECTION1-R7-LIVE-STYLE-TRANSPORT.apk
          if-no-files-found: error
          retention-days: 14
