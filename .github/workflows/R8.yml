      - name: Verify protected contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          grep -q 'tag = "f12_status_strip"' app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods12FieldUi.kt
          grep -q 'recordButton.setOnTouchListener' app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt

      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: R8 device runtime layout gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Verify assembled R8 APK identity
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$ANALYZER" ] && [ -n "$SDK_ROOT" ]; then
            ANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -print -quit)"
          fi
          test -n "$ANALYZER"
          "$ANALYZER" manifest print "$SRC" > /tmp/r8-apk-manifest.xml
          grep -q '288.02-r8-section2-r6-runtime-lock' /tmp/r8-apk-manifest.xml
          grep -q 'R8_SECTION2_R6_LOCKED' /tmp/r8-apk-manifest.xml
          unzip -p "$SRC" classes.dex | strings > /tmp/r8-dex-strings.txt
          grep -q 'r8LockR6VisualBaseline' /tmp/r8-dex-strings.txt
          grep -q 'DevelopUgandaCameraCapabilityFallback' /tmp/r8-dex-strings.txt
          echo "R8 APK VERIFIED • CORRECT BUILD ID • R6 LOCK • SECTION 2"

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          OUT="R8-R6-LOCKED-SECTION2-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: R8-R6-LOCKED-SECTION2-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
