name: 00 - SECTION1 R9-2 SHUTTER ONLY
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-SECTION1-R9-4-REFINED-HUD.yml"]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Recover exact proven R9 patch
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/Sentongoharuna/Haruna/8883a1402fb10bb2234b8e3f7cf1a7a26609b533/.github/workflows/00-SECTION1-R9-CLEAR-UI-REAL-SOURCE.yml"
          curl --fail --location --retry 3 --connect-timeout 15 "$URL" -o /tmp/proven-r9.yml
          test -s /tmp/proven-r9.yml
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          y=Path("/tmp/proven-r9.yml").read_text()
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/r9_patch.py", y)
          if not m:
              raise SystemExit("PROVEN R9 PATCH PAYLOAD NOT FOUND")
          Path("/tmp/r9_patch.py").write_bytes(base64.b64decode(m.group(1)))
          PY
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          B="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt"
          test -s "$A"
          test -s "$B"
          python3 /tmp/r9_patch.py "$A" "$B"
          grep -q 'r9_live_style_record' "$A"
          grep -q 'SECTION1-R9-CLEAR-UI' "$A"
          ! grep -q 'root.addView(controlRail)' "$B"
          grep -q 'recordButton.setOnTouchListener' "$A"
          echo "EXACT PROVEN R9 PATCH APPLIED"

      - name: R9-2 shutter-only correction
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace('"● RECORD"', '"●"')
          s=s.replace('"● PHOTO"', '"●"')
          p.write_text(s)
          PY
          grep -q 'r9_live_style_record' "$F"
          ! grep -q '"● RECORD"' "$F"
          ! grep -q '"● PHOTO"' "$F"
          grep -q 'recordButton.setOnTouchListener' "$F"
          echo "R9-2 SHUTTER FIX VERIFIED"

      - name: R9-4 refine working R9-2 HUD
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          F12="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods12FieldUi.kt"
          python3 - "$A" "$F12" <<'PY'
          from pathlib import Path
          import sys
          a=Path(sys.argv[1]); s=a.read_text()
          f=Path(sys.argv[2]); u=f.read_text()

          # Preserve R9-2 capture and transport. Compact the circular shutter only.
          s=s.replace("minWidth = dp(76)\n            minHeight = dp(76)\n            minimumWidth = dp(76)\n            minimumHeight = dp(76)",
                      "minWidth = dp(72)\n            minHeight = dp(72)\n            minimumWidth = dp(72)\n            minimumHeight = dp(72)",1)

          # Compact F12 top instrument; transparent/outline-only, never touches preview exposure.
          u=u.replace("setPadding(dp(6), dp(4), dp(6), dp(4))",
                      "setPadding(dp(4), dp(2), dp(4), dp(2))",1)
          u=u.replace("background = rounded(DevelopUgandaFivemods8Theme.transparent, identity.accent, dp(2), dp(1))",
                      "background = rounded(DevelopUgandaFivemods8Theme.transparent, identity.accent, dp(1), dp(1))",1)
          u=u.replace("LinearLayout.LayoutParams(0, dp(22), 1f)",
                      "LinearLayout.LayoutParams(0, dp(18), 1f)")
          u=u.replace("LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(22))",
                      "LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(18))")

          # F12 is the single top owner; suppress only the duplicate legacy narration panel.
          marker="        f12CameraShell?.updateBroadcastStatus(f12Status)\n"
          if marker in s and "R9-4 SINGLE TOP OWNER" not in s:
              s=s.replace(marker, marker + "        // R9-4 SINGLE TOP OWNER\n        if (::previewNarrationPanel.isInitialized) previewNarrationPanel.visibility = View.GONE\n",1)

          a.write_text(s); f.write_text(u)
          PY
          grep -q 'r9_live_style_record' "$A"
          grep -q 'recordButton.setOnTouchListener' "$A"
          grep -q 'tag = "f12_status_strip"' "$F12"
          echo "R9-4 REFINEMENT VERIFIED"

      - name: Verify protected source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          P="app/src/main/java/com/sentongoharuna/pulse"
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'recordButton.setOnTouchListener' "$P/DevelopUgandaCameraActivity.kt"

      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          OUT="SECTION1-R9-4-REFINED-HUD-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload R9-4 APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R9-4-REFINED-HUD-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
