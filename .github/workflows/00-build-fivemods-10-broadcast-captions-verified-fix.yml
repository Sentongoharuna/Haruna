        run: |
          set -euo pipefail
          test -f develop_uganda_five_mode_source.zip || { echo "::error::Missing source ZIP"; exit 1; }
          test -f .github/workflows/build-fivemods-8.yml || { echo "::error::Missing real F8 workflow needed to restore its home-console repair"; exit 1; }
          test ! -e f9-repair-audit || { echo "::error::Repair audit already exists; fresh checkout required"; exit 1; }
