              console = read(PACKAGE / CONSOLE)
              require('"%s • %s • S%03d T%03d | MIC %s | BAT %s | %dGB | THERM %s | READY %d%%"' in console,
                      'F8 percent-safe status ribbon missing')
              newsroom = read(PACKAGE / 'DevelopUgandaNewsroomActivity.kt')
              require('        showHome()' in newsroom and 'private fun openReportCamera()' in newsroom, 'Original second home/camera route missing')


          if __name__ == '__main__':
              require(len(sys.argv) == 2 and sys.argv[1] in ('prepare', 'finish'), 'Usage: repair_existing_f9.py prepare|finish')
