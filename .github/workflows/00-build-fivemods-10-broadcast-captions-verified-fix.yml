      - name: Apply FIVEMODS 10 Interview exposure repair
        shell: bash
        run: |
          set -euo pipefail
          test -d source || { echo "::error::FIVEMODS 9 source is missing"; exit 1; }
          test -f f9-repair-audit/verification.json || { echo "::error::FIVEMODS 9 verification is missing"; exit 1; }
          mkdir -p .fivemods10
          cat > .fivemods10/apply_fivemods10_exposure.py <<'FIVEMODS_10_EXPOSURE_PY'
          """Apply the focused FIVEMODS 10 Interview auto-exposure repair."""

          from __future__ import annotations

          import difflib
          import hashlib
          import json
          from pathlib import Path
          import sys


          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)


          def exact(text: str, old: str, new: str, label: str) -> str:
              found = text.count(old)
              require(found == 1, f"{label}: expected exactly one anchor, found {found}")
              return text.replace(old, new)


          def selected_block(text: str, start: str, end: str, label: str) -> str:
              require(text.count(start) == 1, f"{label}: start anchor missing or ambiguous")
              require(text.count(end) == 1, f"{label}: end anchor missing or ambiguous")
              first = text.index(start)
              last = text.index(end, first)
              require(last > first, f"{label}: anchors out of order")
              return text[first:last]


          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def main() -> None:
              require(len(sys.argv) == 2, "Usage: apply_fivemods10_exposure.py SOURCE")
              source = Path(sys.argv[1])
              package = source / "app/src/main/java/com/sentongoharuna/pulse"
              camera_path = package / "DevelopUgandaCameraActivity.kt"
              build_path = source / "app/build.gradle.kts"
              audit = Path("f10-exposure-audit")
              audit.mkdir(exist_ok=True)

              require(camera_path.is_file(), f"Required camera source missing: {camera_path}")
              require(build_path.is_file(), f"Required app build file missing: {build_path}")

              camera_before = camera_path.read_text(encoding="utf-8")
              build_before = build_path.read_text(encoding="utf-8")

              function_before = selected_block(
                  camera_before,
                  "    // Exposure applies only to auto, unlocked Interview capture and only when\n",
                  "\n    private fun f9UpdateAudioTelemetry(",
                  "FIVEMODS 9 Interview exposure policy",
              )
              require("val lux = ambientLux ?: return" in function_before, "Expected ambient-light exposure override is absent")
              require("lux < 25f -> 0.7f" in function_before, "Expected +0.7 EV branch is absent")
              require("lux < 100f -> 0.33f" in function_before, "Expected +0.33 EV branch is absent")

              function_after = '''    // FIVEMODS 10: the phone's ambient-light sensor is not the camera
              // meter. It can be shaded by a hand or face while the lens sees a bright
              // scene, so it must never drive capture exposure. Keep CameraX AE neutral
              // unless the operator deliberately moved the existing EV control.
              private fun f9ApplyInterviewExposure() {
                  if (
                      !isInterviewCamera() ||
                      operatorLocked ||
                      focusLockActive ||
                      v244ShutterAngle > 0 ||
                      v244Iso > 0
                  ) return
                  val cam = camera ?: return
                  val state = cam.cameraInfo.exposureState
                  if (!state.isExposureCompensationSupported) return
                  val requestedIndex =
                      sceneExposureTarget.coerceIn(
                          state.exposureCompensationRange.lower,
                          state.exposureCompensationRange.upper
                      )
                  if (state.exposureCompensationIndex != requestedIndex) {
                      cam.cameraControl.setExposureCompensationIndex(requestedIndex)
                  }
              }
          '''
              camera_after = exact(
                  camera_before,
                  function_before,
                  function_after,
                  "replace unsafe ambient-light exposure policy",
              )

              controls_before = selected_block(
                  camera_after,
                  "    private fun v244ApplyCamera2Controls(): String {",
                  "\n    internal fun v244CycleShutterAngle(): String {",
                  "Camera2 controls",
              )
              auto_old = '''                builder.setCaptureRequestOption(
                              CaptureRequest.CONTROL_AE_MODE,
                              CaptureRequest.CONTROL_AE_MODE_ON
                          )
          '''
              auto_new = '''                builder.setCaptureRequestOption(
                              CaptureRequest.CONTROL_AE_MODE,
                              CaptureRequest.CONTROL_AE_MODE_ON
                          )
                          if (isInterviewCamera()) {
                              // Release a stale metering lock only when Interview returns to AUTO.
                              builder.setCaptureRequestOption(
                                  CaptureRequest.CONTROL_AE_LOCK,
                                  false
                              )
                          }
          '''
              require(controls_before.count(auto_old) == 1, "Camera2 auto-AE branch is missing or ambiguous")
              controls_after = controls_before.replace(auto_old, auto_new)
              camera_after = exact(
                  camera_after,
                  controls_before,
                  controls_after,
                  "release stale auto-exposure lock",
              )

              build_after = exact(
                  build_before,
                  "        versionCode = 28191\n        versionName = \"280.19.1-apk-artifact-delivery\"",
                  "        versionCode = 28210\n        versionName = \"282.10-interview-auto-exposure-repair\"",
                  "FIVEMODS 10 version",
              )

              # Contract verification before writing anything.
              repaired_function = selected_block(
                  camera_after,
                  "    // FIVEMODS 10: the phone's ambient-light sensor is not the camera\n",
                  "\n    private fun f9UpdateAudioTelemetry(",
                  "repaired Interview exposure policy",
              )
              require("ambientLux" not in repaired_function, "Ambient-light sensor still controls Interview exposure")
              require("requestedEv" not in repaired_function, "Synthetic EV boost still exists")
              require("sceneExposureTarget.coerceIn(" in repaired_function, "Operator EV is not preserved")
              require(repaired_function.count("setExposureCompensationIndex(requestedIndex)") == 1, "Neutral/operator EV application is ambiguous")
              require(camera_after.count("private fun f9ApplyInterviewExposure()") == 1, "Interview exposure policy count changed")
              require(camera_after.count("f9ApplyInterviewExposure()") == 4, "Interview exposure call inventory changed")
              repaired_controls = selected_block(
                  camera_after,
                  "    private fun v244ApplyCamera2Controls(): String {",
                  "\n    internal fun v244CycleShutterAngle(): String {",
                  "repaired Camera2 controls",
              )
              require(repaired_controls.count("CaptureRequest.CONTROL_AE_MODE_OFF") == 1, "Manual exposure branch changed")
              require(repaired_controls.count("CaptureRequest.CONTROL_AE_MODE_ON") == 1, "Auto exposure branch changed")
              require(repaired_controls.count("if (isInterviewCamera()) {") == 2, "Interview-only Camera2 branches changed")
              require(repaired_controls.count("CaptureRequest.CONTROL_AE_LOCK,\n                        false") == 1, "AE unlock is absent or ambiguous")

              # Preview opacity and F9 output contracts are intentionally untouched.
              for alpha in (38, 66, 82):
                  require(
                      camera_before.count(f"DevelopUgandaFivemods8Theme.surfaceScrim({alpha})")
                      == camera_after.count(f"DevelopUgandaFivemods8Theme.surfaceScrim({alpha})"),
                      f"surfaceScrim({alpha}) inventory changed",
                  )
              require("du_viewfinder_indicator_backing" not in camera_after, "Opaque viewfinder token reached CameraActivity")
              for contract in (
                  "DevelopUgandaFivemods9DualOutputExporter",
                  "f9DualOutputExporter",
                  "f9AttachCaptureTelemetry",
              ):
                  require(contract in camera_after, f"FIVEMODS 9 contract missing: {contract}")

              camera_path.write_text(camera_after, encoding="utf-8")
              build_path.write_text(build_after, encoding="utf-8")

              diff_path = audit / "FIVEMODS-10-interview-exposure.diff"
              diff_path.write_text(
                  "".join(
                      difflib.unified_diff(
                          camera_before.splitlines(True),
                          camera_after.splitlines(True),
                          "a/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt",
                          "b/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt",
                      )
                  )
                  + "".join(
                      difflib.unified_diff(
                          build_before.splitlines(True),
                          build_after.splitlines(True),
                          "a/app/build.gradle.kts",
                          "b/app/build.gradle.kts",
                      )
                  ),
                  encoding="utf-8",
              )
              report = {
                  "build": "FIVEMODS 10",
                  "repair": "Interview auto-exposure",
                  "observed_evidence": {
                      "clip_1000784855_average_luma_8bit": 254.9,
                      "clip_1000784860_average_luma_8bit": 229.0,
                      "diagnosis": "recorded frames are overexposed; this is not a preview scrim",
                  },
                  "cause_removed": "ambient-light sensor based +0.33/+0.70 EV capture override",
                  "replacement": "CameraX AE with neutral scene EV or the operator's real EV selection",
                  "stale_ae_lock_release": True,
                  "manual_iso_shutter_preserved": True,
                  "fivemods9_dual_output_preserved": True,
                  "camera_source_sha256_before": hashlib.sha256(camera_before.encode()).hexdigest(),
                  "camera_source_sha256_after": sha256(camera_path),
                  "diff_sha256": sha256(diff_path),
              }
              (audit / "verification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              print("PASS: FIVEMODS 10 Interview exposure repair applied and contracts verified")


          if __name__ == "__main__":
              main()
