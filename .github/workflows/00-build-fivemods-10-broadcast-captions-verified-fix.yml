                          return
                      }

                      // Restore the real F8 handoff order: release this mode first,
                      // allow the physical camera/surface to settle, then open a fresh
                      // destination Activity. REORDER_TO_FRONT could revive a stale,
                      // already-paused camera Activity.
                      handoffInFlight = true
                      releaseCamera()
                      strip.postDelayed(
                          {
                              if (!activity.isFinishing && !activity.isDestroyed) {
                                  if (DevelopUgandaV270Guidance.safeOpen(activity, destination.activity)) {
                                      activity.finish()
                                  }
                              }
                          },
                          CAMERA_HANDOFF_SETTLE_MS
                      )
                  }'''
              text = exact(text, old, new, 'ordered mode navigation')
              require('FLAG_ACTIVITY_REORDER_TO_FRONT' not in text, 'Stale-Activity reorder flag survived')
              return text


          def repair_camera_handoff(text):
              """Give the shared F9 CameraActivity its existing F8 pre-switch release hook."""
              anchor = '''    private fun isInterviewCamera(): Boolean =
                  additiveModeProfile()?.page == DevelopUgandaCameraPage.INTERVIEW

          '''
              helper = '''    /** Release only while idle, before the shared navigator opens another mode. */
              private fun releaseCameraForModeSwitch() {
                  if (recording != null) return
                  try {
                      provider?.unbindAll()
                  } catch (_: Exception) {
                  }
                  try {
                      overlayEffect?.close()
                  } catch (_: Exception) {
                  }
                  // ProcessCameraProvider is process-wide. Clear this Activity's handle
                  // so its later onDestroy cannot unbind the destination's new session.
                  provider = null
                  overlayEffect = null
                  camera = null
                  videoCapture = null
                  imageCapture = null
              }

          '''
              text = exact(text, anchor, anchor + helper, 'CameraActivity release hook')
              text = exact(
                  text,
                  '                    canNavigate = { recording == null && !statusSegmentRestartPending }\n',
                  '                    canNavigate = { recording == null && !statusSegmentRestartPending },\n'
                  '                    releaseCamera = ::releaseCameraForModeSwitch\n',
                  'CameraActivity navigator callback',
              )
              return text


          def repair_live_handoff(text):
              """Retain Live's provider long enough to release it before a mode switch."""
              text = exact(
                  text,
                  '''    private var camera: Camera? = null
              private var videoCapture: VideoCapture<Recorder>? = null''',
                  '''    private var liveCameraProvider: ProcessCameraProvider? = null
              private var camera: Camera? = null
              private var videoCapture: VideoCapture<Recorder>? = null''',
                  'Live provider handle',
              )
              anchor = '    private fun loadLiveIdentity() {'
              helper = '''    /** Release Live while idle before opening another camera mode. */
              private fun releaseLiveCameraForModeSwitch() {
                  if (recording != null) return
                  try {
                      liveCameraProvider?.unbindAll()
                  } catch (_: Exception) {
                  }
                  try {
                      overlayEffect?.close()
                  } catch (_: Exception) {
                  }
                  liveCameraProvider = null
                  overlayEffect = null
                  camera = null
                  videoCapture = null
              }

          '''
              text = exact(text, anchor, helper + anchor, 'Live release hook')
              text = exact(
                  text,
                  '                val provider =\n                    future.get()\n\n                provider.unbindAll()',
                  '                val provider =\n                    future.get()\n\n'
                  '                liveCameraProvider = provider\n                provider.unbindAll()',
                  'Live provider assignment',
              )
              text = exact(
                  text,
                  '                canNavigate = { recording == null }\n',
                  '                canNavigate = { recording == null },\n'
                  '                releaseCamera = ::releaseLiveCameraForModeSwitch\n',
                  'Live navigator callback',
              )
              return text


          def finish():
              before = inventory()
              camera_path = PACKAGE / CAMERA
              console_path = PACKAGE / CONSOLE
              live_path = PACKAGE / LIVE
              navigator_path = PACKAGE / NAVIGATOR
              camera_before, console_before = read(camera_path), read(console_path)
              live_before, navigator_before = read(live_path), read(navigator_path)
              verify_scrims(camera_before)
              console_patch_hash = restore_console()
              camera_path.write_text(repair_camera_handoff(repair_camera(camera_before)))
              live_path.write_text(repair_live_handoff(live_before))
              navigator_path.write_text(repair_navigator(navigator_before))
              after = inventory()
              changed = sorted(k for k in before.keys() | after.keys() if before.get(k) != after.get(k))
              expected = sorted(f'app/src/main/java/com/sentongoharuna/pulse/{n}' for n in (CAMERA, CONSOLE, LIVE, NAVIGATOR))
              require(changed == expected, f'Unexpected source changes: {changed}')
              for name, old in ((CAMERA, camera_before), (CONSOLE, console_before),
                                (LIVE, live_before), (NAVIGATOR, navigator_before)):
                  new = read(PACKAGE / name)
                  relative = f'app/src/main/java/com/sentongoharuna/pulse/{name}'
                  with (AUDIT / 'source-repairs.diff').open('a') as output:
                      output.writelines(difflib.unified_diff(old.splitlines(True), new.splitlines(True), f'a/{relative}', f'b/{relative}'))
              verify_home()
              exported = read(PACKAGE / 'DevelopUgandaFivemods9DualOutputExporter.kt')
              payload_exported = read(PAYLOAD / 'app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt')
              require(exported == payload_exported, 'F9 dual-output exporter changed')
              hud = read(PACKAGE / 'DevelopUgandaInterviewHudView.kt')
              require(hud == read(PAYLOAD / 'app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewHudView.kt'), 'F9 HUD changed')
              require('setSelectAllOnFocus(true)' in read(PACKAGE / 'DevelopUgandaStatusPolicy.kt'), 'Status Policy fix lost')
              require('version "8.11.1"' in read(SOURCE / 'build.gradle.kts'), 'AGP repair lost')
              require('version "2.2.0"' in read(SOURCE / 'build.gradle.kts'), 'Kotlin repair lost')
              leftovers = list(SOURCE.rglob('*.rej')) + list(SOURCE.rglob('*.orig'))
              require(not leftovers, f'Rejected/backup patch artifacts found: {leftovers}')
              report = {
                  'scope': 'Existing F9 Status Policy plus focused opacity, Interview negotiation, real F8 console dependency, and camera handoff repairs',
                  'full_f8_rebase': False,
                  'restored_real_f8_console_patch_sha256': console_patch_hash,
                  'changed_after_f9': changed,
                  'all_other_f9_files_byte_preserved': True,
                  'source_sha256': after,
              }
              (AUDIT / 'verification.json').write_text(json.dumps(report, indent=2) + '\n')
              print('PASS: full-home dependencies, launcher and Newsroom route present; F9 exporter/HUD/Status/build fixes preserved')


          def verify_home():
              ns = '{http://schemas.android.com/apk/res/android}'
              manifest = ET.fromstring(read(SOURCE / 'app/src/main/AndroidManifest.xml'))
              registered = {a.get(ns + 'name') for a in manifest.findall('application/activity')}
              launchers = [a.get(ns + 'name') for a in manifest.findall('application/activity')
                           if any(c.get(ns + 'name') == 'android.intent.category.LAUNCHER' for c in a.findall('intent-filter/category'))]
              require(launchers == ['.DevelopUgandaGeneralHubActivity'], f'Wrong launcher: {launchers}')
              require('.DevelopUgandaNewsroomActivity' in registered, 'Newsroom registration missing')
              hub = read(PACKAGE / 'DevelopUgandaGeneralHubActivity.kt')
              for anchor in ('setContentView(buildHome())', 'page.addView(buildV28012ProWorkflowConsole())',
                             '1 • PREPARE • PROJECT / HEALTH / AUDIO / CAMERA',
                             '2 • SHOOT • FRAME / LIGHT / FOCUS / RECORD',
                             'DevelopUgandaNewsroomActivity::class.java'):
                  require(hub.count(anchor) == 1, f'Home workflow anchor absent or ambiguous: {anchor}')
              require(hub.count('routeCard(') == 36, 'Home route-card inventory changed')
              targets = set(re.findall(r'(DevelopUganda\w+Activity)::class\.java', hub))
              for name in targets:
