name: 00 - DEVELOP UGANDA - FIVEMODS 10 - BROADCAST + CAPTIONS - VERIFIED FIX

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/00-build-fivemods-10-broadcast-captions-verified-fix.yml"
      - "develop_uganda_five_mode_source.zip"
      - ".github/workflows/build-fivemods-8.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          # Do not use the action's obsolete default `tools` package.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Rebuild FIVEMODS 8 snapshot, apply FIVEMODS 9 and repair Status Policy
