          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess

          def fail(message: str) -> None:
              raise SystemExit(f"{os.environ['DU_OVERLAY_STAGE']}: {message}")

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source = Path("source")
          work = Path(os.environ["DU_OVERLAY_DIR"])
          manifest = json.loads(base64.b64decode(os.environ["DU_OVERLAY_MANIFEST_B64"]))
          archive = work / "changes.patch.gz"
          patch = work / "changes.patch"
          if sha(archive) != manifest["payload_sha256"]:
              fail("embedded payload checksum mismatch")
          if sha(patch) != manifest["patch_sha256"]:
              fail("decoded patch checksum mismatch")

          patch_targets = []
          for line in patch.read_text(encoding="utf-8").splitlines():
              if line.startswith("+++ "):
                  value = line[4:].split("	", 1)[0]
                  if not value.startswith("b/"):
                      fail(f"unsafe result patch path: {value}")
                  patch_targets.append(value[2:])
          expected_targets = [item["path"] for item in manifest["files"]]
          if patch_targets != expected_targets:
              fail("patch target inventory differs from the signed manifest")

          planned = []
          for item in manifest["files"]:
              relative = PurePosixPath(item["path"])
              if relative.is_absolute() or ".." in relative.parts:
                  fail(f"unsafe payload path: {relative}")
              target = source.joinpath(*relative.parts)
              expected = item["base_sha256"]
              if expected is None:
                  if target.exists():
                      fail(f"expected new file already exists: {relative}")
              elif not target.is_file():
                  fail(f"required base file missing: {relative}")
              elif sha(target) != expected:
                  fail(f"base file changed; refusing an ambiguous merge: {relative}")
              planned.append((relative, target, item["result_sha256"]))

          patch_bytes = patch.read_bytes()
          for dry_run in (True, False):
              command = ["patch", "--batch", "--fuzz=0", "-p1"]
              if dry_run:
                  command.insert(1, "--dry-run")
              result = subprocess.run(
                  command,
                  cwd=source,
                  input=patch_bytes,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              if result.returncode != 0:
                  fail(
                      ("dry-run" if dry_run else "apply") +
                      " failed:\n" + result.stdout.decode("utf-8", errors="replace")
                  )

          for relative, target, expected in planned:
              if not target.is_file():
                  fail(f"patched file missing: {relative}")
              if sha(target) != expected:
                  fail(f"installed file checksum mismatch: {relative}")

          report = {
              "stage": manifest["label"],
              "payload_sha256": manifest["payload_sha256"],
              "patch_sha256": manifest["patch_sha256"],
              "changed_files": [str(item[0]) for item in planned],
              "source_hashes_after": {str(item[0]): item[2] for item in planned},
          }
          (work / "audit" / "overlay.json").write_text(json.dumps(report, indent=2) + "\n")
          print(f"PASS: {manifest['label']} installed with {len(planned)} exact file overlays")
          PYTHON
