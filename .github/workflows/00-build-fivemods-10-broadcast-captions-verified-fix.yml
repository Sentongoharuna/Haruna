          need("fun all(): List<DevelopUgandaModeProfile> = navigatorOrder" in profiles, "ModeProfiles.all() missing")
          need("fun forExperience(experienceId: String)" in profiles, "five-mode experience resolver missing")
          need(re.search(r"navigatorOrder\s*=\s*listOf\(\s*main\s*,\s*live\s*,\s*tikTok\s*,\s*status\s*,\s*interview\s*\)", profiles),
