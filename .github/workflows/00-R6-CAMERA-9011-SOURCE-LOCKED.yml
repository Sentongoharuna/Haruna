name: R6 CAMERA 9011 - SOURCE-LOCKED APK
run-name: R6 CAMERA 9011 - ${{ github.run_id }}-${{ github.run_attempt }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore approved R6 only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml, subprocess, os
          p=Path(".github/workflows/00-R6-SECTION5-02-INTERVIEW-HIGH-FIDELITY-REPORT-BURN.yml")
          assert p.is_file(), "Exact approved R6 workflow missing; no fallback permitted"
          steps=yaml.safe_load(p.read_text())["jobs"]["build-apk"]["steps"]
          required=[
            "Restore exact accepted S5.01 forward baseline",
            "Lock immediate S5.01 inputs",
            "Apply S5.02 high fidelity report-only Interview upgrade",
            "S5.02 exact output hashes",
            "S5.02 high quality and Interview privacy acceptance gate",
            "S5.02 truth safety gate",
            "Prove S5.01 core and all other cameras unchanged"]
          for name in required:
            matches=[s for s in steps if s.get("name")==name]
            assert len(matches)==1 and matches[0].get("run"), "Missing approved R6 stage: "+name
            print("APPROVED R6 STAGE:",name,flush=True)
            subprocess.run(["bash","-e","-o","pipefail"],input=matches[0]["run"],text=True,check=True,
                           env={**os.environ,"GITHUB_RUN_NUMBER":os.environ.get("GITHUB_RUN_NUMBER","0")})
          PY
      - name: Verify and apply source-only changes
        run: python3 tools/apply_r6_changes.py
      - name: Set independent install identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          tag=f"9011{os.environ['GITHUB_RUN_ID'][-6:]}a{os.environ['GITHUB_RUN_ATTEMPT']}"
          gradle=Path("app/build.gradle.kts")
          s=gradle.read_text()
          assert re.search(r'applicationId\s*=\s*"[^"]+"',s)
          s=re.sub(r'applicationId\s*=\s*"[^"]+"',f'applicationId = "com.sentongoharuna.r6cam.b{tag}"',s,count=1)
          s=re.sub(r'versionName\s*=\s*"[^"]+"',f'versionName = "R6-{tag}"',s,count=1)
          gradle.write_text(s)
          manifest=Path("app/src/main/AndroidManifest.xml")
          m=manifest.read_text()
          # Replace only the launcher label, not internal source/package symbols.
          if 'android:label=' in m:
            m=re.sub(r'android:label="[^"]+"',f'android:label="R6 Camera {tag}"',m,count=1)
            manifest.write_text(m)
          Path("r6_build_tag.txt").write_text(tag)
          PY
      - name: Compile APK
        run: gradle --no-daemon --console=plain --max-workers=2 :app:assembleDebug
      - name: Package APK with unique filename
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(cat r6_build_tag.txt)"
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/R6-CAMERA-${TAG}.apk"
          sha256sum output/*.apk > output/R6-APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R6-CAMERA-9011-${{ github.run_id }}-A${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
