name: 00 - SECTION1 R8 CLEAR RUN BASE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-SECTION1-R8-CLEAR-RUN-BASE.yml"]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Verify clear-run base
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          P=app/src/main/java/com/sentongoharuna/pulse
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'DevelopUgandaFivemods12CameraShell.attach' "$P/DevelopUgandaCameraActivity.kt"
          grep -q 'DevelopUgandaFivemods12CameraShell.attach' "$P/DevelopUgandaLiveActivity.kt"
          grep -q 'recordButton.setOnTouchListener' "$P/DevelopUgandaCameraActivity.kt"
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          OUT="SECTION1-R8-CLEAR-RUN-BASE-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R8-CLEAR-RUN-BASE-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
