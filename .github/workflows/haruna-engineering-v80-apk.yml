<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haruna Engineering V80</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0d12;--panel:#171a22;--line:#2b303c;--muted:#9298a5;--accent:#ff5965;--green:#55df8b;--amber:#ffbd59;--danger:#ff707b}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}.app{max-width:600px;margin:auto;padding:24px 18px 110px}.screen{display:none}.screen.active{display:block}
.brand{color:var(--accent);font-weight:700;letter-spacing:3px;font-size:14px}h1{font-size:30px;margin:8px 0}h2{font-size:23px;margin:4px 0}.subtitle{color:var(--muted);margin-bottom:22px;line-height:1.45}
.project-selector,.field input,.field select,.field textarea{width:100%;background:#10131a;color:#fff;border:1px solid var(--line);padding:14px;border-radius:13px}.project-selector{margin-bottom:18px}
.project-card,.form-card,.result,.list-card,.chart-card{background:linear-gradient(135deg,#202530,#12151c);border:1px solid var(--line);padding:18px;border-radius:20px;margin-bottom:14px}
.stats,.grid,.two,.analytics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat,.analytics-card{background:#161920;padding:16px;border-radius:17px}
.stat span,.analytics-card small,.field label{display:block;color:var(--muted);font-size:11px}.stat strong,.analytics-card strong{display:block;font-size:20px;margin-top:7px}
.status{color:var(--green);margin:8px 0}.section-title{font-size:20px;font-weight:700;margin:28px 0 14px}
.tool{background:#171a22;color:#fff;border:1px solid var(--line);border-radius:19px;min-height:110px;text-align:left;padding:18px}.tool b{display:block;color:var(--accent);font-size:25px;margin-bottom:15px}
.field{margin-bottom:14px}.field label{margin-bottom:7px}.field textarea{min-height:80px}.primary,.secondary{width:100%;padding:15px;border-radius:14px;margin-top:10px}.primary{background:var(--accent);border:0;color:#fff;font-weight:700}.secondary{background:#171a22;border:1px solid var(--line);color:#fff}.danger{background:#35171b;color:#ff9ba2}
.result-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.result-row:last-child{border-bottom:0}.result-row span{color:var(--muted)}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}.back{width:42px;height:42px;border:0;border-radius:12px;background:#171a22;color:#fff;font-size:20px}
.progress,.bar-track{height:12px;background:#10131a;border-radius:20px;overflow:hidden;margin-top:8px}.progress>div,.bar{height:100%;background:var(--accent)}.bar.good{background:var(--green)}.bar.warn{background:var(--amber)}.bar.bad{background:var(--danger)}
.bottom{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:auto;height:78px;background:#11141b;border-top:1px solid var(--line);display:flex;z-index:20}.nav{flex:1;text-align:center;color:#858b98;font-size:10px;padding-top:13px}.nav b{display:block;font-size:21px;margin-bottom:4px}.nav.selected{color:var(--accent)}
.search input{width:100%;padding:14px;border-radius:13px;background:#10131a;color:#fff;border:1px solid var(--line);margin-bottom:10px}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}
.pill{display:inline-block;padding:5px 8px;border-radius:8px;background:#242936;color:#cfd3dc;font-size:11px;margin:3px 4px 3px 0}
@media print{.bottom,.back{display:none!important}.app{max-width:none}.screen{display:none!important}#reports{display:block!important}body{background:#fff;color:#000}}

/* =========================
   V32 PREMIUM UI
   ========================= */
:root{--bg:#07090d;--panel:#11151d;--panel2:#171c26;--panel3:#1d2430;--line:#2a3140;--text:#f7f8fb;--muted:#959cac;--accent:#ff5b6d;--accent2:#ff7a86;--green:#55dc95;--amber:#ffca68;--red:#ff6677;--blue:#78a8ff;--shadow:0 18px 40px rgba(0,0,0,.34)}
body{background:radial-gradient(circle at 80% -10%,rgba(255,91,109,.10),transparent 26%),radial-gradient(circle at 0% 20%,rgba(120,168,255,.06),transparent 28%),var(--bg)}
.app{max-width:560px}
.brand{background:linear-gradient(90deg,var(--accent),#ff8a9a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;letter-spacing:4px}
h1{font-size:34px;letter-spacing:-1.2px;line-height:1.05}h2{letter-spacing:-.4px}.subtitle{line-height:1.5}
.project-card{position:relative;overflow:hidden;background:radial-gradient(circle at 95% 5%,rgba(255,91,109,.10),transparent 34%),linear-gradient(145deg,#1b2230,#11161f);border:1px solid #2c3444;box-shadow:var(--shadow)}
.project-card:before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:linear-gradient(90deg,var(--accent),transparent)}
.stat,.analytics-card,.list-card,.form-card,.tool{border:1px solid #252c3a;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.stat,.analytics-card{background:linear-gradient(145deg,#161b24,#11151c)}
.tool{min-height:126px;background:linear-gradient(145deg,#171c25,#11151d);border-radius:22px;transition:.18s ease}.tool:active{transform:scale(.985);background:#1d2430}.tool b{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,91,109,.10);border:1px solid rgba(255,91,109,.18);font-size:21px}
.section-title{font-size:21px;margin-top:34px;letter-spacing:-.3px}
.primary{border-radius:16px;background:linear-gradient(135deg,var(--accent),#ff7382);box-shadow:0 12px 24px rgba(255,91,109,.20);font-weight:800}.secondary{border-radius:13px}
input,select,textarea{background:#0e1218;border:1px solid #2a3140;border-radius:14px;padding:14px 14px}input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(255,91,109,.65);box-shadow:0 0 0 3px rgba(255,91,109,.10)}
.bottom-nav{background:rgba(14,17,23,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #262d39}.bottom-nav button{border-radius:14px;transition:.18s ease}.bottom-nav button.selected{background:rgba(255,91,109,.08)}
.progress{height:9px;border-radius:99px;background:#0c1016;overflow:hidden;border:1px solid #262d38}.progress>div{border-radius:99px;background:linear-gradient(90deg,var(--accent),#ff8b98)}
.pill{border-radius:999px;background:#202633;border:1px solid #313949;font-weight:700}.status{font-weight:800}
.v32-hero{margin:18px 0 26px;padding:18px;border-radius:22px;background:linear-gradient(135deg,rgba(255,91,109,.14),rgba(120,168,255,.07)),#11161e;border:1px solid #2c3443;box-shadow:var(--shadow)}
.v32-hero-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.v32-kicker{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}.v32-health{font-size:28px;font-weight:900}
.v32-bar{margin-top:14px;height:10px;border-radius:99px;background:#0a0e13;border:1px solid #252d39;overflow:hidden}.v32-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent))}
.v32-chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.v32-chip{padding:8px 10px;border-radius:999px;background:#171d27;border:1px solid #293241;font-size:12px;color:#c9ced8}
.v32-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.v32-mini{padding:12px;border-radius:16px;background:#11161d;border:1px solid #272f3c}.v32-mini small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.v32-mini strong{display:block;margin-top:6px;font-size:16px}
@media(max-width:390px){.v32-mini-grid{grid-template-columns:1fr 1fr}h1{font-size:31px}}


/* =========================
   V34 LIVE INTELLIGENCE
   ========================= */
.v34-smart{
  margin:18px 0 24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.v34-card{
  padding:16px;
  border-radius:20px;
  background:linear-gradient(145deg,#141923,#0f131a);
  border:1px solid #29313f;
  box-shadow:0 10px 28px rgba(0,0,0,.20);
}
.v34-card small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.3px;
  text-transform:uppercase;
}
.v34-card strong{
  display:block;
  margin-top:7px;
  font-size:19px;
  line-height:1.15;
}
.v34-alert{
  margin-top:12px;
  padding:12px 14px;
  border-radius:16px;
  background:#11161f;
  border:1px solid #2a3341;
}
.v34-alert.critical{border-color:rgba(255,102,119,.55)}
.v34-alert.high{border-color:rgba(255,202,104,.45)}
.v34-alert.good{border-color:rgba(85,220,149,.40)}
.v34-alert h4{margin:0 0 5px;font-size:14px}
.v34-alert p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.v34-ring{
  width:82px;height:82px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--accent) var(--v), #1b2230 0);
  position:relative;
}
.v34-ring:after{
  content:"";
  position:absolute;
  width:62px;height:62px;border-radius:50%;
  background:#12171f;
}
.v34-ring span{
  position:relative;z-index:1;
  font-weight:900;font-size:16px;
}
.v34-live-top{
  display:flex;align-items:center;justify-content:space-between;gap:14px
}
.v34-live-copy{flex:1}
@media(max-width:390px){
  .v34-smart{grid-template-columns:1fr}
}


.v35-sync{
  margin:0 0 18px;
  padding:12px 14px;
  border-radius:15px;
  background:rgba(85,220,149,.07);
  border:1px solid rgba(85,220,149,.22);
  color:#bfead3;
  font-size:12px;
  line-height:1.4;
}


/* =========================
   V36 CONFIDENCE HEALTH
   ========================= */
.v36-score-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
.v36-score{
  padding:14px;
  border-radius:18px;
  background:#11161e;
  border:1px solid #29313f;
}
.v36-score small{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:1.1px;
}
.v36-score strong{
  display:block;
  margin-top:7px;
  font-size:22px;
}
.v36-meter{
  height:8px;
  margin-top:9px;
  border-radius:999px;
  background:#0a0e13;
  border:1px solid #252d39;
  overflow:hidden;
}
.v36-meter div{
  height:100%;
  background:linear-gradient(90deg,var(--green),var(--accent));
}
.v36-confidence{
  margin-top:14px;
  padding:14px;
  border-radius:18px;
  background:rgba(120,168,255,.07);
  border:1px solid rgba(120,168,255,.24);
}
.v36-confidence strong{font-size:20px}
.v36-confidence p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
@media(max-width:390px){
  .v36-score-grid{grid-template-columns:1fr}
}


/* =========================
   V37 EXECUTIVE ACTION ENGINE
   ========================= */
.v37-priority{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px;
  margin-top:11px;
  border-radius:18px;
  background:#11161e;
  border:1px solid #2b3340;
}
.v37-priority .rank{
  min-width:36px;height:36px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;background:#1a202b;border:1px solid #303949;
}
.v37-priority.critical{border-color:rgba(255,102,119,.55)}
.v37-priority.high{border-color:rgba(255,202,104,.50)}
.v37-priority.medium{border-color:rgba(120,168,255,.38)}
.v37-priority.low{border-color:rgba(85,220,149,.35)}
.v37-priority h4{margin:0 0 5px;font-size:14px}
.v37-priority p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.v37-action{
  margin-top:10px;padding:12px;border-radius:15px;
  background:#0d1218;border:1px solid #252d39;
}
.v37-action b{display:block;margin-bottom:5px}
.v37-badge{
  display:inline-block;
  padding:5px 8px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  background:#202632;border:1px solid #313a48;
}


/* =========================
   V38 DAILY SITE COMMAND
   ========================= */
.v38-command{
  padding:16px;
  border-radius:22px;
  background:linear-gradient(145deg,#161b24,#0f141b);
  border:1px solid #2a3341;
  box-shadow:0 14px 34px rgba(0,0,0,.24);
}
.v38-command h3{margin:0 0 8px}
.v38-command p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.v38-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
.v38-summary .cell{
  padding:13px;
  border-radius:17px;
  background:#10151c;
  border:1px solid #27303c;
}
.v38-summary small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}
.v38-summary strong{display:block;margin-top:6px;font-size:18px}
.v38-badge{
  display:inline-block;
  padding:6px 9px;border-radius:999px;
  background:#1a202b;border:1px solid #303949;
  font-size:10px;font-weight:800;text-transform:uppercase;
}
@media(max-width:390px){.v38-summary{grid-template-columns:1fr}}


/* V39 TRACEABLE SITE OPERATIONS */
.v39-ledger{margin-top:12px;padding:14px;border-radius:18px;background:#10151d;border:1px solid #29313e}
.v39-ledger h4{margin:0 0 6px}
.v39-ledger p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.45}
.v39-source{padding:10px 12px;border-radius:14px;background:#0e1319;border:1px solid #242c38;margin-top:8px}
.v39-source small{color:var(--muted)}


/* =========================
   V40 PROCUREMENT & COST CONTROL
   ========================= */
.v40-card{
  margin-top:12px;
  padding:15px;
  border-radius:18px;
  background:#10151d;
  border:1px solid #29313e;
}
.v40-card h4{margin:0 0 6px}
.v40-card p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.45}
.v40-badge{
  display:inline-block;
  padding:5px 8px;border-radius:999px;
  font-size:10px;font-weight:800;text-transform:uppercase;
  background:#1c222d;border:1px solid #303947;
}
.v40-overdue{border-color:rgba(255,102,119,.55)}
.v40-paid{border-color:rgba(85,220,149,.35)}


/* =========================
   V42 BUILD COST INTELLIGENCE
   ========================= */
.v41-hero{
  margin:18px 0 24px;
  padding:20px;
  border-radius:24px;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,91,109,.16),transparent 35%),
    linear-gradient(145deg,#171d28,#10151d);
  border:1px solid #2b3442;
  box-shadow:0 18px 42px rgba(0,0,0,.28);
}
.v41-hero h2{font-size:27px;margin:0 0 7px;letter-spacing:-.6px}
.v41-hero p{margin:0;color:var(--muted);line-height:1.5}
.v41-cta{
  margin-top:16px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:17px;
  background:linear-gradient(135deg,var(--accent),#ff7886);
  color:white;
  font-weight:900;
  font-size:15px;
}
.v41-result{
  margin-top:14px;
  padding:18px;
  border-radius:22px;
  background:linear-gradient(145deg,#171d26,#10151b);
  border:1px solid #2c3543;
}
.v41-result .big{
  font-size:31px;
  font-weight:950;
  letter-spacing:-.8px;
  margin-top:6px;
}
.v41-result small{color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.v41-break{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.v41-break div{
  padding:12px;
  border-radius:16px;
  background:#0f141b;
  border:1px solid #28303c;
}
.v41-break small{display:block;font-size:10px;color:var(--muted)}
.v41-break strong{display:block;margin-top:5px;font-size:15px}
.v41-choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.v41-choice button{
  min-height:80px;
  border-radius:17px;
  border:1px solid #2a3340;
  background:#111720;
  color:var(--text);
  font-weight:800;
  text-align:left;
  padding:13px;
}
.v41-choice button.active{
  border-color:rgba(255,91,109,.7);
  background:rgba(255,91,109,.10);
}
.v41-note{
  margin-top:12px;
  padding:12px 14px;
  border-radius:15px;
  background:rgba(120,168,255,.06);
  border:1px solid rgba(120,168,255,.22);
  color:#b8c6df;
  font-size:12px;
  line-height:1.5;
}
.v41-range{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:9px;
}
.v41-range div{
  padding:11px;
  border-radius:14px;
  background:#0f141b;
  border:1px solid #28303c;
}
.v41-range small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}
.v41-range strong{display:block;margin-top:5px;font-size:14px}
@media(max-width:390px){
  .v41-choice,.v41-break{grid-template-columns:1fr}
  .v41-range{grid-template-columns:1fr}
}


/* V42 PREMIUM INTERFACE */
:root{--bg:#070a12;--panel:#0d1320;--panel2:#11192a;--line:#243149;--text:#f7fbff;--muted:#8f9bb2;--accent:#2ee6c5;--accent2:#9a5cff;--accent3:#ff4fa3;--green:#42e7a4;--amber:#ffd166;--red:#ff6478;--blue:#4fd2ff}
body{background:radial-gradient(circle at 15% 8%,rgba(46,230,197,.09),transparent 26%),radial-gradient(circle at 92% 16%,rgba(154,92,255,.10),transparent 28%),radial-gradient(circle at 50% 90%,rgba(255,79,163,.06),transparent 24%),var(--bg)}
.app{max-width:600px}
.brand{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;font-weight:950}
h1{font-size:38px;letter-spacing:-1.6px;line-height:1.02}
.subtitle{font-size:15px;line-height:1.55;color:#98a4b8}
.project-card,.analytics-card,.stat,.list-card,.form-card{background:linear-gradient(145deg,rgba(18,27,44,.96),rgba(11,16,27,.98));border:1px solid rgba(81,105,146,.28);box-shadow:0 20px 46px rgba(0,0,0,.28)}
.tool{position:relative;overflow:hidden;min-height:118px;border-radius:20px;background:linear-gradient(145deg,#11192a,#0b101a);border:1px solid #243149;box-shadow:0 14px 28px rgba(0,0,0,.18)}
.tool b{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,rgba(46,230,197,.13),rgba(154,92,255,.11));border:1px solid rgba(46,230,197,.2);color:#dffcf7}
.primary{background:linear-gradient(90deg,var(--accent),#49d6ff,var(--accent2));color:#061019;box-shadow:0 14px 26px rgba(46,230,197,.16);font-weight:950}
.bottom-nav{background:rgba(7,10,18,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(95,117,155,.22)}
.bottom-nav button.selected{color:var(--accent);background:rgba(46,230,197,.07)}
.v42-topbar{margin:12px 0 20px;display:flex;gap:10px;align-items:center}
.v42-search{flex:1;padding:13px 15px;border-radius:16px;background:#0c111b;border:1px solid #243149;color:#aeb9ca;font-size:13px}
.v42-icon-btn{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:#0d1420;border:1px solid #243149;color:var(--accent);font-weight:900}
.v42-main{margin:18px 0 22px;padding:20px;border-radius:25px;background:radial-gradient(circle at 92% 12%,rgba(154,92,255,.20),transparent 32%),radial-gradient(circle at 12% 85%,rgba(46,230,197,.13),transparent 35%),linear-gradient(145deg,#121b2d,#0b111d);border:1px solid rgba(92,119,160,.35);box-shadow:0 24px 50px rgba(0,0,0,.34)}
.v42-kicker{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:900}
.v42-main h2{font-size:27px;margin:7px 0 8px}.v42-main p{margin:0;color:#9ba7ba;line-height:1.5}
.v42-cta-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.v42-cta-primary,.v42-cta-secondary{padding:12px 15px;border-radius:14px;font-weight:900}
.v42-cta-primary{border:none;background:linear-gradient(90deg,var(--accent),var(--blue));color:#061019}
.v42-cta-secondary{background:#111a28;color:#dbe6f4;border:1px solid #2a3a53}
.v42-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.v42-metric{padding:12px;border-radius:16px;background:rgba(7,12,21,.70);border:1px solid rgba(87,110,151,.24)}
.v42-metric small{display:block;color:#8694aa;font-size:9px;text-transform:uppercase;letter-spacing:1px}.v42-metric strong{display:block;margin-top:5px;font-size:15px}
@media(max-width:420px){.v42-metrics{grid-template-columns:1fr 1fr}h1{font-size:34px}}


/* =========================
   V43 INTELLIGENT COMMAND UI
   ========================= */
.v43-shell{
  margin:18px 0 24px;
  border-radius:26px;
  padding:20px;
  background:
    radial-gradient(circle at 100% 0%,rgba(46,230,197,.16),transparent 28%),
    radial-gradient(circle at 0% 100%,rgba(154,92,255,.13),transparent 30%),
    linear-gradient(145deg,#101827,#09101a);
  border:1px solid rgba(91,120,166,.34);
  box-shadow:0 24px 58px rgba(0,0,0,.34);
}
.v43-ai-head{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}
.v43-ai-label{
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:10px;
  font-weight:950;
}
.v43-ai-title{
  font-size:25px;
  font-weight:950;
  margin-top:6px;
  letter-spacing:-.7px;
}
.v43-score{
  min-width:74px;height:74px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--accent) var(--score), #172235 0);
  position:relative;
  box-shadow:0 0 24px rgba(46,230,197,.12);
}
.v43-score:after{
  content:"";position:absolute;width:56px;height:56px;border-radius:50%;background:#0b111c;
}
.v43-score strong{position:relative;z-index:1;font-size:16px}
.v43-insight{
  margin-top:16px;
  padding:14px 15px;
  border-radius:17px;
  background:rgba(10,15,24,.78);
  border:1px solid rgba(76,101,140,.28);
  color:#c8d4e6;
  font-size:13px;
  line-height:1.5;
}
.v43-chip-row{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:12px
}
.v43-chip{
  padding:7px 10px;border-radius:999px;
  background:#121b2a;border:1px solid #2a3951;
  color:#aebcd0;font-size:11px;font-weight:800;
}
.v43-command-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px
}
.v43-command{
  padding:14px;border-radius:18px;
  background:linear-gradient(145deg,#111a29,#0b111b);
  border:1px solid #28374e;
  min-height:96px;
}
.v43-command small{
  display:block;color:#8391a8;font-size:9px;text-transform:uppercase;letter-spacing:1.2px
}
.v43-command strong{display:block;margin-top:7px;font-size:17px}
.v43-command span{display:block;margin-top:5px;color:#9da9ba;font-size:11px}
.v43-pulse{
  display:inline-flex;align-items:center;gap:7px;margin-top:10px;
  color:#9deedc;font-size:11px;font-weight:800
}
.v43-pulse:before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent);
}
.v43-actions{
  margin-top:16px;
}
.v43-action{
  display:flex;gap:11px;align-items:flex-start;
  padding:12px 0;border-top:1px solid rgba(84,108,147,.18)
}
.v43-action:first-child{border-top:none}
.v43-action-rank{
  width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(46,230,197,.12),rgba(154,92,255,.12));
  border:1px solid #2b3a52;font-weight:900;color:#dffbf5
}
.v43-action h4{margin:0 0 4px;font-size:13px}
.v43-action p{margin:0;color:#8f9cb0;font-size:11px;line-height:1.45}
.v43-quickbar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 8px
}
.v43-quick{
  padding:10px 6px;border-radius:15px;text-align:center;
  background:#0f1623;border:1px solid #26344a;
  color:#c5d0df;font-size:10px;font-weight:800
}
.v43-quick b{
  display:block;font-size:18px;margin-bottom:5px;
  background:linear-gradient(90deg,var(--accent),var(--blue),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
@media(max-width:420px){
  .v43-command-grid{grid-template-columns:1fr}
  .v43-quickbar{grid-template-columns:1fr 1fr}
}


