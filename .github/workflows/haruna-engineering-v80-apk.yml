/* =========================
   V47 — UNIFIED BACKGROUND & SURFACE SYSTEM
   ========================= */
:root{
  --v47-bg0:#070b11;
  --v47-bg1:#0a111a;
  --v47-bg2:#0d1621;
  --v47-surface:#111b27;
  --v47-surface2:#152131;
  --v47-surface3:#192738;
  --v47-border:#29394c;
  --v47-orange:#ff8b24;
  --v47-orange2:#ffad55;
  --v47-blue:#52b9d8;
}

/* one continuous technical background across every screen */
html{
  background:var(--v47-bg0)!important;
}
body{
  background:
    radial-gradient(circle at 82% 6%,rgba(255,139,36,.10),transparent 24%),
    radial-gradient(circle at 8% 38%,rgba(82,185,216,.055),transparent 27%),
    linear-gradient(rgba(126,151,181,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(126,151,181,.025) 1px,transparent 1px),
    linear-gradient(180deg,var(--v47-bg1) 0%,var(--v47-bg0) 55%,#080d14 100%)!important;
  background-size:auto,auto,28px 28px,28px 28px,auto!important;
  background-attachment:fixed!important;
  color:#f5f7fa!important;
}

/* screens no longer appear as separate black sheets */
.screen{
  background:transparent!important;
}
.app{
  background:transparent!important;
}

/* headers / topbars become translucent engineering glass */
.topbar{
  background:rgba(10,17,26,.78)!important;
  border:1px solid rgba(55,73,96,.34)!important;
  border-radius:18px!important;
  padding:10px 12px!important;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.back{
  background:var(--v47-surface2)!important;
  border:1px solid var(--v47-border)!important;
  color:var(--v47-orange)!important;
}

/* coherent hierarchy instead of many unrelated dark shades */
.project-card,.analytics-card,.form-card,.v43-shell,.v42-main,.v41-result,
.v39-ledger,.v40-card,.v32-hero,.v33-card,.v34-card,.v35-card,.v36-card,
.v37-card,.v38-card{
  background:
    linear-gradient(145deg,rgba(21,33,49,.97),rgba(13,22,33,.98))!important;
  border:1px solid rgba(53,72,96,.62)!important;
  box-shadow:0 18px 38px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.018)!important;
}

.stat,.list-card,.v43-command,.v43-insight,.v42-metric,.v39-source{
  background:
    linear-gradient(145deg,rgba(18,29,43,.96),rgba(13,21,31,.98))!important;
  border:1px solid rgba(47,65,87,.58)!important;
  box-shadow:none!important;
}

/* tools slightly lighter than page, easy to scan */
.tool{
  background:
    linear-gradient(150deg,rgba(23,36,52,.98),rgba(14,23,34,.98))!important;
  border:1px solid rgba(52,71,94,.68)!important;
}
.tool:active{
  background:linear-gradient(150deg,#1a293a,#111c29)!important;
}

/* inputs should visually belong to same system */
input,select,textarea{
  background:#0b141e!important;
  border:1px solid #304156!important;
  color:#f2f5f8!important;
}
input::placeholder,textarea::placeholder{
  color:#64758b!important;
}
.field label{
  color:#a8b4c3!important;
}

/* chips and small elements */
.v32-chip,.v43-chip,.pill,.v37-badge,.v38-badge,.v40-badge,.v42-tab{
  background:#14202e!important;
  border:1px solid #304158!important;
}

/* orange remains the main engineering accent */
.section-title:before{
  background:linear-gradient(180deg,var(--v47-orange),var(--v47-orange2))!important;
}
.primary,.v42-cta-primary,.v42-tab.active{
  background:linear-gradient(135deg,var(--v47-orange2),var(--v47-orange))!important;
  color:#121820!important;
}
.tool b,.v43-action-rank,.v43-quick b,.v42-icon-btn{
  background:#172331!important;
  border:1px solid rgba(255,139,36,.42)!important;
  color:var(--v47-orange)!important;
  -webkit-text-fill-color:var(--v47-orange)!important;
}

/* dashboards get a subtle warm highlight, not neon */
.v43-shell,.v42-main{
  background:
    radial-gradient(circle at 95% 5%,rgba(255,139,36,.095),transparent 31%),
    linear-gradient(145deg,rgba(22,34,49,.98),rgba(12,20,30,.99))!important;
}

/* bottom navigation visually integrated with background */
.bottom-nav{
  background:rgba(9,15,23,.92)!important;
  border-top:1px solid rgba(54,72,95,.60)!important;
  box-shadow:0 -12px 30px rgba(0,0,0,.18)!important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

/* tables / result blocks */
table{
  background:rgba(13,22,32,.72)!important;
}
th{
  background:#162231!important;
  color:#c5cfdb!important;
}
td{
  border-color:#26374a!important;
}

/* scrollbars on browsers that support them */
*{
  scrollbar-color:#34475e #0b121b;
}

/* soften section transitions */
.section-title{
  border-bottom:1px solid rgba(49,67,89,.20);
  padding-bottom:9px;
}


