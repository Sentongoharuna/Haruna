}
.v60-row-main{flex:1}
.v60-row-main strong{display:block;font-size:13px}
.v60-row-main span{color:#8f9daf;font-size:10px}
.v60-row-val{
  text-align:right;
  font-size:12px;
  font-weight:800;
}

.v60-bottom-action{
  position:fixed;
  right:22px;
  bottom:92px;
  width:58px;height:58px;
  border-radius:50%;
  border:0;
  background:var(--v60-accent);
  color:#161b27;
  font-size:28px;
  z-index:20;
  box-shadow:0 12px 28px rgba(0,0,0,.25);
}

/* modernise old tool boards so legacy sections match V60 */
.tool{
  background:linear-gradient(145deg,#1a2742,#142038)!important;
  border-color:var(--v60-line)!important;
}
.tool b{
  background:#101a2d!important;
  color:var(--v60-accent)!important;
  -webkit-text-fill-color:var(--v60-accent)!important;
  border-color:rgba(215,217,111,.18)!important;
}
.project-card,.v43-shell,.v42-main,.v41-result,.form-card,.list-card,
.analytics-card,.stat,.v39-ledger,.v39-source,.v40-card,.v43-command,.v43-insight{
  background:linear-gradient(145deg,#1b2843,#142038)!important;
  border-color:var(--v60-line)!important;
}
.primary,.v42-cta-primary,.v42-icon-btn{
  background:var(--v60-accent)!important;
  color:#161b27!important;
}
.progress>div,.v36-meter div{
  background:linear-gradient(90deg,var(--v60-teal),var(--v60-accent))!important;
}
.bottom-nav button.selected{color:var(--v60-accent)!important}

@media(max-width:420px){
  .v60-budgetline{grid-template-columns:1fr 1fr}
  .v60-tools{grid-template-columns:repeat(4,1fr)}
}


/* =========================================================
   V61 — APP-STYLE ICON SYSTEM
   ========================================================= */
:root{
  --icon-yellow:#f0db62;
  --icon-teal:#63c7c4;
  --icon-blue:#79a9ff;
  --icon-purple:#8e7dff;
  --icon-green:#66d5a6;
  --icon-red:#f07883;
}

/* app-icon container */
.tool b,
.v60-tool b,
.v43-quick b,
.v43-action-rank,
.v42-icon-btn{
  position:relative!important;
  overflow:hidden!important;
  border-radius:14px!important;
  border:1px solid rgba(255,255,255,.08)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 8px 16px rgba(0,0,0,.18)!important;
}

/* varied app-icon colors */
.tool:nth-of-type(6n+1) b{background:linear-gradient(145deg,#2b415d,#17253a)!important;color:var(--icon-yellow)!important;-webkit-text-fill-color:var(--icon-yellow)!important}
.tool:nth-of-type(6n+2) b{background:linear-gradient(145deg,#173f43,#11292e)!important;color:var(--icon-teal)!important;-webkit-text-fill-color:var(--icon-teal)!important}
.tool:nth-of-type(6n+3) b{background:linear-gradient(145deg,#283a60,#172340)!important;color:var(--icon-blue)!important;-webkit-text-fill-color:var(--icon-blue)!important}
.tool:nth-of-type(6n+4) b{background:linear-gradient(145deg,#382f5a,#211c3e)!important;color:var(--icon-purple)!important;-webkit-text-fill-color:var(--icon-purple)!important}
.tool:nth-of-type(6n+5) b{background:linear-gradient(145deg,#1d4034,#132a24)!important;color:var(--icon-green)!important;-webkit-text-fill-color:var(--icon-green)!important}
.tool:nth-of-type(6n) b{background:linear-gradient(145deg,#4a2b34,#2d1920)!important;color:var(--icon-red)!important;-webkit-text-fill-color:var(--icon-red)!important}

/* executive quick-action icons */
.v60-tool:nth-child(1) b{background:linear-gradient(145deg,#31415d,#19263b)!important;color:var(--icon-yellow)!important}
.v60-tool:nth-child(2) b{background:linear-gradient(145deg,#1a4041,#112b2d)!important;color:var(--icon-teal)!important}
.v60-tool:nth-child(3) b{background:linear-gradient(145deg,#29385b,#18213a)!important;color:var(--icon-blue)!important}
.v60-tool:nth-child(4) b{background:linear-gradient(145deg,#3a315b,#221d3e)!important;color:var(--icon-purple)!important}

/* make icons feel less like text boxes */
.tool b,.v60-tool b{
  width:44px!important;
  height:44px!important;
  font-size:17px!important;
  font-weight:900!important;
}
.tool b:after,.v60-tool b:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 45%);
  pointer-events:none;
}

/* bigger, cleaner plus/action icon */
.v42-icon-btn{
  background:linear-gradient(145deg,#2b405e,#18253a)!important;
  color:var(--icon-yellow)!important;
  -webkit-text-fill-color:var(--icon-yellow)!important;
}

/* quick rail */
.v43-quick b{
  background:linear-gradient(145deg,#243551,#162338)!important;
  color:var(--icon-teal)!important;
  -webkit-text-fill-color:var(--icon-teal)!important;
}

/* preserve modern tool boards */
.tool,.v60-tool{
  align-items:flex-start!important;
  text-align:left!important;
}


/* =========================================================
   V62 — UNIFIED DASHBOARD PALETTE
   Dashboard reference: navy + cyan/teal + white + muted grey.
   No orange/yellow/purple/green/red UI accents.
   ========================================================= */
:root{
  --accent:#42e3d1!important;
  --accent2:#5bc8d7!important;
  --bg:#081a2a!important;
  --panel:#0d1d31!important;
  --panel2:#102238!important;
  --line:rgba(74,211,211,.22)!important;
  --text:#f5f7fb!important;
  --muted:#9cabbc!important;

  --v60-bg:#081a2a!important;
  --v60-bg2:#0b2033!important;
  --v60-card:#102238!important;
  --v60-card2:#0d1d31!important;
  --v60-line:rgba(74,211,211,.20)!important;
  --v60-text:#f5f7fb!important;
  --v60-muted:#9cabbc!important;
  --v60-accent:#42e3d1!important;
  --v60-teal:#42e3d1!important;
  --v60-blue:#5bc8d7!important;

  --icon-yellow:#42e3d1!important;
  --icon-teal:#42e3d1!important;
  --icon-blue:#5bc8d7!important;
  --icon-purple:#5bc8d7!important;
  --icon-green:#42e3d1!important;
  --icon-red:#5bc8d7!important;
}

html,body{
  background:
    radial-gradient(circle at 82% 2%,rgba(66,227,209,.07),transparent 26%),
    linear-gradient(180deg,#10293a 0%,#071a2b 55%,#061827 100%)!important;
  color:#f5f7fb!important;
}

/* All major surfaces use the same navy family */
.tool,.project-card,.v43-shell,.v42-main,.v41-result,.form-card,.list-card,
.analytics-card,.stat,.v39-ledger,.v39-source,.v40-card,.v43-command,.v43-insight,
.v60-card,.v60-row,.v60-balance,.v58-overview,.v58-card,.v57-budget-card,
.v56-card,.v55-card,.v54-card,.v53-card,.v52-card,.v51-card,.v50-card,
.v49-card,.v48-card,.v47-card,.v46-card,.v45-card,.v44-card{
  background:linear-gradient(145deg,#102238,#0b1c2f)!important;
  border-color:rgba(74,211,211,.16)!important;
  box-shadow:0 14px 30px rgba(0,0,0,.14)!important;
}

/* Unified teal outlines */
input,select,textarea,.search-box,.project-select,
.v60-status,.v60-row,.v60-card,.tool,.chip,.pill{
  border-color:rgba(74,211,211,.24)!important;
}

/* Every old multicolour app icon becomes navy + teal/cyan */
.tool b,
.tool:nth-of-type(6n+1) b,.tool:nth-of-type(6n+2) b,.tool:nth-of-type(6n+3) b,
.tool:nth-of-type(6n+4) b,.tool:nth-of-type(6n+5) b,.tool:nth-of-type(6n) b,
.v60-tool b,.v60-tool:nth-child(1) b,.v60-tool:nth-child(2) b,
.v60-tool:nth-child(3) b,.v60-tool:nth-child(4) b,
.v43-quick b,.v42-icon-btn,.v60-icon{
  background:linear-gradient(145deg,#173149,#0d2134)!important;
  color:#42e3d1!important;
  -webkit-text-fill-color:#42e3d1!important;
  border-color:rgba(74,211,211,.22)!important;
}

/* Buttons and selected states */
.primary,.v42-cta-primary,.v60-bottom-action{
  background:#42e3d1!important;
  color:#071a2a!important;
  border-color:#42e3d1!important;
}
.bottom-nav button.selected,
.v60-section button,
a{
  color:#42e3d1!important;
}

/* Charts, progress and health rings */
.progress>div,.v36-meter div{
  background:linear-gradient(90deg,#42e3d1,#5bc8d7)!important;
}
.health-ring,.score-ring,.v35-ring,.v36-ring{
  --ring:#42e3d1!important;
}

/* remove stray warm accent text/backgrounds */
[style*="#f0db62"],[style*="#d7d96f"],[style*="#fea24f"],
[style*="#ff9f43"],[style*="orange"],[style*="yellow"]{
  color:#42e3d1!important;
  border-color:rgba(74,211,211,.24)!important;
}

/* Bottom navigation stays restrained */
.bottom-nav{
  background:#0d1017!important;
  border-top:1px solid rgba(74,211,211,.08)!important;
}
.bottom-nav button{color:#8f9aaa!important}
.bottom-nav button.selected{color:#42e3d1!important}


/* =========================================================
   V63 — APP INTERFACE MATCHING THE MODERN DASHBOARD MOCKUP
   ========================================================= */
:root{
  --v63-bg:#061a2b;
  --v63-bg2:#0a2237;
  --v63-card:#0c2a42;
  --v63-card2:#0a2338;
  --v63-line:rgba(57,208,210,.34);
  --v63-line-soft:rgba(57,208,210,.16);
  --v63-text:#f5f7fb;
  --v63-muted:#9cabbc;
  --v63-teal:#27d7d0;
  --v63-teal2:#19b7c2;
}

body{
  background:
    radial-gradient(circle at 85% 0%,rgba(39,215,208,.06),transparent 24%),
    linear-gradient(180deg,#071b2c,#061827 100%)!important;
}
.app{max-width:700px!important;padding:14px 18px 120px!important}

/* Header */
.v63-header{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:center;
  padding:12px 14px;
  border-radius:18px;
  background:linear-gradient(145deg,#0a2840,#071f34);
  border:1px solid var(--v63-line);
}
.v63-menu{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--v63-line-soft);
  background:#0b2a43;color:#dce7ef;font-size:20px;
}
.v63-brand strong{display:block;font-size:17px;letter-spacing:.3px}
.v63-brand span{color:var(--v63-teal);font-size:11px;font-weight:800}
.v63-date{color:#cbd5df;font-size:12px;text-align:right}

/* Main project row */
.v63-project-row{
  margin-top:12px;
  padding:12px 14px;
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  align-items:center;
  border-radius:16px;
  background:#082139;
  border:1px solid var(--v63-line);
}
.v63-project-name{font-weight:800;font-size:16px}
.v63-outline-btn,.v63-solid-btn{
  padding:11px 14px;border-radius:12px;font-weight:800;font-size:12px
}
.v63-outline-btn{background:transparent;color:#65e2dd;border:1px solid var(--v63-line)}
.v63-solid-btn{background:var(--v63-teal);color:#062032;border:0}

/* Hero budget */
.v63-hero-grid{
  display:grid;
  grid-template-columns:2.1fr 1fr;
  gap:12px;
  margin-top:12px;
}
.v63-budget,.v63-health{
  border-radius:18px;
  background:linear-gradient(145deg,#0b2b45,#082138);
  border:1px solid var(--v63-line);
  padding:20px;
}
.v63-kicker{color:#48d9d4;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:900}
.v63-budget h2{font-size:34px!important;margin:8px 0 22px}
.v63-budget-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.v63-budget-row span{color:#9eacbc;font-size:10px;text-transform:uppercase}
.v63-budget-row strong{display:block;margin-top:4px;font-size:18px}
.v63-progress{
  height:8px;border-radius:999px;background:#19384a;margin-top:18px;overflow:hidden
}
.v63-progress div{height:100%;background:linear-gradient(90deg,var(--v63-teal),#4bd5c6);border-radius:999px}
.v63-safe{margin-top:12px;color:#aab8c7;font-size:11px}
.v63-safe b{color:#63e0dc}

.v63-health h4{margin:0 0 12px;font-size:15px}
.v63-health-score{font-size:28px;font-weight:900;color:#54dfda}
.v63-health p{color:#9eacbc;font-size:11px}
.v63-spark{
  margin-top:16px;height:72px;border-bottom:1px solid var(--v63-line-soft);
  background:linear-gradient(180deg,rgba(39,215,208,.12),transparent);
  clip-path:polygon(0 78%,12% 70%,25% 40%,38% 52%,50% 30%,62% 37%,76% 20%,88% 27%,100% 5%,100% 100%,0 100%);
}

/* KPI strip */
.v63-kpis{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-radius:18px;
  background:#082139;
  border:1px solid var(--v63-line);
  overflow:hidden;
}
.v63-kpi{padding:16px 14px;border-right:1px solid var(--v63-line-soft)}
.v63-kpi:last-child{border-right:0}
.v63-kpi small{color:#9aa8b8;font-size:9px;text-transform:uppercase}
.v63-kpi strong{display:block;margin-top:7px;font-size:14px}

/* quick modules */
.v63-section{margin-top:14px;padding:16px;border-radius:18px;background:#082139;border:1px solid var(--v63-line)}
.v63-section-title{color:#4bd7d3;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:900;margin-bottom:12px}
.v63-modules{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.v63-module{
  min-height:132px;padding:14px 10px;border-radius:16px;
  background:linear-gradient(145deg,#0d2b44,#082038);
  border:1px solid var(--v63-line);
  text-align:center;
}
.v63-module .ico{
  width:46px;height:46px;margin:0 auto 10px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(39,215,208,.08);
  color:var(--v63-teal);font-size:21px;font-weight:900
}
.v63-module strong{font-size:12px;display:block}
.v63-module span{color:#97a7b8;font-size:9px;line-height:1.35;display:block;margin-top:6px}

/* lower panels */
.v63-lower{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;margin-top:12px}
.v63-panel{padding:16px;border-radius:18px;background:#082139;border:1px solid var(--v63-line)}
.v63-panel h4{margin:0 0 12px;color:#4bd7d3;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.v63-donut{
  width:130px;height:130px;border-radius:50%;
  background:conic-gradient(#27d7d0 0 35%,#159aa9 35% 60%,#3c8fa1 60% 80%,#67b9c4 80% 90%,#1c6a75 90% 100%);
  margin:8px auto;position:relative
}
.v63-donut:after{
  content:"";position:absolute;inset:28px;border-radius:50%;background:#0a2237
}
.v63-donut-label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:1;text-align:center;font-size:10px;font-weight:800
}
.v63-list-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--v63-line-soft);align-items:center}
.v63-list-row:last-child{border-bottom:0}
.v63-list-icon{
  width:34px;height:34px;border-radius:10px;background:rgba(39,215,208,.09);
  display:flex;align-items:center;justify-content:center;color:#4fe1dc;font-weight:900
}
.v63-list-main{flex:1}
.v63-list-main strong{display:block;font-size:11px}
.v63-list-main span{color:#92a1b2;font-size:9px}
.v63-list-val{font-size:10px;font-weight:800}

/* alerts/schedule */
.v63-bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.v63-alert,.v63-schedule{
  padding:16px;border-radius:18px;background:#082139;border:1px solid var(--v63-line)
}

/* bottom nav */
.bottom-nav{
  background:#071624!important;
  border-top:1px solid var(--v63-line)!important;
}
.bottom-nav button.selected{color:var(--v63-teal)!important}
.v60-bottom-action,.v57-add{display:none!important}

@media(max-width:560px){
  .v63-hero-grid{grid-template-columns:1fr}
  .v63-kpis{grid-template-columns:1fr 1fr}
  .v63-kpi{border-bottom:1px solid var(--v63-line-soft)}
  .v63-modules{grid-template-columns:1fr 1fr}
  .v63-lower{grid-template-columns:1fr}
  .v63-bottom-grid{grid-template-columns:1fr}
  .v63-project-row{grid-template-columns:1fr}
  .v63-outline-btn,.v63-solid-btn{width:100%}
}


/* V64 — MOBILE RELEASE UI */
.v64-public-card{
  margin-top:12px;padding:18px;border-radius:20px;
  background:radial-gradient(circle at 92% 10%,rgba(54,216,209,.12),transparent 31%),linear-gradient(145deg,#0e314a,#09243a);
  border:1px solid rgba(55,211,209,.32);display:flex;align-items:center;gap:14px;
}
.v64-public-icon{width:54px;height:54px;min-width:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(54,216,209,.10);border:1px solid rgba(54,216,209,.28);color:#66dfe0;font-size:24px;font-weight:900}
.v64-public-main{flex:1}
.v64-public-main small{color:#66dfe0;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;font-weight:900}
.v64-public-main strong{display:block;margin-top:3px;font-size:16px}
.v64-public-main span{display:block;margin-top:4px;color:#9daabc;font-size:10px;line-height:1.4}
.v64-public-go{width:42px;height:42px;border-radius:13px;border:1px solid rgba(54,216,209,.30);background:#09243a;color:#66dfe0;font-size:20px}
.v64-release-card{margin-top:14px;padding:16px;border-radius:19px;background:linear-gradient(145deg,#0b263d,#081f33);border:1px solid rgba(55,211,209,.32)}
.v64-release-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.v64-release-mini{padding:11px;border-radius:13px;background:rgba(5,23,39,.52);border:1px solid rgba(255,255,255,.065)}
.v64-release-mini small{display:block;color:#8fa0b3;font-size:8px;text-transform:uppercase;letter-spacing:.8px}
.v64-release-mini strong{display:block;margin-top:4px;font-size:11px}
.v64-site-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;width:58px;height:58px;border-radius:50%;border:4px solid #061827;background:linear-gradient(145deg,#49e0da,#22bfc1);color:#062034;font-size:28px;z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.32)}
.v64-setting-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:9px;background:#0b263d;border:1px solid rgba(55,211,209,.32)}
.v64-setting-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(54,216,209,.08);color:#66dfe0;font-weight:900}
.v64-setting-main{flex:1}
.v64-setting-main strong{display:block;font-size:13px}
.v64-setting-main span{display:block;color:#9daabc;font-size:10px;margin-top:3px}


/* =========================================================
   V65 — PUBLIC LAUNCH / ANDROID APP EXPERIENCE
   ========================================================= */
:root{
  --v65-bg:#061827;
  --v65-card:#0a2338;
  --v65-card2:#0d2941;
  --v65-line:rgba(59,211,210,.29);
  --v65-teal:#39d8d1;
  --v65-cyan:#6adfe0;
  --v65-text:#f6f8fb;
  --v65-muted:#9dabbb;
}

.v65-launch{
  margin-top:12px;
  padding:18px;
  border-radius:22px;
  background:
    radial-gradient(circle at 92% 0%,rgba(57,216,209,.12),transparent 30%),
    linear-gradient(145deg,#0d3048,#092238);
  border:1px solid var(--v65-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 14px 32px rgba(0,0,0,.18);
}
.v65-launch-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.v65-launch small{
  display:block;
  color:var(--v65-cyan);
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-size:9px;
  font-weight:900;
}
.v65-launch h2{
  margin:5px 0 5px;
  font-size:22px!important;
}
.v65-launch p{
  margin:0;
  color:var(--v65-muted);
  font-size:11px;
  line-height:1.5;
}
.v65-app-badge{
  min-width:52px;height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#11415c,#09283e);
  border:1px solid rgba(106,223,224,.30);
  color:var(--v65-cyan);
  font-size:20px;font-weight:950;
}
.v65-user-modes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:14px;
}
.v65-mode{
  padding:12px 8px;
  border-radius:15px;
  border:1px solid rgba(59,211,210,.17);
  background:rgba(5,24,40,.48);
  color:#dce6ee;
  text-align:center;
  font-size:10px;
  font-weight:750;
}
.v65-mode b{
  width:34px;height:34px;margin:0 auto 7px;
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(57,216,209,.08);
  color:var(--v65-cyan);
  font-size:15px;
}
.v65-mode.active{
  border-color:rgba(57,216,209,.46);
  background:rgba(57,216,209,.085);
}
.v65-start{
  display:grid;
  grid-template-columns:1.35fr 1fr;
  gap:9px;
  margin-top:12px;
}
.v65-start button{
  min-height:48px;
  border-radius:14px;
  font-weight:850;
}
.v65-start-primary{
  border:0;
  background:linear-gradient(135deg,#48ded8,#24bfc3);
  color:#062033;
}
.v65-start-secondary{
  background:#09243a;
  border:1px solid rgba(59,211,210,.25);
  color:#cfe8ea;
}

/* Modern app icon rows */
.v65-shortcuts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:12px;
}
.v65-shortcut{
  min-height:88px;
  padding:10px 6px;
  border-radius:17px;
  border:1px solid rgba(59,211,210,.16);
  background:linear-gradient(145deg,#0c2940,#082137);
  color:#dce6ef;
  font-size:9px;
  font-weight:800;
}
.v65-shortcut .appicon{
  width:40px;height:40px;
  margin:0 auto 7px;
  border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#12415a,#0a2a40);
  border:1px solid rgba(106,223,224,.24);
  color:#66dedc;
  font-size:16px;font-weight:950;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}

/* hide the older release card to reduce duplication */
.v64-release-card{display:none!important}

/* tighter modern section hierarchy */
.v63-section-title{
  font-size:9px!important;
  letter-spacing:1.35px!important;
  color:#62dbd8!important;
}
.v63-module{
  border-color:rgba(59,211,210,.20)!important;
}
.v63-module .ico{
  border:1px solid rgba(59,211,210,.12);
}

/* stronger bottom app navigation */
.bottom-nav{
  background:rgba(5,18,30,.97)!important;
  border-top:1px solid rgba(59,211,210,.13)!important;
  box-shadow:0 -10px 28px rgba(0,0,0,.25)!important;
}
.v64-site-fab{
  background:linear-gradient(145deg,#4ce0da,#22bfc2)!important;
  border-color:#061827!important;
}

@media(max-width:460px){
  .v65-user-modes{grid-template-columns:repeat(3,1fr)}
  .v65-shortcuts{grid-template-columns:repeat(4,1fr)}
  .v65-start{grid-template-columns:1fr}
}


/* =========================================================
   V66 — CLEAR TOOL BOARD GROUPING & SECTION SEPARATION
   ========================================================= */
:root{
  --v66-bg:#061827;
  --v66-group:#081f33;
  --v66-group2:#0b263c;
  --v66-tool:#0c2940;
  --v66-tool2:#0a2338;
  --v66-line:rgba(63,214,212,.26);
  --v66-line-strong:rgba(63,214,212,.42);
  --v66-accent:#45d8d3;
  --v66-text:#f5f8fb;
  --v66-muted:#9aabba;
}

/* Stronger space between tool families */
.section-title{
  margin-top:36px!important;
  margin-bottom:0!important;
  padding:13px 15px!important;
  border:1px solid var(--v66-line)!important;
  border-bottom:0!important;
  border-radius:18px 18px 0 0!important;
  background:linear-gradient(145deg,#0b2a41,#082137)!important;
  color:#dff7f6!important;
  font-size:17px!important;
  font-weight:850!important;
  letter-spacing:-.2px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045)!important;
}

/* The grid directly below a section title becomes one visible tool board */
.section-title + .grid{
  margin-top:0!important;
  padding:13px!important;
  gap:11px!important;
  border:1px solid var(--v66-line)!important;
  border-top:1px solid rgba(63,214,212,.10)!important;
  border-radius:0 0 18px 18px!important;
  background:linear-gradient(145deg,rgba(7,31,51,.96),rgba(6,25,42,.98))!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 14px 28px rgba(0,0,0,.14)!important;
}

/* Individual tool cards are now clearly separated from their board */
.section-title + .grid .tool{
  min-height:112px!important;
  padding:14px!important;
  border-radius:15px!important;
  background:linear-gradient(145deg,#0d2d46,#09243a)!important;
  border:1px solid rgba(255,255,255,.075)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 7px 16px rgba(0,0,0,.13)!important;
  color:#edf4f7!important;
}

/* clear hover / press state */
.section-title + .grid .tool:active{
  border-color:var(--v66-line-strong)!important;
  background:linear-gradient(145deg,#10344d,#0a2941)!important;
  transform:scale(.985)!important;
}

/* Icons act like app icons but no visual confusion */
.section-title + .grid .tool b{
  width:42px!important;
  height:42px!important;
  margin-bottom:10px!important;
  border-radius:12px!important;
  background:rgba(69,216,211,.08)!important;
  border:1px solid rgba(69,216,211,.22)!important;
  color:#6de3df!important;
  -webkit-text-fill-color:#6de3df!important;
  box-shadow:none!important;
}

/* subtle divider inside each tool board */
.section-title + .grid .tool:after{
  content:"";
  position:absolute;
  left:12px;right:12px;bottom:-6px;
  height:1px;
  background:transparent;
}

/* Make wide areas easier to scan */
.grid{
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
}
@media(min-width:560px){
  .section-title + .grid{
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
  }
}
@media(max-width:390px){
  .section-title + .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    padding:10px!important;
    gap:9px!important;
  }
  .section-title + .grid .tool{
    min-height:104px!important;
    padding:12px!important;
  }
}

/* Separate major dashboard modules from tool families */
.v63-section,
.v65-launch,
.v64-public-card,
.v63-budget,
.v63-health,
.v63-kpis,
.v63-project-row,
.v63-panel{
  margin-bottom:14px!important;
}

/* visually stronger divider between dashboard and tools */
.v65-shortcuts{
  margin-bottom:22px!important;
  padding-bottom:18px!important;
  border-bottom:1px solid rgba(63,214,212,.14)!important;
}

/* Make tool section headers feel like navigation categories */
.section-title::after{
  content:"›";
  float:right;
  color:#62deda;
  font-size:19px;
  font-weight:700;
  opacity:.8;
}

/* Remove any old inconsistent section line treatment */
.section-title:before{
  display:none!important;
}

/* Clearer general cards and controls */
.form-card,.list-card,.analytics-card,.stat,.v39-ledger,.v39-source,.v40-card{
  border-color:rgba(63,214,212,.18)!important;
}


/* =========================================================
   V67 — SMART TOOL HUB
   ========================================================= */

:root{
  --v67-bg:#061827;
  --v67-board:#082137;
  --v67-board2:#0a263d;
  --v67-tool:#0d2b43;
  --v67-line:rgba(70,218,215,.25);
  --v67-line2:rgba(255,255,255,.07);
  --v67-teal:#48d9d4;
  --v67-cyan:#72e2df;
  --v67-text:#f4f8fb;
  --v67-muted:#99aaba;
}

/* Stronger visual separation between large functional blocks */
.v67-tools-wrap{
  margin-top:28px;
  padding:0;
  border-radius:22px;
  background:transparent;
}

/* Tool group header becomes a proper board title */
.section-title{
  position:relative!important;
  margin-top:22px!important;
  padding:15px 16px 15px 49px!important;
  border:1px solid var(--v67-line)!important;
  border-radius:18px!important;
  background:linear-gradient(145deg,#0a2a41,#071f34)!important;
  color:#e7f8f7!important;
  font-size:16px!important;
  font-weight:850!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 7px 18px rgba(0,0,0,.12)!important;
  cursor:pointer!important;
}
.section-title:before{
  content:"▦"!important;
  display:flex!important;
  position:absolute!important;
  left:14px!important;
  top:50%!important;
  transform:translateY(-50%)!important;
  width:26px!important;
  height:26px!important;
  border-radius:9px!important;
  align-items:center!important;
  justify-content:center!important;
  background:rgba(72,217,212,.08)!important;
  border:1px solid rgba(72,217,212,.22)!important;
  color:var(--v67-cyan)!important;
  font-size:12px!important;
}
.section-title:after{
  content:"⌄"!important;
  position:absolute!important;
  right:15px!important;
  top:50%!important;
  transform:translateY(-50%)!important;
  color:#7bdedb!important;
  font-size:16px!important;
  opacity:.85!important;
}

/* Tools board below each section */
.section-title + .grid{
  margin:8px 0 18px!important;
  padding:12px!important;
  gap:10px!important;
  border:1px solid rgba(72,217,212,.14)!important;
  border-radius:18px!important;
  background:
    linear-gradient(145deg,rgba(7,31,50,.94),rgba(5,24,40,.98))!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.018),
    0 9px 22px rgba(0,0,0,.11)!important;
  transition:max-height .22s ease, opacity .18s ease, padding .22s ease, margin .22s ease!important;
}

/* Collapsed state */
.section-title.v67-collapsed + .grid{
  max-height:0!important;
  overflow:hidden!important;
  opacity:0!important;
  padding-top:0!important;
  padding-bottom:0!important;
  margin-top:0!important;
  margin-bottom:6px!important;
  border-width:0!important;
}
.section-title.v67-collapsed:after{
  content:"›"!important;
}

/* Individual tools clearer and more app-like */
.section-title + .grid .tool{
  min-height:105px!important;
  padding:13px!important;
  border-radius:16px!important;
  background:linear-gradient(145deg,#0d2d45,#09243a)!important;
  border:1px solid var(--v67-line2)!important;
  color:#eef5f8!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 6px 14px rgba(0,0,0,.11)!important;
}
.section-title + .grid .tool:active{
  border-color:rgba(72,217,212,.42)!important;
  background:linear-gradient(145deg,#10324b,#0b2940)!important;
  transform:scale(.985)!important;
}
.section-title + .grid .tool b{
  width:40px!important;
  height:40px!important;
  margin-bottom:10px!important;
  border-radius:12px!important;
  background:linear-gradient(145deg,#12344d,#0b293f)!important;
  border:1px solid rgba(72,217,212,.20)!important;
  color:#70dfdc!important;
  -webkit-text-fill-color:#70dfdc!important;
  box-shadow:none!important;
}

/* Tool hub quick navigation */
.v67-hub{
  margin:16px 0 20px;
  padding:15px;
  border-radius:20px;
  background:linear-gradient(145deg,#0a263d,#071e32);
  border:1px solid var(--v67-line);
}
.v67-hub-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.v67-hub-head strong{font-size:15px}
.v67-hub-head span{
  color:#83deda;
  font-size:10px;
  font-weight:800;
}
.v67-hub-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.v67-hub-btn{
  min-height:72px;
  padding:9px 5px;
  border-radius:14px;
  border:1px solid rgba(72,217,212,.14);
  background:#092239;
  color:#dce8ed;
  font-size:9px;
  font-weight:800;
}
.v67-hub-btn b{
  display:flex;
  width:31px;height:31px;
  margin:0 auto 6px;
  border-radius:10px;
  align-items:center;
  justify-content:center;
  background:rgba(72,217,212,.08);
  color:#73e2df;
  font-size:13px;
}

/* Extra clarity on major dashboard zones */
.v63-budget,.v63-health,.v63-kpis,.v63-project-row,.v63-section,.v63-panel,
.v65-launch,.v64-public-card,.v67-hub{
  border-color:rgba(72,217,212,.24)!important;
}
.v63-lower,.v63-bottom-grid{
  gap:14px!important;
}

/* Subtle separator between dashboard and tool library */
.v67-library-title{
  margin:30px 0 4px;
  padding-top:20px;
  border-top:1px solid rgba(72,217,212,.16);
  color:#f3f7fa;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}
.v67-library-sub{
  color:#96a8b7;
  font-size:11px;
  margin-bottom:6px;
}

@media(max-width:420px){
  .v67-hub-grid{grid-template-columns:repeat(4,1fr)}
  .section-title + .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
}


/* =========================================================
