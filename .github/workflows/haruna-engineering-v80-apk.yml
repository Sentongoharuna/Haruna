  font-weight:800;
}

.v60-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:19px;
  margin-bottom:9px;
  background:linear-gradient(145deg,#1b2842,#142038);
  border:1px solid var(--v60-line);
}
.v60-icon{
  width:42px;height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
