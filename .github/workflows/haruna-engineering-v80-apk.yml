/* =========================================================
   V53 — COMPLETE MODERN UI REDESIGN
   ========================================================= */
:root{
  --ui-bg:#0b0f14;
  --ui-surface:#11161d;
  --ui-surface-2:#161d25;
  --ui-surface-3:#1d2631;
  --ui-line:rgba(255,255,255,.075);
  --ui-text:#f7f9fb;
  --ui-muted:#93a0ae;
  --ui-accent:#ff9a3d;
  --ui-accent-2:#ffc072;
  --ui-good:#59d8a7;
  --ui-info:#6fc4ff;
  --ui-danger:#ff6b78;
}

html,body{
  background:var(--ui-bg)!important;
}
body{
  background:
    radial-gradient(circle at 88% -8%,rgba(255,154,61,.07),transparent 28%),
    radial-gradient(circle at 6% 32%,rgba(111,196,255,.035),transparent 24%),
    linear-gradient(180deg,#0c1117 0%,#0a0e13 100%)!important;
  color:var(--ui-text)!important;
}
.app{
  max-width:640px!important;
  padding-left:16px!important;
  padding-right:16px!important;
}

/* typography */
.brand{
  background:none!important;
  color:var(--ui-accent)!important;
  -webkit-text-fill-color:var(--ui-accent)!important;
  font-size:10px!important;
  letter-spacing:2.4px!important;
  font-weight:900!important;
}
h1{
  font-size:36px!important;
  line-height:1.02!important;
  letter-spacing:-1.6px!important;
  font-weight:820!important;
}
h2{
  font-size:22px!important;
  letter-spacing:-.6px!important;
  font-weight:780!important;
}
h3,h4{font-weight:730!important}
.subtitle{
  color:var(--ui-muted)!important;
  font-size:14px!important;
  line-height:1.55!important;
}

/* top utility bar */
.v42-topbar{
  gap:8px!important;
  margin:8px 0 14px!important;
}
.v42-search{
  background:#10161d!important;
  border:1px solid var(--ui-line)!important;
  color:#8e9aa8!important;
  border-radius:16px!important;
  padding:14px 15px!important;
  box-shadow:none!important;
}
.v42-icon-btn{
  width:48px!important;height:48px!important;
  border-radius:15px!important;
  background:var(--ui-accent)!important;
  color:#15191e!important;
  -webkit-text-fill-color:#15191e!important;
  border:none!important;
  box-shadow:none!important;
}

/* project selector */
select#projectSelect{
  min-height:56px!important;
  font-size:16px!important;
  font-weight:700!important;
  background:#11171e!important;
  border:1px solid var(--ui-line)!important;
  border-radius:18px!important;
}

/* hero cards */
.v43-shell,.v42-main,.project-card,.v41-result{
  background:linear-gradient(145deg,#131a22,#0f141a)!important;
  border:1px solid var(--ui-line)!important;
  border-radius:24px!important;
  box-shadow:0 18px 40px rgba(0,0,0,.22)!important;
}
.v43-shell{
  padding:18px!important;
}
.v43-ai-label,.v42-kicker,.v32-kicker{
  color:var(--ui-accent)!important;
}
.v43-ai-title{font-size:22px!important}
.v43-insight{
  background:#0d1218!important;
  border:1px solid var(--ui-line)!important;
  color:#c5cdd6!important;
}
.v43-score{
  box-shadow:none!important;
  background:conic-gradient(var(--ui-accent) var(--score),#222b36 0)!important;
}
.v43-score:after{background:#11161d!important}

/* command metric cards */
.v43-command-grid{
  gap:10px!important;
}
.v43-command,.v42-metric{
  background:#151c24!important;
  border:1px solid var(--ui-line)!important;
  border-radius:18px!important;
  box-shadow:none!important;
}
.v43-command{
  min-height:92px!important;
  padding:13px!important;
}
.v43-command small{
  color:#7f8c9b!important;
  font-size:9px!important;
  letter-spacing:1.1px!important;
}
.v43-command strong{
  color:#f8fafb!important;
  font-size:16px!important;
}
.v43-command span{
  color:#8995a3!important;
  font-size:11px!important;
}

/* chips */
.v43-chip,.v32-chip,.pill,.v37-badge,.v38-badge,.v40-badge,.v42-tab{
  background:#161e27!important;
  border:1px solid var(--ui-line)!important;
  color:#a8b3bf!important;
  border-radius:999px!important;
}
.v42-tab.active{
  background:rgba(255,154,61,.12)!important;
  color:var(--ui-accent)!important;
  border-color:rgba(255,154,61,.25)!important;
}

/* section titles */
.section-title{
  margin-top:30px!important;
  padding:0!important;
  border:0!important;
  box-shadow:none!important;
  font-size:18px!important;
  font-weight:800!important;
  color:#eef2f5!important;
}
.section-title:before{display:none!important}

/* tool boards: modern list-card hybrid */
.grid{
  grid-template-columns:1fr 1fr!important;
  gap:10px!important;
}
.tool{
  min-height:108px!important;
  padding:14px!important;
  border-radius:18px!important;
  background:#121820!important;
  border:1px solid var(--ui-line)!important;
  box-shadow:none!important;
  color:#eef3f6!important;
  font-size:12px!important;
  font-weight:700!important;
  line-height:1.3!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-start!important;
  justify-content:flex-start!important;
}
.tool:before{
  content:none!important;
  display:none!important;
}
.tool b{
  width:38px!important;
  height:38px!important;
  margin-bottom:12px!important;
  border-radius:11px!important;
  background:rgba(255,154,61,.08)!important;
  border:1px solid rgba(255,154,61,.22)!important;
  color:var(--ui-accent)!important;
  -webkit-text-fill-color:var(--ui-accent)!important;
  box-shadow:none!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  font-size:15px!important;
}
.tool:active{
  background:#18202a!important;
  border-color:rgba(255,154,61,.28)!important;
  transform:scale(.985)!important;
}

/* forms and secondary cards */
.form-card,.list-card,.analytics-card,.stat,.v39-ledger,.v39-source,.v40-card,.v43-quick{
  background:#121820!important;
  border:1px solid var(--ui-line)!important;
  border-radius:18px!important;
  box-shadow:none!important;
}
input,select,textarea{
  background:#0e141a!important;
  border:1px solid rgba(255,255,255,.085)!important;
  color:#f5f7f9!important;
  border-radius:14px!important;
  min-height:46px!important;
  box-shadow:none!important;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(255,154,61,.46)!important;
  box-shadow:0 0 0 3px rgba(255,154,61,.06)!important;
}
.field label{
  color:#aeb8c2!important;
  font-size:12px!important;
  font-weight:700!important;
}

/* buttons */
.primary,.v42-cta-primary{
  background:var(--ui-accent)!important;
  color:#15191e!important;
  border:none!important;
  border-radius:14px!important;
  font-weight:850!important;
  box-shadow:none!important;
}
.secondary,.v42-cta-secondary{
  background:#171e27!important;
  border:1px solid var(--ui-line)!important;
  color:#dce2e8!important;
  border-radius:14px!important;
  box-shadow:none!important;
}

/* quick actions */
.v43-quickbar{
  gap:8px!important;
}
.v43-quick{
  min-height:70px!important;
  background:#141b23!important;
  border:1px solid var(--ui-line)!important;
  border-radius:15px!important;
  color:#aab5c0!important;
}
.v43-quick b{
  width:34px!important;height:34px!important;
  margin:0 auto 7px!important;
  background:transparent!important;
  border:0!important;
  color:var(--ui-accent)!important;
  -webkit-text-fill-color:var(--ui-accent)!important;
  box-shadow:none!important;
}
.v43-action-rank{
  background:rgba(255,154,61,.07)!important;
  border:1px solid rgba(255,154,61,.18)!important;
  color:var(--ui-accent)!important;
  -webkit-text-fill-color:var(--ui-accent)!important;
}

/* statuses */
.progress{
  background:#1d2630!important;
  border:0!important;
  height:7px!important;
}
.progress>div,.v36-meter div{
  background:var(--ui-accent)!important;
}
.status{
  color:var(--ui-good)!important;
}

/* topbars */
.topbar{
  background:rgba(11,15,20,.86)!important;
  border:0!important;
  border-bottom:1px solid var(--ui-line)!important;
  border-radius:0!important;
  padding:10px 2px 12px!important;
  box-shadow:none!important;
}
.back{
  width:40px!important;height:40px!important;
  background:#151c24!important;
  border:1px solid var(--ui-line)!important;
  color:var(--ui-accent)!important;
  border-radius:12px!important;
}

/* tables */
table{
  background:#10161d!important;
  border:1px solid var(--ui-line)!important;
  border-radius:14px!important;
  overflow:hidden!important;
}
th{
  background:#171e27!important;
  color:#d3dae1!important;
}
td{
  color:#e3e8ed!important;
  border-color:var(--ui-line)!important;
}

/* bottom nav */
.bottom-nav{
  background:rgba(10,13,18,.94)!important;
  border-top:1px solid var(--ui-line)!important;
  box-shadow:0 -8px 24px rgba(0,0,0,.18)!important;
}
.bottom-nav button{
  color:#7f8b99!important;
}
.bottom-nav button.selected{
  background:transparent!important;
  color:var(--ui-accent)!important;
}

/* reduce clutter */
.v42-main:after,.v43-shell:after,.project-card:before,.project-card:after{
  display:none!important;
}
.v35-sync{
  background:#111820!important;
  border:1px solid var(--ui-line)!important;
  color:#b6c0ca!important;
}

/* mobile density */
@media(max-width:420px){
  .grid{gap:9px!important}
  .tool{min-height:104px!important;padding:13px!important}
  h1{font-size:33px!important}
}


