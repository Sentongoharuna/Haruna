   Inspired by modern personal-finance dashboards
   ========================================================= */
.v57-budget{
  margin-top:18px;
  padding:22px;
  border-radius:28px;
  background:linear-gradient(145deg,#223151,#1a2743);
  border:1px solid rgba(255,255,255,.06);
