  --edge-white:rgba(255,255,255,.105);
  --edge-blue:rgba(91,175,255,.12);
}

/* universal illuminated inner edges */
.project-card,.analytics-card,.form-card,.stat,.list-card,.tool,
.v43-shell,.v42-main,.v41-result,.v39-ledger,.v39-source,.v40-card,
