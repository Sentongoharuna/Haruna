      - name: Fix connected test runner lifecycle and select Android 6 smoke suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runner = Path("app/src/androidTest/java/com/sentongoharuna/pulse/DevelopUgandaFiveModeInstrumentation.kt")
          source = runner.read_text()

          # A raw Instrumentation subclass must call start() from onCreate().
          # Without it Android never enters onStart(), so Gradle waits forever.
          class_marker = "class DevelopUgandaFiveModeInstrumentation : Instrumentation() {\n"
          lifecycle = '''
              private var requestedSuite = "full"

              override fun onCreate(arguments: Bundle?) {
                  super.onCreate(arguments)
                  requestedSuite = arguments?.getString("du_suite") ?: "full"
                  start()
              }

          '''
          if "override fun onCreate(arguments: Bundle?)" not in source:
              if source.count(class_marker) != 1:
                  raise SystemExit("NO-HANG FIX STOP: instrumentation class marker changed")
              source = source.replace(class_marker, class_marker + lifecycle, 1)

          # API 35 keeps the complete R6 regression suite. API 23 runs the two
          # startup/capability checks relevant to old and constrained phones.
          if "requestedSuite == \"v275_smoke\"" not in source:
              suite_start = source.find("private fun runSuite()")
              if suite_start < 0:
                  raise SystemExit("NO-HANG FIX STOP: runSuite marker changed")
              before_suite = source[:suite_start]
              suite = source[suite_start:]
              suite, changed = re.subn(
                  r"(?m)^(\s*)val tests(?:\s*:[^=\n]+)?\s*=\s*listOf",
                  r"\1val allTests = listOf",
                  suite,
                  count=1,
              )
              if changed != 1:
                  raise SystemExit("NO-HANG FIX STOP: device test list marker changed")
              source = before_suite + suite
              list_end = "        )\n        grantRuntimePermissions()"
              selection = '''        )
                  val tests = if (requestedSuite == "v275_smoke") {
                      val smokeTests = setOf(
                          "capabilityFallbackStepsDownInsteadOfRefusing",
                          "v275SettingsRouteOpensFieldCamera",
                      )
                      allTests.filter { it.first in smokeTests }.also {
                          require(it.size == smokeTests.size) { "V275 smoke tests are missing" }
                      }
                  } else {
                      allTests
                  }
                  grantRuntimePermissions()'''
              if source.count(list_end) != 1:
                  raise SystemExit("NO-HANG FIX STOP: device test list end changed")
              source = source.replace(list_end, selection, 1)

          for required in (
              "override fun onCreate(arguments: Bundle?)",
              "super.onCreate(arguments)",
              "requestedSuite = arguments?.getString(\"du_suite\") ?: \"full\"",
              "start()",
              "requestedSuite == \"v275_smoke\"",
              "V275 smoke tests are missing",
          ):
              if required not in source:
                  raise SystemExit(f"NO-HANG FIX STOP: missing {required}")
          runner.write_text(source)
          print("CONNECTED TEST RUNNER VERIFIED • ONCREATE STARTS ONSTART • API23 SMOKE SELECTED")
          PY

