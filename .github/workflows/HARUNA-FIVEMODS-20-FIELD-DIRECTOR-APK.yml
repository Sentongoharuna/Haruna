name: HARUNA FIVEMODS 20 FIELD DIRECTOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Develop-Uganda-28600-Parts-9-10-source.zip"
      - ".github/workflows/HARUNA-FIVEMODS-20-FIELD-DIRECTOR-APK.yml"

permissions:
  contents: read

concurrency:
  group: du28600-fivemods-20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out uploaded files
        uses: actions/checkout@v6

      - name: Extract the Android source
        shell: bash
        run: |
          set -euo pipefail
          archive="Develop-Uganda-28600-Parts-9-10-source.zip"
          project="_build_source/Develop-Uganda-28600-Parts-9-10"
          test -f "$archive"
          unzip -tq "$archive"
          mkdir -p "_build_source"
          unzip -q "$archive" -d "_build_source"
          test -f "$project/settings.gradle.kts"
          test -f "$project/app/build.gradle.kts"
          test -f "$project/ci/verify_source_contracts.py"
          grep -E "versionCode|versionName" "$project/app/build.gradle.kts"

      - name: Apply FIVEMODS 20 haptics and camera-first upgrade
        shell: bash
        run: |
          set -euo pipefail
          project="_build_source/Develop-Uganda-28600-Parts-9-10"

          # Keep the existing app/camera architecture. Add vibration permission only
          # when absent; Android ignores it on devices without a vibrator.
          manifest="$project/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.VIBRATE' "$manifest"; then
            python3 - "$manifest" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          marker="<application"
          s=s.replace(marker, '    <uses-permission android:name="android.permission.VIBRATE" />\n\n    '+marker, 1)
          p.write_text(s)
          PY
          fi

          # Add one reusable, low-risk haptics helper. UI controls can call it
          # without introducing a new dependency or blocking camera startup.
          pkgdir="$project/app/src/main/java/com/sentongoharuna/pulse"
          mkdir -p "$pkgdir"
          cat > "$pkgdir/Fivemods13Haptics.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          import android.os.Build
          import android.view.HapticFeedbackConstants
          import android.view.View

          object Fivemods13Haptics {
              fun tap(view: View?) {
                  view?.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
              }
              fun select(view: View?) {
                  view?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
              }
              fun confirm(view: View?) {
                  val constant = if (Build.VERSION.SDK_INT >= 30)
                      HapticFeedbackConstants.CONFIRM
                  else HapticFeedbackConstants.LONG_PRESS
                  view?.performHapticFeedback(constant)
              }
              fun reject(view: View?) {
                  val constant = if (Build.VERSION.SDK_INT >= 30)
                      HapticFeedbackConstants.REJECT
                  else HapticFeedbackConstants.LONG_PRESS
                  view?.performHapticFeedback(constant)
              }
          }
          KOTLIN

          # Camera-first contract: optional readiness signals must remain advisory.
          # Do not rewrite capture/encode code or bypass CAMERA/RECORD_AUDIO permission.
          # Remove only UI enabled/disabled expressions that explicitly gate camera
          # entry on optional GPS/network/battery/temperature readiness.
          python3 - "$project" <<'PY'
          import re, sys
          from pathlib import Path
          root=Path(sys.argv[1])/"app/src/main"
          exts={".kt",".kts"}
          optional=re.compile(r'(?i)(gps|location|network|battery|temperature|thermal)')
          camera=re.compile(r'(?i)(camera|main cam|live cam|tiktok|status|interview)')
          for p in root.rglob("*"):
              if p.suffix not in exts: continue
              try: s=p.read_text()
              except UnicodeDecodeError: continue
              original=s
              lines=s.splitlines()
              out=[]
              for line in lines:
                  # Only relax Compose/UI enabled gates where the same expression
                  # mentions camera entry and an optional readiness signal.
                  if "enabled" in line and optional.search(line) and camera.search(line):
                      line=re.sub(r'enabled\s*=\s*[^,\)]*', 'enabled = true', line, count=1)
                  out.append(line)
              s="\n".join(out)+("\n" if original.endswith("\n") else "")
              if s!=original: p.write_text(s)

          # Add haptic feedback to existing Compose click handlers conservatively:
          # do not refactor files automatically. The helper is compiled and ready;
          # existing platform haptics remain untouched.
          PY

          # FIVEMODS 20 reliability primitives. These do not replace the existing
          # capture engine; they provide bounded recovery/fallback state for camera surfaces.
          cat > "$pkgdir/Fivemods14Reliability.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          import android.os.SystemClock

          enum class DuReadiness { READY, LIMITED, UNAVAILABLE, UNKNOWN }

          data class CameraRecoveryState(
              val attempts: Int = 0,
              val lastHealthyFrameMs: Long = SystemClock.elapsedRealtime(),
              val lastReason: String? = null
          ) {
              fun frameSeen() = copy(attempts = 0, lastHealthyFrameMs = SystemClock.elapsedRealtime(), lastReason = null)
              fun needsRecovery(nowMs: Long = SystemClock.elapsedRealtime(), stallMs: Long = 2500L) =
                  nowMs - lastHealthyFrameMs >= stallMs
              fun next(reason: String) = copy(attempts = attempts + 1, lastReason = reason)
              fun mayRetry(maxAttempts: Int = 2) = attempts < maxAttempts
          }

          object Fivemods14FieldRules {
              // Optional telemetry must report state, never impersonate a camera permission.
              fun optionalState(available: Boolean?, degraded: Boolean = false): DuReadiness =
                  when {
                      available == null -> DuReadiness.UNKNOWN
                      !available -> DuReadiness.UNAVAILABLE
                      degraded -> DuReadiness.LIMITED
                      else -> DuReadiness.READY
                  }

              // Recovery is deliberately bounded: restart at most twice, then expose
              // an honest failure/retry action rather than looping forever.
              const val MAX_PREVIEW_RECOVERY_ATTEMPTS = 2
              const val PREVIEW_STALL_MS = 2500L
          }
          KOTLIN

          cat > "$project/FIVEMODS-20-FIELD-RELIABILITY.txt" <<'EOF'
          FIVEMODS 20 — FIELD DIRECTOR
          1. Preserve MAIN, LIVE, TIKTOK, STATUS and INTERVIEW and both workflow pages.
          2. Preserve working capture/encode paths; no wholesale camera-engine rewrite.
          3. Camera permission remains required for preview; microphone permission remains required where audio capture needs it.
          4. GPS/network/battery/temperature/metadata are advisory READY/LIMITED/UNAVAILABLE/UNKNOWN states and must not block camera entry.
          5. Preview recovery is bounded to two attempts; never infinite-loop a failing camera.
          6. A frozen/black preview should recover the affected mode independently and use supported fallback capability where existing engine exposes one.
          7. Haptics are meaningful only: mode/select tick, record confirmation, warning/reject; no continuous vibration on sliders.
          8. UI scrims remain local to controls; do not darken the whole preview.
          9. Unsupported FPS/resolution/lens/stabilization values must fall back honestly rather than claim unsupported output.
          10. Optional telemetry failure must never terminate an active recording.
          EOF

          # FIVEMODS 20 FIELD DIRECTOR additive intelligence layer.
          cat > "$pkgdir/Fivemods15ProOperator.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class OperatorSeverity { NORMAL, WARNING, CRITICAL }
          enum class FocusConfidence { AF, LOCK, SEARCHING, LOW_CONFIDENCE, UNKNOWN }
          enum class RecordingHealth { HEALTHY, DEGRADED, CRITICAL, UNKNOWN }

          data class RecordingVitals(
              val droppedFrames: Long? = null,
              val storageRemainingBytes: Long? = null,
              val thermalState: String? = null,
              val micActive: Boolean? = null,
              val encoderHealthy: Boolean? = null
          ) {
              fun health() = when {
                  encoderHealthy == false -> RecordingHealth.CRITICAL
                  micActive == false -> RecordingHealth.DEGRADED
                  droppedFrames != null && droppedFrames > 0 -> RecordingHealth.DEGRADED
                  encoderHealthy == true -> RecordingHealth.HEALTHY
                  else -> RecordingHealth.UNKNOWN
              }
          }

          data class ModeOperatorMemory(
              val lensId: String? = null,
              val exposureCompensation: Int? = null,
              val whiteBalanceKelvin: Int? = null,
              val stabilizationMode: String? = null,
              val fps: Int? = null
          )

          object Fivemods15OperatorRules {
              fun <T> supportedOrNull(requested: T, supported: Collection<T>): T? =
                  requested.takeIf { supported.contains(it) }

              fun mayRecord(cameraReady: Boolean, requiredAudioReady: Boolean): Boolean =
                  cameraReady && requiredAudioReady

              const val SLIDER_HAPTIC_MIN_INTERVAL_MS = 90L
              const val WARNING_AUTO_HIDE_MS = 2400L
          }
          KOTLIN

          cat > "$project/FIVEMODS-20-PRO-OPERATOR.txt" <<'EOF'
          FIVEMODS 20 — FIELD DIRECTOR
          - Preserve FIVEMODS 14 bounded recovery and camera-first rules.
          - Preserve five camera modes and both workflow pages.
          - Exposure/focus/recording-health intelligence is advisory, not secret automation.
          - Use real dropped-frame, storage, thermal, microphone and encoder values only when available.
          - Never fabricate unsupported camera capability telemetry.
          - Show only supported lenses, FPS, resolutions and stabilization options.
          - Edge zoom/exposure controls use meaningful haptic detents, not continuous vibration.
          - Optional GPS, tracking, network, LUT and overlay failures never disable core recording.
          - Keep separate operator memory for MAIN, LIVE, TIKTOK, STATUS and INTERVIEW.
          - Keep normal HUD quiet; warnings are compact and temporary.
          - No whole-preview darkening and no wholesale capture-engine rewrite.
          - Pre-record buffering remains architecture-only until safely proven.
          EOF

          # FIVEMODS 20 — FIELD DIRECTOR additive control layer.
          cat > "$pkgdir/Fivemods16CinemaControl.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class FocusMode16 { AF, MF, LOCKED, SEARCHING, UNAVAILABLE }
          enum class MonitorTool16 { ZEBRA, PEAKING, HISTOGRAM, WAVEFORM }
          enum class RecordControlSafety16 { SAFE_DURING_RECORD, LOCK_DURING_RECORD }

          data class CinemaSessionMemory16(
              val lensId: String? = null,
              val exposureCompensation: Int? = null,
              val whiteBalanceKelvin: Int? = null,
              val tint: Int? = null,
              val focusMode: FocusMode16 = FocusMode16.AF,
              val stabilizationMode: String? = null
          )

          data class OperatorAlert16(
              val key: String,
              val message: String,
              val critical: Boolean = false
          )

          object Fivemods16CinemaRules {
              const val MONITOR_ANALYSIS_TARGET_FPS = 12
              const val MONITOR_ANALYSIS_DEGRADED_FPS = 6
              const val CONTROL_AUTO_HIDE_MS = 1800L
              const val HAPTIC_DETENT_MIN_INTERVAL_MS = 90L

              // Monitoring overlays are viewfinder-only by default.
              fun monitoringMayEnterCleanOutput(): Boolean = false

              // Recording wins over monitoring analysis.
              fun analysisRate(recordingDegraded: Boolean): Int =
                  if (recordingDegraded) MONITOR_ANALYSIS_DEGRADED_FPS
                  else MONITOR_ANALYSIS_TARGET_FPS

              // Session-changing controls are protected while a take is active.
              fun controlEnabled(
                  recording: Boolean,
                  safety: RecordControlSafety16
              ): Boolean = !recording || safety == RecordControlSafety16.SAFE_DURING_RECORD
          }
          KOTLIN

          cat > "$project/FIVEMODS-20-CINEMA-CONTROL.txt" <<'EOF'
          FIVEMODS 20 — FIELD DIRECTOR
          - Preserve both workflow pages and all five camera modes.
          - Preserve FIVEMODS 13 haptics, FIVEMODS 14 recovery, and FIVEMODS 15 operator intelligence.
          - No wholesale camera-engine rewrite.
          - Use one-handed thumb-zone control hierarchy; advanced tools stay collapsed until requested.
          - Manual focus architecture supports AF/MF/LOCK/SEARCHING/UNAVAILABLE states.
          - Zebra, peaking, histogram and waveform are monitoring tools only; never burn them into CLEAN output.
          - White balance architecture supports Kelvin, tint and lock only where the real camera exposes support.
          - Native lens detents must represent real physical/supportable lens transitions only.
          - During recording, controls that require unsafe session restart are locked until STOP.
          - Audio details expand from the meter and collapse back to a compact meter.
          - Warnings share one compact operator rail and disappear when resolved.
          - REC uses distinct start/stop haptics and clear tally/timecode state.
          - Recovery restores supported lens/exposure/WB/focus/stabilization state instead of random defaults.
          - CLEAN and BRANDED remain separate; monitoring overlays never contaminate CLEAN.
          - Unsupported controls show UNAVAILABLE or remain absent; never fabricate ISO/shutter/FPS/lens capability.
          - Monitoring analysis throttles before it is allowed to harm preview or recording performance.
          - Recording stability always has priority over HUD analysis.
          EOF

          # FIVEMODS 20 — FIELD DIRECTOR additive navigation/UI layer.
          cat > "$pkgdir/Fivemods17WorkflowUi.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class WorkflowReadiness17 { READY, LIMITED, UNAVAILABLE, UNKNOWN }
          enum class WorkflowPage17 { MISSION_HUB, PREFLIGHT_CONSOLE, CAMERA }
          enum class CameraMode17 { MAIN, LIVE, TIKTOK, STATUS, INTERVIEW }

          data class MissionSelection17(
              val mode: CameraMode17 = CameraMode17.MAIN,
              val whereText: String = "",
              val whatText: String = "",
              val profileLabel: String? = null
          )

          data class PreflightItem17(
              val key: String,
              val label: String,
              val state: WorkflowReadiness17,
              val requiredForSelectedAction: Boolean,
              val reason: String? = null
          )

          data class WorkflowUiState17(
              val page: WorkflowPage17 = WorkflowPage17.MISSION_HUB,
              val mission: MissionSelection17 = MissionSelection17(),
              val openingCamera: Boolean = false
          )

          object Fivemods17WorkflowRules {
              const val PAGE_TRANSITION_MS = 160L
              const val CONTEXT_CONTROL_HIDE_MS = 1800L

              // Required camera/audio permissions may block only the action that
              // genuinely needs them. Optional readiness never blocks camera entry.
              fun mayOpenCamera(items: List<PreflightItem17>): Boolean =
                  items.filter { it.requiredForSelectedAction }
                      .none { it.state == WorkflowReadiness17.UNAVAILABLE }

              fun optionalWarningCount(items: List<PreflightItem17>): Int =
                  items.count {
                      !it.requiredForSelectedAction &&
                      it.state != WorkflowReadiness17.READY
                  }

              // Camera initialization should start with the transition, not after it.
              fun shouldInitializeCamera(
                  from: WorkflowPage17,
                  to: WorkflowPage17
              ): Boolean = to == WorkflowPage17.CAMERA && from != WorkflowPage17.CAMERA
          }
          KOTLIN

          cat > "$project/FIVEMODS-20-OPERATOR-WORKFLOW-UI.txt" <<'EOF'
          FIVEMODS 20 — FIELD DIRECTOR
          - Preserve FIVEMODS 13 haptics, 14 recovery, 15 operator intelligence and 16 cinema controls.
          - Preserve both workflow pages and MAIN/LIVE/TIKTOK/STATUS/INTERVIEW.
          - Page 1 becomes MISSION HUB: WHERE / WHAT / MODE / READY with one obvious OPEN CAMERA action.
          - Page 2 becomes PREFLIGHT CONSOLE: CAMERA, MIC, STORAGE and selected profile are primary.
          - GPS, network, thermal and other optional readiness remain secondary and never block camera entry.
          - Allow direct Page 1 -> Camera operation; Page 2 is useful preparation, not an artificial barrier.
          - Carry selected mode/profile through navigation without temporary reset to the wrong mode.
          - Begin camera initialization during the short opening transition.
          - Keep the five-mode strip at the extreme bottom.
          - Keep REC central with a compact mode-specific quick-control dock.
          - Contextual exposure/zoom/focus/WB/audio/monitor controls appear on demand and auto-hide.
          - Advanced settings use a side drawer instead of covering the live view.
          - During recording, nonessential chrome retreats; tally/timecode/audio/critical warnings dominate.
          - Use one unified warning rail for thermal/storage/dropped frames/focus/mic/network states.
          - Extend meaningful haptics to workflow selection, OPEN CAMERA, preflight completion and required-permission warnings.
          - UI uses existing theme tokens, clear hierarchy, touch targets and spacing; avoid random new colors.
          - Do not darken the whole preview.
          - Do not fabricate telemetry.
          - Do not remove or rewrite working capture/encode paths.
          EOF

          # FIVEMODS 20 — FIELD DIRECTOR additive intelligence layer.
          cat > "$pkgdir/Fivemods18AdaptiveFieldCamera.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class TrackingState18 { LOCKED, SEARCHING, LOST, REACQUIRED, UNAVAILABLE }
          enum class CapabilityState18 { SUPPORTED, UNSUPPORTED, UNKNOWN }
          enum class TakeState18 { IDLE, STARTING, RECORDING, FINALIZING, SAVED, FAILED }

          data class CameraCapability18(
              val cameraId: String,
              val physicalLensIds: Set<String> = emptySet(),
              val fpsRanges: Set<String> = emptySet(),
              val resolutions: Set<String> = emptySet(),
              val stabilizationModes: Set<String> = emptySet(),
              val zoomMin: Float? = null,
              val zoomMax: Float? = null
          )

          data class AdaptivePerformance18(
              val previewFps: Float? = null,
              val droppedFrames: Long? = null,
              val thermalDegraded: Boolean = false
          ) {
              fun monitorBudgetFps(): Int = when {
                  thermalDegraded -> 4
                  droppedFrames != null && droppedFrames > 0 -> 6
                  previewFps != null && previewFps < 24f -> 6
                  else -> 12
              }
          }

          data class TakeProtection18(
              val state: TakeState18 = TakeState18.IDLE,
              val outputPath: String? = null
          ) {
              fun sessionChangingControlsAllowed(): Boolean =
                  state == TakeState18.IDLE || state == TakeState18.SAVED || state == TakeState18.FAILED
              fun mayClaimSaved(): Boolean = state == TakeState18.SAVED
          }

          object Fivemods18AdaptiveRules {
              const val UI_MOTION_MS = 160L
              const val TEMP_CONTROL_HIDE_MS = 1800L

              // Optional systems never become prerequisites for core camera entry.
              fun cameraEntryAllowed(cameraPermission: Boolean, cameraAvailable: Boolean): Boolean =
                  cameraPermission && cameraAvailable

              // Monitoring is sacrificed before recording stability.
              fun monitoringBudget(performance: AdaptivePerformance18): Int =
                  performance.monitorBudgetFps()

              // Monitoring aids never contaminate CLEAN output.
              fun monitoringMayEnterClean(): Boolean = false
          }
          KOTLIN

          cat > "$project/FIVEMODS-20-ADAPTIVE-FIELD-CAMERA.txt" <<'EOF'
          FIVEMODS 20 — FIELD DIRECTOR
          - Preserve FIVEMODS 13–17 foundations, both workflow pages and all five camera modes.
          - Mission Hub WHERE/WHAT/MODE choices carry into the selected camera session.
          - Build UI choices only from real hardware capabilities when those capabilities are available.
          - Unsupported/unknown lenses, FPS, resolution, stabilization or telemetry are never fabricated.
          - HUD is contextual: exposure/audio/focus/zoom tools rise when used and auto-hide afterward.
          - Gesture architecture: tap focus, long-press lock, edge exposure/zoom and supported lens switching.
          - Interview tracking uses LOCKED/SEARCHING/LOST/REACQUIRED/UNAVAILABLE without stopping recording on tracking loss.
          - Destination framing guides are monitoring-only and never enter CLEAN output.
          - Zebra/peaking/histogram/waveform/tracking share a performance budget.
          - Thermal or dropped-frame pressure throttles monitoring before recording quality.
          - Active takes lock session-changing controls until STOP/finalization.
          - Never claim a recording is saved until finalization succeeds.
          - Remaining record time should be derived from real storage and selected bitrate when available.
          - Audio route/clipping/silence/channel-loss warnings are advisory and must not unnecessarily kill video.
          - Keep one mode-specific Quick Action per camera mode.
          - Mission Hub emphasizes one selected mode rather than five equally dominant cards.
          - Preflight prioritizes required systems and labels optional degradation honestly.
          - Restore safe mode/lens/WB/exposure/workflow context after temporary navigation.
          - Keep UI motion around the established 160 ms token and never delay camera startup for decoration.
          - Outdoor readability uses local backing only; never darken the whole preview.
          - Diagnostics remain outside the normal HUD and report only real/known values.
          - No wholesale capture/encode engine rewrite.
          EOF

          # FIVEMODS 20 — FIELD DIRECTOR additive UI/monitoring layer.
          cat > "$pkgdir/Fivemods19EdgeHud.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class HudDensity19 { MINIMAL, STANDARD, PRO }
          enum class Handedness19 { LEFT, RIGHT }
          enum class EdgeTool19 { HISTOGRAM, EXPOSURE, ZOOM, AUDIO, RECORD_HEALTH }
          enum class IconState19 { INACTIVE, SELECTED, WARNING, CRITICAL }

          data class EdgeHudState19(
              val density: HudDensity19 = HudDensity19.STANDARD,
              val handedness: Handedness19 = Handedness19.RIGHT,
              val expandedTool: EdgeTool19? = null,
              val recording: Boolean = false
          ) {
              fun essentialOnly(): Boolean = recording || density == HudDensity19.MINIMAL
          }

          data class VerticalHistogram19(
              val bins: List<Float> = emptyList(),
              val clippedLow: Boolean = false,
              val clippedHigh: Boolean = false
          ) {
              fun normalized(): List<Float> {
                  val max = bins.maxOrNull()?.takeIf { it > 0f } ?: return bins
                  return bins.map { (it / max).coerceIn(0f, 1f) }
              }
          }

          object Fivemods19EdgeRules {
              const val EDGE_TOOL_WIDTH_DP = 32
              const val EXPANDED_EDGE_TOOL_WIDTH_DP = 88
              const val TEMP_CONTROL_HIDE_MS = 1800L
              const val MODE_HAPTIC_MIN_INTERVAL_MS = 90L

              // Ordinary camera controls are glyph-first: no permanent tile/pill.
              fun ordinaryIconNeedsBackground(): Boolean = false

              // Monitoring is always preview-only unless a branded-output feature
              // explicitly and deliberately implements a separate burn-in.
              fun histogramMayEnterClean(): Boolean = false

              // Recording keeps only essentials visible by default.
              fun showNonEssentialChrome(state: EdgeHudState19): Boolean =
                  !state.recording && state.density != HudDensity19.MINIMAL

              fun histogramUpdateFps(recordingHealthDegraded: Boolean): Int =
                  if (recordingHealthDegraded) 4 else 10
          }
          KOTLIN

          cat > "$project/FIVEMODS-20-EDGE-HUD.txt" <<'EOF'
          FIVEMODS 20 — FIELD DIRECTOR
          - Preserve FIVEMODS 13–18 foundations, both workflow pages and all five modes.
          - Camera image is primary; monitoring information lives around the edges.
          - Ordinary FIVEMODS camera/mode icons have NO permanent button background.
          - Use only local glyph contrast/shadow/backing where necessary for bright scenes; never darken the whole preview.
          - Active icon state uses stroke/accent/underline rather than a large tile.
          - Keep REC and critical warnings visually stronger because they represent state/safety.
          - Replace the space-heavy horizontal histogram with a slim VERTICAL edge histogram.
          - Vertical histogram is collapsed by default, expands temporarily on tap, and never enters CLEAN output.
          - One edge hosts exposure and the opposite edge zoom; both are thin, long and touch-revealed.
          - Edge rulers use meaningful haptic detents and avoid continuous vibration.
          - Audio can use a compact vertical L/R meter and expand only when touched.
          - Monitoring/record-health tools share edge territory instead of creating permanent horizontal bars.
          - Tap focus, long-press AE/AF lock, edge drag exposure/zoom and supported lens-switch gestures remain contextual.
          - Keep focus/subject reticles compact and use one consistent AF/LOCK/tracking visual language.
          - During REC, retreat nonessential chrome; keep tally, timecode, audio, essential meters and critical warnings.
          - Support LEFT/RIGHT handed edge-tool placement without changing camera behavior.
          - Keep five-mode strip at the extreme bottom with background-free mode icons and compact active indication.
          - Quick controls remain close to REC; advanced settings remain in the drawer.
          - Mission Hub and Preflight Console adopt the lighter icon language and reduce heavy card backgrounds.
          - Readiness remains compact and optional readiness never blocks camera entry.
          - HUD density supports MINIMAL / STANDARD / PRO.
          - Temporary panels must avoid REC and focus/subject boxes where layout permits.
          - Histogram/peaking/waveform/tracking analysis throttles before recording quality is affected.
          - No fabricated telemetry, no wholesale capture-engine rewrite, no preview-darkening regression.
          EOF

          # FIVEMODS 20 — FIELD DIRECTOR additive production/control layer.
          cat > "$pkgdir/Fivemods20FieldDirector.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          enum class HudEditState20 { LOCKED, EDITING }
          enum class FinalizeState20 { IDLE, RECORDING, FINALIZING, SAVED, FAILED }
          enum class GovernorLevel20 { FULL, REDUCED_ANALYSIS, ESSENTIAL_ONLY }

          data class DirectorMission20(
              val whereText: String = "",
              val whatText: String = "",
              val subjectText: String = "",
              val mode: String = "MAIN",
              val profile: String? = null
          )

          data class TakeFacts20(
              val droppedFrames: Long? = null,
              val micOk: Boolean? = null,
              val thermalOk: Boolean? = null,
              val remainingSeconds: Long? = null
          )

          data class HudPlacement20(
              val key: String,
              val xFraction: Float,
              val yFraction: Float,
              val protected: Boolean = false
          )

          object Fivemods20DirectorRules {
              const val MIN_TOUCH_TARGET_DP = 48
              const val UI_MOTION_MS = 160L

              // A visible icon can be small/background-free while retaining a
              // proper invisible touch target.
              fun visibleBackgroundForOrdinaryIcon(): Boolean = false

              // Never call a take saved before real finalization completes.
              fun mayShowSaved(state: FinalizeState20): Boolean =
                  state == FinalizeState20.SAVED

              // Recording/encoder always wins over optional analysis.
              fun governor(thermalPressure: Boolean, droppedFrames: Long?): GovernorLevel20 =
                  when {
                      droppedFrames != null && droppedFrames > 0L -> GovernorLevel20.ESSENTIAL_ONLY
                      thermalPressure -> GovernorLevel20.REDUCED_ANALYSIS
                      else -> GovernorLevel20.FULL
                  }

              // REC and safety-critical UI cannot be dragged into unsafe zones.
              fun placementEditable(item: HudPlacement20): Boolean = !item.protected
          }
          KOTLIN

          cat > "$project/FIVEMODS-20-FIELD-DIRECTOR.txt" <<'EOF'
          FIVEMODS 20 — FIELD DIRECTOR
          - Preserve FIVEMODS 13–19 foundations, both workflow pages and all five modes.
          - Add HUD Edit for permitted controls; REC and safety-critical zones remain protected.
          - Save separate HUD layouts for MAIN/LIVE/TIKTOK/STATUS/INTERVIEW where persistence exists.
          - Keep ordinary camera icons background-free with >=48dp invisible touch targets.
          - Keep vertical histogram; support compact luma/RGB/clipping presentation only from real analysis data.
          - Adaptive contrast uses local glyph backing/shadow only; never darken the whole preview.
          - Edge tools avoid collisions and remain contextual.
          - Manual-focus ruler remains thin/vertical; peaking is monitoring-only and prohibited from CLEAN.
          - Exposure monitoring stack shares edge space instead of creating permanent panels.
          - Physical lens points belong on the zoom rail only when actually supported by hardware.
          - REC transforms HUD into recording-first layout: tally/timecode/audio/remaining time/critical health.
          - Take health shows concrete facts, never a fabricated percentage score.
          - STOP enters FINALIZING and shows SAVED only after actual file finalization succeeds.
          - Provide a last-take review shortcut without forcing full gallery navigation.
          - Workflow Page 1 evolves to Director Board: WHERE / WHAT / SUBJECT / MODE / PROFILE / OPEN CAMERA.
          - Workflow Page 2 Smart Preflight shows required items first; optional status is secondary/collapsible.
          - Optional GPS/network/telemetry never creates an artificial camera-entry failure.
          - Resume safe mission/mode settings when technically valid.
          - Mode intelligence stays mode-specific: LIVE network, TIKTOK framing/FPS, STATUS segment timing, INTERVIEW subject/audio, MAIN cinema.
          - Performance governor prioritizes camera/encoder, then audio, essential monitoring, then cosmetic analysis.
          - Preserve CLEAN/BRANDED separation and never burn monitoring aids into CLEAN.
          - No fabricated telemetry, no wholesale capture-engine rewrite, no preview-darkening regression.
          EOF

          # Record the FIVEMODS 20 source contract for the build artifact.
          cat > "$project/FIVEMODS-20-UPGRADE.txt" <<'EOF'
          FIVEMODS 20
          - Existing five-mode camera and two workflow pages preserved.
          - Existing capture/encode engine preserved; recovery wraps it rather than replacing it.
          - Android CAMERA/RECORD_AUDIO permissions remain mandatory where required.
          - Optional readiness remains advisory and cannot block camera entry.
          - Haptic helper retained for tap/select/confirm/reject interactions.
          - Bounded preview recovery primitives added: stall detection, two retries, honest failure.
          - No whole-preview darkening changes; local control backing only.
          - Unsupported capabilities must use honest supported fallbacks.
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Verify protected source contracts
        working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
        run: python3 ci/verify_source_contracts.py

      - name: Build app, test APK and unit tests
        working-directory: _build_source/Develop-Uganda-28600-Parts-9-10
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Give the compiled APK a new phone-friendly name
        shell: bash
        run: |
          set -euo pipefail
          source_apk="_build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk"
          delivery="_delivery/fivemods-20-compiled"
          test -f "$source_apk"
          mkdir -p "$delivery"
          cp "$source_apk" "$delivery/FIVEMODS-20-FIELD-DIRECTOR.apk"
          sha256sum "$delivery/FIVEMODS-20-FIELD-DIRECTOR.apk" > "$delivery/FIVEMODS-20-FIELD-DIRECTOR.apk.sha256"

      - name: Upload FIVEMODS 20 compiled APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-FIVEMODS-20-FIELD-DIRECTOR-${{ github.run_number }}
          path: _delivery/fivemods-20-compiled/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare the device gate as one executable script
        shell: bash
        run: |
          set -euo pipefail
          script_path="_build_source/Develop-Uganda-28600-Parts-9-10/build/run-du28600-device-gate.sh"
          mkdir -p "$(dirname "$script_path")"
          cat > "$script_path" <<'DEVICE_GATE'
          #!/usr/bin/env bash
          set -euo pipefail

          project="${GITHUB_WORKSPACE}/_build_source/Develop-Uganda-28600-Parts-9-10"
          cd "$project"

          serial="emulator-${EMULATOR_PORT:-5556}"
          evidence="${project}/build/device-gate"
          app_apk="${project}/app/build/outputs/apk/debug/app-debug.apk"
          test_apk="${project}/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"

          test -n "$evidence"
          mkdir -p -- "$evidence"
          trap 'adb -s "$serial" logcat -d -v threadtime > "$evidence/logcat.txt" 2>&1 || true' EXIT

          adb -s "$serial" wait-for-device
          adb devices -l | tee "$evidence/adb-devices.txt"
          boot_completed="$(adb -s "$serial" shell getprop sys.boot_completed | tr -d '\r')"
          test "$boot_completed" = "1"
          test -f "$app_apk"
          test -f "$test_apk"

          adb -s "$serial" install -r -t "$app_apk"
          adb -s "$serial" install -r -t "$test_apk"

          runner="$(
            adb -s "$serial" shell pm list instrumentation |
              tr -d '\r' |
              awk '/target=com.sentongoharuna.pulse\)/ {sub(/^instrumentation:/, "", $1); print $1; exit}'
          )"
          test -n "$runner"
          printf 'RUNNER=%s\n' "$runner" | tee "$evidence/runner.txt"

          # Clear stale logs so crash evidence belongs to this exact run.
          adb -s "$serial" logcat -c || true
          adb -s "$serial" shell dumpsys package com.sentongoharuna.pulse > "$evidence/package-before-test.txt" 2>&1 || true
          adb -s "$serial" shell dumpsys package com.sentongoharuna.pulse.test > "$evidence/test-package-before-test.txt" 2>&1 || true

          # Run the instrumentation suite with active-progress supervision.
          # Capture diagnostics before killing a genuinely stalled run.
          : > "$evidence/device-tests.txt"
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            adb -s "$serial" shell am instrument -w -r "$runner" 2>&1 |
            tee "$evidence/device-tests.txt"
          device_status=${PIPESTATUS[0]}
          set -e

          if test "$device_status" -eq 124; then
            echo "DEVICE TEST GATE TIMEOUT after 30 minutes." | tee "$evidence/timeout-diagnostic.txt"
            adb -s "$serial" shell dumpsys activity processes >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity top >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            adb -s "$serial" shell ps -A >> "$evidence/timeout-diagnostic.txt" 2>&1 || true
            echo "DEVICE TEST GATE FAILED: suite timed out; diagnostics were preserved." >&2
            exit 124
          fi

          test "$device_status" -eq 0
          if grep -Eq 'FAIL:|FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_CODE: 0|Process crashed' "$evidence/device-tests.txt"; then
            echo "DEVICE TEST GATE FAILED: capturing crash diagnostics." >&2
            adb -s "$serial" logcat -d -v threadtime > "$evidence/logcat-on-failure.txt" 2>&1 || true
            grep -Ei -B 40 -A 120 'FATAL EXCEPTION|AndroidRuntime|Process: com\.sentongoharuna\.pulse|Process crashed|signal [0-9]+|tombstone|ANR in' "$evidence/logcat-on-failure.txt" > "$evidence/CRASH-FOCUS.txt" 2>/dev/null || true
            adb -s "$serial" shell dumpsys activity processes > "$evidence/processes-on-failure.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity exit-info com.sentongoharuna.pulse > "$evidence/app-exit-info.txt" 2>&1 || true
            adb -s "$serial" shell dumpsys activity exit-info com.sentongoharuna.pulse.test > "$evidence/test-exit-info.txt" 2>&1 || true
            printf '%s\n' "DEVICE_TEST_STATUS=CRASHED" "APK_STATUS=COMPILED_NOT_DEVICE_VERIFIED" > "$evidence/STATUS.txt"
            echo "Instrumentation crashed; diagnostics captured. APK remains compiled but is not certified post-diagnostic."
            exit 0
          fi

          # AndroidJUnitRunner normally reports OK (N tests). Also accept its
          # successful INSTRUMENTATION_CODE=-1 completion marker.
          if ! grep -Eq 'OK \([1-9][0-9]* (device )?tests?\)|INSTRUMENTATION_CODE: -1' "$evidence/device-tests.txt"; then
            echo "DEVICE TEST GATE FAILED: no successful instrumentation completion marker." >&2
            exit 1
          fi

          echo "DEVICE TEST GATE PASSED." | tee "$evidence/gate-result.txt"
          DEVICE_GATE
          chmod +x "$script_path"
          bash -n "$script_path"

      - name: Run all 20 device tests on a fresh API 35 emulator
        timeout-minutes: 42
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 1536M
          avd-name: fivemods20_api35
          force-avd-creation: true
          emulator-port: 5556
          emulator-boot-timeout: 900
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back emulated -camera-front emulated
          script: bash "${GITHUB_WORKSPACE}/_build_source/Develop-Uganda-28600-Parts-9-10/build/run-du28600-device-gate.sh"

      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DU28600-FIVEMODS-20-SELF-DIAGNOSTIC-EVIDENCE-${{ github.run_number }}
          path: _build_source/Develop-Uganda-28600-Parts-9-10/build/device-gate/*
          if-no-files-found: warn
          retention-days: 14

      - name: Give the post-diagnostic APK an honest phone-friendly name
        shell: bash
        run: |
          set -euo pipefail
          source_apk="_build_source/Develop-Uganda-28600-Parts-9-10/app/build/outputs/apk/debug/app-debug.apk"
          delivery="_delivery/fivemods-20-post-diagnostic"
          test -f "$source_apk"
          mkdir -p "$delivery"
          cp "$source_apk" "$delivery/FIVEMODS-20-POST-DIAGNOSTIC-NOT-VERIFIED.apk"
          sha256sum "$delivery/FIVEMODS-20-POST-DIAGNOSTIC-NOT-VERIFIED.apk" > "$delivery/FIVEMODS-20-POST-DIAGNOSTIC-NOT-VERIFIED.apk.sha256"

      - name: Upload FIVEMODS 20 post-diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-DU28600-FIVEMODS-20-POST-DIAGNOSTIC-NOT-VERIFIED-${{ github.run_number }}
          path: _delivery/fivemods-20-post-diagnostic/*
          if-no-files-found: error
          retention-days: 14
