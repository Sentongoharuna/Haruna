name: SECTION1 R5 COMMITTED CLEAN HUD APK

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/00-SECTION1-R5-COMMITTED-CLEAN-HUD.yml"
      - "app/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply R5 source correction
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaBroadcastCameraChrome.kt"
          python3 - "$F" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='''            listOf(cleanButton, lockButton, markButton, guideButton, handButton, nightButton, dimButton).forEach {
                controlRail.addView(it, LinearLayout.LayoutParams(unit() * 11, unit() * 6).apply {
                    bottomMargin = unit()
                })
            }
            root.addView(controlRail)
            placeRail()'''
          new='''            // SECTION1-R5: FIVEMODS 12 status strip is the single HUD owner.
            // Legacy controls remain controller-owned but are not mounted over preview.
            controlRail.visibility = View.GONE'''
          if old not in s:
              raise SystemExit("R5 expected legacy HUD block missing")
          s=s.replace(old,new,1)
          s=s.replace('visibility = if (prefs.getBoolean("guides", false)) View.VISIBLE else View.GONE',
                      'visibility = View.GONE',1)
          s=s.replace('listOf(cleanButton, lockButton).forEach { it.rotation = target }',
                      'if (controlRail.visibility == View.VISIBLE) { listOf(cleanButton, lockButton).forEach { it.rotation = target } }',1)
          p.write_text(s)
          PY
          grep -q "SECTION1-R5: FIVEMODS 12 status strip is the single HUD owner" "$F"
          ! grep -q "root.addView(controlRail)" "$F"

      - name: Verify protected contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_source_contracts.py
          P=app/src/main/java/com/sentongoharuna/pulse
          grep -q 'tag = "f12_status_strip"' "$P/DevelopUgandaFivemods12FieldUi.kt"
          grep -q 'recordButton' "$P/DevelopUgandaCameraActivity.kt"

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SECTION1-R5-COMMITTED-CLEAN-HUD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-SECTION1-R5-COMMITTED-CLEAN-HUD
          path: out/SECTION1-R5-COMMITTED-CLEAN-HUD.apk
          if-no-files-found: error
          retention-days: 14
