name: 00 FIVEMODS 12 - Transparent Bottom and Record APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and apply FIVEMODS 12 UI patch
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/sentongoharuna/pulse/MainActivity.kt
          test -f ci/verify_source_contracts.py
          echo '' | base64 -d > /tmp/fivemods12_ui_patch.py
          python3 /tmp/fivemods12_ui_patch.py
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify source contracts
        run: python3 ci/verify_source_contracts.py
      - name: Build APK and unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload FIVEMODS 12 APK
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-12-TRANSPARENT-BOTTOM-RECORD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
