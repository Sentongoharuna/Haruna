name: 00 - FIVEMODS 12.1 APK CONTRACT FIX RUN 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ci/**"
      - "baseline/**"
      - "archive/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "Develop-Uganda-FIVEMODS-12-1-Ordinary-Source.zip"
      - ".github/workflows/UPLOAD-NOW-FIVEMODS-12-1-APK-CONTRACT-FIX-RUN3-20260916.yml"

permissions:
  contents: write

concurrency:
  group: fivemods-12-1-field-ready-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fivemods-12-1:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and materialize ordinary source when needed
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_zip="Develop-Uganda-FIVEMODS-12-1-Ordinary-Source.zip"
          source_hash="a9476f4b9382fb84a041d826454ddc2d4a692597f8c3e80da10c4533b1b96e36"
          source_root_name="Develop-Uganda-FIVEMODS-12-1-Ordinary-Source"

          test -s "$source_zip" || {
            echo "SOURCE MISSING: upload $source_zip to the repository root."
            exit 1
          }
          echo "$source_hash  $source_zip" | sha256sum --check --strict

          staging="$(mktemp -d)"
          trap 'rm -rf -- "$staging"' EXIT
          unzip -q "$source_zip" -d "$staging"
          source_root="$staging/$source_root_name"
          test -f "$source_root/app/build.gradle.kts"
          test -f "$source_root/ci/verify_source_contracts.py"
          test -f "$source_root/SOURCE-MANIFEST-SHA256.txt"
          (
            cd "$source_root"
            sha256sum --check --strict SOURCE-MANIFEST-SHA256.txt
          )

          if test -f app/build.gradle.kts; then
            while read -r expected relative; do
              test -f "$relative" || {
                echo "ORDINARY SOURCE MISSING: $relative"
                exit 1
              }
              actual="$(sha256sum "$relative" | cut -d' ' -f1)"
              test "$actual" = "$expected" || {
                echo "ORDINARY SOURCE DIFFERS FROM HASH-PINNED ARCHIVE: $relative"
                exit 1
              }
            done < "$source_root/SOURCE-MANIFEST-SHA256.txt"
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            echo "Ordinary source is committed and byte-equivalent to the hash-pinned archive."
            exit 0
          fi

          mkdir -p app ci baseline archive build/verification
          rsync -a --delete "$source_root/app/" app/
          rsync -a --delete "$source_root/ci/" ci/
          rsync -a --delete "$source_root/baseline/" baseline/
          rsync -a --delete "$source_root/archive/" archive/
          cp "$source_root/build.gradle.kts" build.gradle.kts
          cp "$source_root/settings.gradle.kts" settings.gradle.kts
          cp "$source_root/gradle.properties" gradle.properties
          cp "$source_root/.gitignore" .gitignore
          cp "$source_root/FIVEMODS12_1_RELEASE_NOTES.md" FIVEMODS12_1_RELEASE_NOTES.md

          while read -r expected relative; do
            test -f "$relative"
            actual="$(sha256sum "$relative" | cut -d' ' -f1)"
            test "$actual" = "$expected" || {
              echo "SOURCE EQUIVALENCE FAILED: $relative"
              exit 1
            }
          done < "$source_root/SOURCE-MANIFEST-SHA256.txt"

          manifest_hash="$(sha256sum "$source_root/SOURCE-MANIFEST-SHA256.txt" | cut -d' ' -f1)"
          cat > build/verification/source-migration-equivalence.json <<EOF
          {
            "result": "PASS",
            "archive_manifest_sha256": "$manifest_hash",
            "ordinary_source_manifest_sha256": "$manifest_hash",
            "embedded_overlay": false,
            "ordinary_files": true
          }
          EOF
          echo "materialized=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36 and emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if test ! -x "$sdkmanager_bin"; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Align named workflow source contract on this runner
        shell: bash
        run: |
          set -euo pipefail
          cp ".github/workflows/UPLOAD-NOW-FIVEMODS-12-1-APK-CONTRACT-FIX-RUN3-20260916.yml" \
             ".github/workflows/00-UPLOAD-THIS-FIVEMODS-12-FAST-APK.yml"

      - name: Verify all protected source contracts
        run: python3 ci/verify_source_contracts.py

      - name: Compile debug app, test APK and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run gated five-mode device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Commit ordinary source after every gate passes
        if: steps.source.outputs.materialized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app ci baseline archive build.gradle.kts settings.gradle.kts gradle.properties .gitignore FIVEMODS12_1_RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit \
            -m "FIVEMODS 12.1: commit ordinary field-ready source" \
            -m "LIVE fault key: develop_uganda_live_camera/audio. A legacy String ON reached the current Boolean read. Retained FIVEMODS 11/12 archives already use Boolean, so the exact older writer build is unavailable and is not guessed. Launch migration repairs existing phones; all preference getters are guarded." \
            -m "Removed duplicate HUD readouts: legacy MODE→F12 MODE, FORMAT→F12 FORMAT, CODEC→F12 CODEC, TC→F12 TC, BAT→F12 BATTERY, FREE→F12 STORAGE, AUDIO→F12 AUDIO. Legacy Camera narration and LIVE top status panels are detached; the F12 status strip is the sole owner." \
            -m "Honest decisions: UNKNOWN warns and proceeds; only measured critical values block. Measured warning thresholds require START ANYWAY and the exact override reason is written to the take sidecar." \
            -m "Instrument chrome is flat: no shader gradients, depth shadows, positive elevation or animated glow rings. CLEAN masters and capture/encoding profiles remain unchanged."
          git push origin HEAD:main

      - name: Name and checksum field-ready APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" 00-FIVEMODS-12-1-FIELD-READY-DEBUG.apk
          sha256sum 00-FIVEMODS-12-1-FIELD-READY-DEBUG.apk > 00-FIVEMODS-12-1-FIELD-READY-DEBUG-SHA256.txt
          {
            echo "APK compile: PASSED"
            echo "Protected source contracts: PASSED"
            echo "Cloud emulator device tests: RAN AND PASSED"
            echo "Signing: Android debug key"
          } > 00-FIVEMODS-12-1-BUILD-STATUS.txt
          {
            echo "### FIVEMODS 12.1 FIELD READY"
            echo "- APK compile: PASSED"
            echo "- Protected source contracts: PASSED"
            echo "- Cloud emulator device tests: RAN AND PASSED"
            echo "- Download artifact: 00-DOWNLOAD-FIVEMODS-12-1-FIELD-READY-APK-RUN-${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload easy-to-find APK
        uses: actions/upload-artifact@v4
        with:
          name: 00-DOWNLOAD-FIVEMODS-12-1-FIELD-READY-APK-RUN-${{ github.run_number }}
          path: |
            00-FIVEMODS-12-1-FIELD-READY-DEBUG.apk
            00-FIVEMODS-12-1-FIELD-READY-DEBUG-SHA256.txt
            00-FIVEMODS-12-1-BUILD-STATUS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIVEMODS-12-1-VERIFICATION-RUN-${{ github.run_number }}
          path: |
            build/verification/**
            app/build/reports/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
