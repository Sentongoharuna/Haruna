name: R6 SECTION5 02A - INTERVIEW HIGH FIDELITY REPORT BURN
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/00-R6-SECTION5-02-INTERVIEW-HIGH-FIDELITY-REPORT-BURN.yml"]
permissions:
  contents: read
concurrency:
  group: r6-section5-02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Restore exact accepted S5.01 forward baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=".github/workflows/00-R6-SECTION5-01-INTERVIEW-BEHAVIORAL-EVIDENCE-ENGINE.yml"
          test -s "$BASE"
          echo "fe79fc9c771e2f5466e7dfe04a310a5ddbd86f38861d466cd4e1b979d4738ecc  $BASE" | sha256sum -c -

          python3 - "$BASE" <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          source = Path(sys.argv[1]).read_text().splitlines()
          scripts = {}
          current_name = None
          index = 0
          while index < len(source):
              line = source[index]
              if line.startswith("      - name: "):
                  current_name = line.split(": ", 1)[1]
              if current_name and line == "        run: |":
                  index += 1
                  body = []
                  while index < len(source):
                      candidate = source[index]
                      if not candidate.strip():
                          body.append("")
                          index += 1
                          continue
                      if not candidate.startswith("          "):
                          break
                      body.append(candidate[10:])
                      index += 1
                  scripts[current_name] = "\n".join(body) + "\n"
                  continue
              index += 1

          recipe = (
              "Restore exact accepted S4.06C forward baseline",
              "Lock immediate S4.06C inputs",
              "Apply S5.01 real Interview evidence engine",
              "S5.01 exact output hashes",
              "S5.01 truth safety and real-data acceptance gate",
              "Prove protected cameras and R6 visuals unchanged",
          )
          missing = [name for name in recipe if name not in scripts]
          if missing:
              raise SystemExit("S5.02 STOP: S5.01 recipe incomplete: " + ", ".join(missing))

          # S5.01 carried one stale navigator checksum. Replaying the locked
          # R6 forward chain deterministically produces 4dba..., whose source
          # is the accepted R4/R5/R6 icon-only, transparent, extreme-bottom
          # navigator. The stale 7540... state restores the older panel,
          # vertical padding and text labels, so accepting it would build
          # backward. Correct only that gate line; never alter source bytes.
          protection_name = "Prove protected cameras and R6 visuals unchanged"
          stale_nav = (
              "7540d06dde1142a431ca3c8d137ac12bf227ade237f4bbae545db86acf367663  "
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt"
          )
          forward_nav = (
              "4dba2231022031c309722d6fb7f72c4906ceda36a5f936b29e23e9bff1cf6c9e  "
              "app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraModeNavigator.kt"
          )
          if scripts[protection_name].count(stale_nav) != 1:
              raise SystemExit("S5.02A STOP: stale S5.01 navigator gate not found exactly once")
          scripts[protection_name] = scripts[protection_name].replace(
              stale_nav,
              forward_nav,
              1,
          )
          environment = os.environ.copy()
          environment.setdefault("GITHUB_RUN_NUMBER", "0")
          for name in recipe:
              print(f"::group::{name}", flush=True)
              subprocess.run(
                  ["bash"],
                  input=scripts[name],
                  text=True,
                  check=True,
                  cwd=Path.cwd(),
                  env=environment,
              )
              print("::endgroup::", flush=True)
          print("EXACT S5.01 FORWARD BASELINE RESTORED • TRUE R6 NAVIGATOR GATE REPAIRED")
          PY

      - name: Lock immediate S5.01 inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'SHA'
          a84b48474f8a49e85b3ebe3d280a10016c0cad7180ae012ccd39e389d1453c83  app/build.gradle.kts
          7e7ddf2a65b431bab84833359e38499a38b816c1f6e516f23666aa7ade79530c  app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt
          cf5caa8e868066f0868f4d066c13f5eee418fcbb2c29b4f4a50a6a35d4512f01  app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt
          1b591475749cd2e48114927334ae2447fac130f50aef38a2c8c1a2bd3c10a6fe  app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewCameraEngine.kt
          43ee9cb94093047f1427af8ec69566fa6ec5d697033cec5bed197f9b4a1cbdca  app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewSignalGraphRenderer.kt
          336caa4df29f95a71c5acc1bd9c4110f9ce15d440da63422e029c8c3786c886a  app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt
          f2695b97610348aeb77bf4597b64ab7ec33e39031506fabc53320be103032457  ci/verify_source_contracts.py
          SHA

