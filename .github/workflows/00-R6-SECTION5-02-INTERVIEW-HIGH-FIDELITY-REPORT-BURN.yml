      - name: Compile Kotlin first
        timeout-minutes: 12
        run: gradle --no-daemon --console=plain --max-workers=2 :app:compileDebugKotlin

      - name: Prove API23 manifest without an emulator
        timeout-minutes: 8
        run: gradle --no-daemon --console=plain --max-workers=2 :app:processDebugMainManifest

      - name: Bounded unit tests and APK build
        timeout-minutes: 20
        run: gradle --no-daemon --console=plain --max-workers=2 :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          OUT="R6-S5-02A-INTERVIEW-HIGH-FIDELITY-REPORT-${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: R6-S5-02A-INTERVIEW-HIGH-FIDELITY-REPORT-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
