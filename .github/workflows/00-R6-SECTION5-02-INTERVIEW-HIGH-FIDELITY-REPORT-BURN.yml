      - name: S5.02 high quality and Interview privacy acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          C="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          X="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaFivemods9DualOutputExporter.kt"
          P="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewCameraEngine.kt"
          G="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaInterviewSignalGraphRenderer.kt"
          M="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaModeProfiles.kt"

          python3 - "$C" "$X" "$P" "$G" "$M" <<'PY'
          from pathlib import Path
          import sys

          camera, exporter, policy, graph, profiles = (Path(p).read_text() for p in sys.argv[1:])

          def selected(text, start, end, label):
              if text.count(start) != 1 or text.count(end) != 1:
                  raise AssertionError(label + " anchors changed")
              begin = text.index(start)
              return text[begin:text.index(end, begin)]

          for token in (
              'ENGINE_ID = "R6-S5.02-HIGH-FIDELITY-INTERVIEW-EVIDENCE"',
              "fun qualityOrder(): List<Quality>",
              "Quality.UHD",
              "Quality.FHD",
              "Quality.HD",
              "Quality.SD",
              "Quality.UHD -> 48_000_000",
              "Quality.FHD -> 30_000_000",
              "Quality.HD -> 14_000_000",
              "TARGET_FPS = 30",
              "exposureCorrectionEv",
          ):
              assert token in policy, "quality policy: " + token

          take = selected(
              camera,
              "    private fun f9CreateTakeMetadata(",
              "\n    private fun f9BurnDetails(",
              "Interview take metadata",
          )
          for token in (
              'operator = if (interviewOnly) "" else reporterName',
              "locationName = if (interviewOnly) null",
              "latitude = if (interviewOnly) null",
              "longitude = if (interviewOnly) null",
              "altitudeM = if (interviewOnly) null",
              "weather = if (interviewOnly) null",
              "shutterNs = if (interviewOnly) null",
              "iso = if (interviewOnly) null",
          ):
              assert token in take, "Interview metadata sanitizer: " + token

          burn = selected(
              camera,
              "    private fun f9BurnDetails(",
              "\n    private fun f9CurrentBurnSample(",
              "Interview burn allowlist",
          )
          interview_burn = burn[:burn.index("        val exposure")]
          for token in (
              "INTERVIEW BEHAVIOURAL SIGNAL REPORT",
              "REPORT ",
              "STORY ",
              "SUBJECT ",
              "GRAPH HEAD • BODY • POSTURE • GAZE • BLINK • EXPRESSION • VOICE • PAUSE",
              "FIGURES CHANGE INDEX • DATA QUALITY • TRACKING UPTIME • FACE LIGHT",
          ):
              assert token in interview_burn, "Interview report token: " + token
          for token in (
              "REPORTER ", "PLACE ", "LAT ", "LON ", "GPS ", "DEVICE ",
              "LENS ", "ISO ", "SHUTTER ", "BAT ", "THERM ", "WX "
          ):
              assert token not in interview_burn, "Interview burn leaked " + token

          sample = selected(
              camera,
              "    private fun f9CurrentBurnSample(",
              "\n    private fun f9CaptureBurnSample(",
              "Interview sample sanitizer",
          )
          for token in (
              'operator = if (interviewOnly) ""',
              "accuracyM = if (interviewOnly) null",
              "headingDeg = if (interviewOnly) null",
              "satellitesUsed = if (interviewOnly) null",
              'device = if (interviewOnly) ""',
              "batteryPct = if (interviewOnly) null",
          ):
              assert token in sample, "Interview sample sanitizer: " + token

          for token in (
              "DevelopUgandaInterviewCameraEngine.qualityOrder()",
              "DevelopUgandaInterviewCameraEngine.bitrateFor(selectedQuality)",
              "!isInterviewCamera() &&",
              "SDR • EVIDENCE NEUTRAL",
              "STAB OFF • MEASUREMENT SAFE",
          ):
              assert token in camera, "Interview capture integration: " + token

          transform = selected(
              exporter,
              "    private fun startTransform(",
              "\n    private fun complete(",
              "BRAND transform",
          )
          for token in (
              "val interviewOnly = request.take.interviewDisclaimer",
              "camera/location telemetry never enters its overlay path",
              "interviewOnly = interviewOnly",
              "interviewTakeId = request.take.takeId",
              "if (interviewOnly) {\n                // Evidence BRAND stays neutral",
              "DETAILED INTERVIEW REPORT BRAND",
              "Preserve every recorded Interview timestamp and frame",
          ):
              assert token in transform, "Interview exporter: " + token
          assert "setFrameRate(" not in transform, "Interview exporter resamples frames"

          overlay = selected(
              exporter,
              "private class DevelopUgandaTimelineDetailBurnOverlay(",
              "\n    private fun sampleIndexAt(",
              "BRAND overlay routing",
          )
          branch = overlay.index("        if (interviewOnly) {")
          return_at = overlay.index("            return", branch)
          generic = overlay.index("        renderer.draw(", branch)
          assert branch < return_at < generic, "general metadata renderer can reach Interview"
          assert "interviewRenderer.draw(" in overlay
          assert "interviewRenderer.drawUnavailable(" in overlay

          for token in (
              "INTERVIEW | MEASURED BEHAVIOURAL SIGNAL REPORT",
              'Metric("HEAD", "HEAD MOVEMENT"',
              'Metric("BODY", "UPPER-BODY MOTION"',
              'Metric("POSTURE", "POSTURE SHIFT"',
              'Metric("GAZE", "GAZE CHANGE"',
              'Metric("BLINK", "BLINK CHANGE"',
              'Metric("EXPRESSION", "EXPRESSION CHANGE"',
              'Metric("VOICE", "VOICE ENERGY CHANGE"',
              'Metric("PAUSE", "PAUSE DURATION"',
              'Metric("CHANGE", "SIGNAL CHANGE INDEX"',
              'Metric("QUALITY", "DATA QUALITY"',
              "FACE LIGHT",
              "HIGHLIGHT CLIP",
              "SAMPLES ",
              "QUESTIONS ",
              "questionMarkersMs",
              "NO TRUTH, DECEPTION OR ANXIETY VERDICT",
          ):
              assert token in graph, "detailed graph: " + token
          for token in (
              '"LAT ', '"LON ', '"GPS ', '"PLACE ', '"REPORTER ', '"DEVICE ',
              '"LENS ', '"ISO ', '"SHUTTER ', '"BAT ', '"THERM ', '"WX '
          ):
              assert token not in graph, "graph contains forbidden metadata row " + token

          assert 'qualityName = "INTERVIEW UHD/FHD"' in profiles
          assert "targetBitrateBps = 48_000_000" in profiles
          assert "4K→FHD SAFE" in profiles
          print("S5.02 HIGH QUALITY + REPORT-ONLY INTERVIEW BRAND • PASS")
          PY

