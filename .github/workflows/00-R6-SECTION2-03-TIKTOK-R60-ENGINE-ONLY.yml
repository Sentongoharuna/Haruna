          from pathlib import Path
          import re,sys

          activity_path,v275_path,lens_path,test_path,manifest_path,gradle_path,helper_path = map(Path,sys.argv[1:])
          activity=activity_path.read_text()
          v275=v275_path.read_text()
          lens=lens_path.read_text()
          tests=test_path.read_text()
          manifest=manifest_path.read_text()
          gradle=gradle_path.read_text()

          helper='''package com.sentongoharuna.pulse

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.util.Log
          import java.util.Locale

          /**
           * Section 2.02 is deliberately runtime-only. It does not own or alter
           * the R6 camera chrome, bottom navigator, or recording-state visuals.
           */
          object DevelopUgandaSection201Compatibility {
              private const val TAG = "DU_S2_02"

              fun repairV275Preferences(context: Context) {
                  repairBooleans(context, "develop_uganda_v275_control_surface", linkedMapOf(
                      "context_highlights" to true,
                      "active_control_highlights" to true,
                      "recent_activity" to true,
                      "large_touch_targets" to false,
                      "high_contrast" to false,
                  ))
                  repairString(context, "develop_uganda_v275_control_surface", "quick_profile", "CUSTOM")

                  repairBooleans(context, "develop_uganda_v271_live_coach_output_master", linkedMapOf(
                      "live_coach" to true,
                      "tap_fix" to true,
                  ))
                  repairString(context, "develop_uganda_v271_live_coach_output_master", "output_mode", "CLEAN")
                  repairString(context, "develop_uganda_v271_live_coach_output_master", "interface_level", "BEGINNER")

                  repairBooleans(context, "develop_uganda_v272_field_sound_continuity", linkedMapOf(
                      "audio_coach" to true,
                      "audio_lock" to true,
                      "continuity_engine" to true,
                      "ghost_overlay" to false,
                  ))
                  repairBooleans(context, "develop_uganda_v273_motion_shot_control", linkedMapOf(
                      "movement_coach" to true,
                      "horizon_assist" to true,
                      "auto_hide_motion_ui" to true,
                  ))
                  repairString(context, "develop_uganda_v273_motion_shot_control", "shot_mode", "HANDHELD")

                  repairBooleans(context, "develop_uganda_v274_media_vault", linkedMapOf(
                      "auto_register" to true,
                      "protect_masters" to true,
                      "health_check" to true,
                  ))
                  repairBooleans(context, "develop_uganda_v276_recording_safety", linkedMapOf(
                      "health_monitor" to true,
                      "finalize_verify" to true,
                      "lock_controls_while_rec" to true,
                      "session_journal" to true,
                      "event_log" to true,
                      "needs_recovery_review" to false,
                      "capture_active" to false,
                  ))
                  repairBooleans(context, "develop_uganda_v277_lighting_exposure", linkedMapOf(
                      "lighting_coach" to true,
                      "face_meter" to true,
                      "highlight_protection" to true,
                      "shadow_protection" to true,
                      "flicker_assist" to true,
                      "spot_meter" to true,
                      "spot_has_point" to false,
                      "snap_flicker" to false,
                      "snap_backlight" to false,
                  ))
                  repairBooleans(context, "develop_uganda_v258_live_workflow_home", linkedMapOf(
                      "live_card_data" to true,
                      "flow_path_motion" to true,
                  ))
              }

              private fun repairBooleans(
                  context: Context,
                  preferenceName: String,
                  defaults: Map<String, Boolean>,
              ) {
                  val preferences = context.duSharedPreferences(preferenceName, Context.MODE_PRIVATE)
                  val values = runCatching { preferences.all }.getOrDefault(emptyMap())
                  val editor = preferences.edit()
                  var changed = false
                  defaults.forEach { (key, defaultValue) ->
                      val raw = values[key]
                      if (raw != null && raw !is Boolean) {
                          editor.putBoolean(key, booleanValue(raw, defaultValue))
                          changed = true
                      }
                  }
                  if (changed) editor.apply()
              }

              private fun repairString(
                  context: Context,
                  preferenceName: String,
                  key: String,
                  defaultValue: String,
              ) {
                  val preferences = context.duSharedPreferences(preferenceName, Context.MODE_PRIVATE)
                  val raw = runCatching { preferences.all[key] }.getOrNull()
                  if (raw != null && raw !is String) {
                      preferences.edit().putString(key, defaultValue).apply()
                  }
              }

              private fun booleanValue(raw: Any, defaultValue: Boolean): Boolean = when (raw) {
                  is Boolean -> raw
                  is Number -> raw.toInt() != 0
                  is String -> when (raw.trim().uppercase(Locale.US)) {
                      "TRUE", "ON", "YES", "Y", "1", "ENABLED" -> true
                      "FALSE", "OFF", "NO", "N", "0", "DISABLED" -> false
                      else -> defaultValue
                  }
                  else -> defaultValue
              }

              fun openCameraAndFinish(
                  activity: Activity,
                  sourceIntent: Intent?,
                  failure: Throwable,
              ) {
                  Log.e(TAG, "V275 settings failed; opening the core camera", failure)
                  val target = Intent(activity, DevelopUgandaAllProCameraActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      runCatching {
                          sourceIntent?.extras?.let { putExtras(Bundle(it)) }
                      }
                      putExtra("section2_v275_fail_open", true)
                  }
                  val opened = runCatching {
                      activity.startActivity(target)
                      true
                  }.getOrDefault(false)
                  if (!opened) {
                      runCatching {
                          activity.packageManager.getLaunchIntentForPackage(activity.packageName)?.let {
                              it.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_NEW_TASK)
                              activity.startActivity(it)
                          }
                      }
                  }
                  activity.finish()
              }
          }
          '''
          helper_path.write_text(helper)

          # Repair legacy String/number preferences before V275 reads them, and
          # make the settings screen fail open to the proven core camera.
          class_start=v275.find("class DevelopUgandaV275CameraSettingsActivity")
          next_class=v275.find("\nclass DevelopUgandaV275WorkflowSettingsActivity",class_start)
          header="    override fun onCreate(savedInstanceState: Bundle?) {"
          method_start=v275.find(header,class_start,next_class)
          if min(class_start,next_class,method_start) < 0:
              raise SystemExit("SECTION2 STOP: V275 camera settings class/onCreate missing")
          if "DevelopUgandaSection201Compatibility.repairV275Preferences(this)" in v275[class_start:next_class]:
              raise SystemExit("SECTION2 STOP: V275 repair already present; refusing a double patch")
          body_start=method_start+len(header)
          method_close=v275.rfind("\n    }",body_start,next_class)
          if method_close < 0:
              raise SystemExit("SECTION2 STOP: V275 onCreate close missing")
          original=v275[body_start:method_close]
          super_anchor="\n        super.onCreate(savedInstanceState)"
          if original.count(super_anchor) != 1:
              raise SystemExit("SECTION2 STOP: V275 super.onCreate anchor missing")
          original=original.replace(
              super_anchor,
              super_anchor+"\n        DevelopUgandaSection201Compatibility.repairV275Preferences(this)",
              1,
          )
          shifted="\n".join(("    "+line if line.strip() else line) for line in original.split("\n"))
          wrapped=(
              header+
              "\n        try {"+
              shifted+
              "\n        } catch (failure: Throwable) {"+
              "\n            DevelopUgandaSection201Compatibility.openCameraAndFinish(this, intent, failure)"+
              "\n        }"+
              "\n    }"
          )
          v275=v275[:method_start]+wrapped+v275[method_close+len("\n    }"):]

          # Prefer the requested lens, then the opposite lens, then any camera
          # exposed by CameraX. No low-grade single-camera phone is rejected
          # merely because it lacks a conventional back/front pairing.
          selector_start=lens.find("    fun selectorFor(")
          selector_end=lens.find("    fun hasCamera(",selector_start)
          if selector_start < 0 or selector_end < 0:
              raise SystemExit("SECTION2 STOP: lens selector anchor missing")
          selector='''    fun selectorFor(
                  provider: ProcessCameraProvider,
                  cameraId: String?,
                  useFront: Boolean
              ): CameraSelector {
                  if (!cameraId.isNullOrBlank()) {
                      provider.availableCameraInfos
                          .firstOrNull { cameraIdOf(it) == cameraId }
                          ?.let { return it.cameraSelector }
                  }

                  val preferred =
                      if (useFront) CameraSelector.DEFAULT_FRONT_CAMERA
                      else CameraSelector.DEFAULT_BACK_CAMERA
                  val alternate =
                      if (useFront) CameraSelector.DEFAULT_BACK_CAMERA
                      else CameraSelector.DEFAULT_FRONT_CAMERA

                  if (runCatching { provider.hasCamera(preferred) }.getOrDefault(false)) {
                      return preferred
                  }
                  if (runCatching { provider.hasCamera(alternate) }.getOrDefault(false)) {
                      return alternate
                  }
                  return provider.availableCameraInfos.firstOrNull()?.cameraSelector ?: preferred
              }

          '''
          lens=lens[:selector_start]+selector+lens[selector_end:]

          # Extend R6's existing requested/available quality negotiation down
          # to CameraX SD and make the emergency retry request SD first.
          replacements=[
              (
                  "listOf(Quality.HD, Quality.FHD, Quality.UHD)",
                  "listOf(Quality.HD, Quality.FHD, Quality.SD, Quality.UHD)",
                  1,
              ),
              (
                  "listOf(Quality.FHD, Quality.HD, Quality.UHD)",
                  "listOf(Quality.FHD, Quality.HD, Quality.SD, Quality.UHD)",
                  1,
              ),
              (
                  "QualitySelector.from(quality)",
                  "QualitySelector.fromOrderedList(\n                                listOf(quality, Quality.SD).distinct(),\n                                FallbackStrategy.lowerQualityOrHigherThan(Quality.SD)\n                            )",
                  1,
              ),
              (
                  'coreDeliveredProfileLabel = "SAFE FALLBACK • 720"',
                  'coreDeliveredProfileLabel = "SAFE FALLBACK • 480"',
                  1,
              ),
              (
                  "fallback to SDR HD.",
                  "fallback to SDR SD.",
                  1,
              ),
              (
                  "known-compatible SDR/HD profile below.",
                  "known-compatible SDR/SD profile below.",
                  1,
              ),
          ]
          for before,after,expected in replacements:
              if activity.count(before) != expected:
                  raise SystemExit("SECTION2 STOP: camera capability anchor count changed: "+before)
              activity=activity.replace(before,after,expected)

          safe_bitrate="coreDeliveredBitrateBps = coreBitrateFor(Quality.HD)"
          if activity.count(safe_bitrate) != 1:
              raise SystemExit("SECTION2 STOP: safe bitrate anchor missing")
          activity=activity.replace(
              safe_bitrate,
              "coreDeliveredBitrateBps = coreBitrateFor(Quality.SD)",
              1,
          )
          safe_quality_pattern=re.compile(
              r'(buildCoreVideoCapture\(\s*\n\s*)Quality\.HD(\s*,\s*\n\s*DynamicRange\.SDR\s*,)'
          )
          activity,safe_quality_count=safe_quality_pattern.subn(
              r'\1Quality.SD\2',
              activity,
              count=1,
          )
          if safe_quality_count != 1:
              raise SystemExit("SECTION2 STOP: safe video fallback anchor missing")
          label_anchor='''quality == Quality.FHD -> "1080"
                  quality == Quality.HD -> "720"'''
          if activity.count(label_anchor) != 1:
              raise SystemExit("SECTION2 STOP: quality label anchor missing")
          activity=activity.replace(
              label_anchor,
              '''quality == Quality.FHD -> "1080"
                  quality == Quality.HD -> "720"
                  quality == Quality.SD -> "480"''',
              1,
          )
          bitrate_anchor='''quality == Quality.FHD -> requested.coerceIn(16_000_000, 24_000_000)
                      quality == Quality.HD -> requested.coerceIn(5_000_000, 14_000_000)'''
          if activity.count(bitrate_anchor) != 1:
              raise SystemExit("SECTION2 STOP: bitrate anchor missing")
          activity=activity.replace(
              bitrate_anchor,
              '''quality == Quality.FHD -> requested.coerceIn(16_000_000, 24_000_000)
                      quality == Quality.HD -> requested.coerceIn(5_000_000, 14_000_000)
                      quality == Quality.SD -> requested.coerceIn(2_000_000, 8_000_000)''',
              1,
          )

          # Android creates this custom Instrumentation but it never entered
          # onStart. Calling start() from onCreate prevents the connected task
          # from remaining yellow forever.
          runner_anchor="    override fun onStart() {"
          if tests.count(runner_anchor) != 1:
              raise SystemExit("SECTION2 STOP: instrumentation onStart anchor missing")
          if "override fun onCreate(arguments: Bundle?)" in tests:
              raise SystemExit("SECTION2 STOP: instrumentation onCreate already exists")
          runner='''    override fun onCreate(arguments: Bundle?) {
                  super.onCreate(arguments)
                  start()
              }

          '''
          tests=tests.replace(runner_anchor,runner+runner_anchor,1)

          # Do not let Play filtering reject phones because they lack a back
          # camera, front camera, flash, autofocus, or microphone feature.
          def make_optional(text,name):
              pattern=re.compile(r'<uses-feature\b[^>]*android:name="'+re.escape(name)+r'"[^>]*/>')
              match=pattern.search(text)
              if match:
                  element=match.group(0)
                  if re.search(r'android:required="[^"]*"',element):
                      element=re.sub(r'android:required="[^"]*"','android:required="false"',element)
                  else:
                      element=element[:-2].rstrip()+' android:required="false"/>'
                  return text[:match.start()]+element+text[match.end():]
              marker="    <queries>"
              if marker not in text:
                  marker="    <application"
              declaration=f'    <uses-feature android:name="{name}" android:required="false"/>\n'
              return text.replace(marker,declaration+"\n"+marker,1)

          for feature in (
              "android.hardware.camera.any",
              "android.hardware.camera",
              "android.hardware.camera.front",
              "android.hardware.camera.autofocus",
              "android.hardware.camera.flash",
              "android.hardware.microphone",
          ):
              manifest=make_optional(manifest,feature)

          gradle=re.sub(
              r'(?m)^(\s*)versionCode\s*=\s*\d+\s*$',
              r'\1versionCode = 28602',
              gradle,
              count=1,
          )
          gradle=re.sub(
              r'(?m)^(\s*)versionName\s*=\s*"[^"]*"\s*$',
              r'\1versionName = "286.02-r6-section2-02-v275-safe-preferences-no-hang"',
              gradle,
              count=1,
          )

          activity_path.write_text(activity)
          v275_path.write_text(v275)
          lens_path.write_text(lens)
          test_path.write_text(tests)
          manifest_path.write_text(manifest)
          gradle_path.write_text(gradle)
          PY

