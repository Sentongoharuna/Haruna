      - name: Section 2.03 hard acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          A="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt"
          R="app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaR60TikTokEngine.kt"
          G="app/build.gradle.kts"
          test -s "$R"
          grep -q 'versionCode = 28603' "$G"
          grep -q '286.03-r6-section2-03-tiktok-r60-engine-only' "$G"
          grep -q 'val camerax = "1.7.0-alpha03"' "$G"
          grep -q 'androidx.camera.media3:media3-effect:1.0.0-alpha04' "$G"
          grep -q 'private fun isTikTokCamera()' "$A"
          grep -q 'DevelopUgandaCameraPage.TIKTOK' "$A"
          grep -q 'if (r60TikTokProfile != null)' "$A"
          grep -q 'UseCaseGroup.Builder()' "$A"
          grep -q 'r60TikTokEffect?.close()' "$A"
          grep -q 'private fun <T : Any> applyIsp(' "$R"
          python3 - "$A" "$R" /tmp/r6-s203-protected.json <<'PY'
          from pathlib import Path
          import hashlib,json,sys

          activity=Path(sys.argv[1]).read_text()
          engine=Path(sys.argv[2]).read_text()
          expected=json.loads(Path(sys.argv[3]).read_text())
          root=Path("app/src/main/java/com/sentongoharuna/pulse")

          def between(text,start_marker,end_marker):
              start=text.index(start_marker)
              end=text.index(end_marker,start)
              return text[start:end].encode()

          protected={
              "additive_routes": (root/"DevelopUgandaAdditiveCameraModes.kt").read_bytes(),
              "mode_profiles": (root/"DevelopUgandaModeProfiles.kt").read_bytes(),
              "live_camera": (root/"DevelopUgandaLiveActivity.kt").read_bytes(),
              "main_activity": (root/"MainActivity.kt").read_bytes(),
              "navigator": (root/"DevelopUgandaCameraModeNavigator.kt").read_bytes(),
              "broadcast_chrome": (root/"DevelopUgandaBroadcastCameraChrome.kt").read_bytes(),
              "f12_field_ui": (root/"DevelopUgandaFivemods12FieldUi.kt").read_bytes(),
              "v275_control": (root/"DevelopUgandaV275ControlSurface.kt").read_bytes(),
              "lens_intelligence": (root/"DevelopUgandaLensIntelligence.kt").read_bytes(),
              "manifest": Path("app/src/main/AndroidManifest.xml").read_bytes(),
              "additive_delivery": between(
                  activity,
                  "    private fun exportAdditiveDelivery(",
                  "    private fun verifyAutomaticSocialMaster(",
              ),
              "visible_action_row": between(
                  activity,
                  'tag = "v237_camera_action_row"',
                  "bottomDeck.addView(actionRow)",
              ),
              "persistent_red_surface": between(
                  activity,
                  "private fun r6ApplyRecordSurface(recordingNow: Boolean)",
                  "private fun makeRecordButton(): Button",
              ),
              "record_button_geometry": between(
                  activity,
                  "private fun makeRecordButton(): Button",
                  "private fun space(width: Int): View",
              ),
          }
          actual={name:hashlib.sha256(data).hexdigest() for name,data in protected.items()}
          if actual != expected:
              changed=sorted(name for name in set(actual)|set(expected) if actual.get(name)!=expected.get(name))
              raise SystemExit("S2.03 ISOLATION FAILURE: "+", ".join(changed))

          exact=(
              "const val TARGET_BITRATE_BPS = 15_000_000",
              "const val CONTRAST = 0.050f",
              "const val SATURATION = 3.0f",
              "const val LIGHTNESS = 0.75f",
              "const val RED_SCALE = 1.009f",
              "const val GREEN_SCALE = 1.003f",
              "const val BLUE_SCALE = 0.998f",
              "QualitySelector.from(Quality.FHD)",
              "Range(profile.fps, profile.fps)",
              "Recorder.VIDEO_CAPABILITIES_SOURCE_CODEC_CAPABILITIES",
              "MediaFormat.MIMETYPE_VIDEO_HEVC",
              "CameraEffect.PREVIEW or CameraEffect.VIDEO_CAPTURE",
              "NOISE_REDUCTION_MODE_OFF",
              "NOISE_REDUCTION_MODE_MINIMAL",
              "EDGE_MODE_HIGH_QUALITY",
              "TONEMAP_MODE_HIGH_QUALITY",
              "COLOR_CORRECTION_MODE_HIGH_QUALITY",
              "COLOR_CORRECTION_ABERRATION_MODE_HIGH_QUALITY",
              "CONTROL_AE_ANTIBANDING_MODE_AUTO",
              "R60 EFFECT -> CLEAN SAFE",
              "R60 NR-OFF -> NR-MIN",
              "R60 COLOR-HQ -> FAST",
              "R60 TONE-HQ -> FAST",
              "R60 EDGE-HQ -> FAST",
              "R60 NR-MIN -> FAST",
              "1080P60 HEVC STAB",
              "1080P60 HEVC NO-STAB",
              "1080P60 H264 STAB",
              "1080P60 H264 NO-STAB",
              "1080P30 H264 STAB",
              "1080P30 H264 NO-STAB",
              "R60 UNIVERSAL SAFE",
          )
          missing=[value for value in exact if value not in engine]
          if missing:
              raise SystemExit("R60 CONTRACT MISSING: "+", ".join(missing))
          forbidden=(
              "CONTROL_AE_TARGET_FPS_RANGE",
              "SENSOR_EXPOSURE_TIME",
              "TONEMAP_CURVE",
              "Sharpen",
              "getSharedPreferences",
          )
          present=[value for value in forbidden if value in engine]
          if present:
              raise SystemExit("R60 FORBIDDEN CONTRACT: "+", ".join(present))

          bind=between(activity,"    private fun bindCamera()","    private fun drawStrongRecordedText(").decode()
          assert "val r60TikTokVideo" in bind
          assert 'isTikTokCamera() && captureModes[captureModeIndex] != "PHOTO"' in bind
          assert "if (r60TikTokProfile != null)" in bind
          assert "} else {\n                    v244ApplyCamera2Controls()" in bind
          assert "DevelopUgandaR60TikTokEngine.applyRuntimeControls(" in bind
          assert activity.count("private fun isTikTokCamera(): Boolean") == 1
          assert activity.count("DevelopUgandaR60TikTokEngine.State()") == 1
          assert "CLEAN MASTER + TIKTOK UPLOAD COPY" in (root/"DevelopUgandaModeProfiles.kt").read_text()
          print("S2.03 VERIFIED • EXACT R60 • TIKTOK ROUTE ONLY • R6 + NON-TIKTOK UNCHANGED")
          PY

