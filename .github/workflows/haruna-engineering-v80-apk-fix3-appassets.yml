name: Build Haruna Engineering V80 APK FIX3 APPASSETS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/haruna-engineering-v80-apk-fix3-appassets.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Haruna Engineering V80 HTML
        shell: bash
        run: |
          mkdir -p appsrc
          if [ -f "haruna_app_v80.html" ]; then
            cp haruna_app_v80.html appsrc/index.html
            echo "Using haruna_app_v80.html"
          elif [ -f ".github/workflows/haruna-engineering-v80-apk.yml" ] && head -n 1 .github/workflows/haruna-engineering-v80-apk.yml | grep -qi '<!DOCTYPE html>'; then
            cp .github/workflows/haruna-engineering-v80-apk.yml appsrc/index.html
            echo "Using existing V80 HTML source from old misnamed workflow file."
          else
            echo "ERROR: Haruna Engineering V80 HTML source not found."
            exit 1
          fi

          test -s appsrc/index.html
          grep -qi "<section id=\"home\" class=\"screen active\">" appsrc/index.html
          grep -qi "HARUNA ENGINEERING V80" appsrc/index.html
          echo "V80 source verified: $(wc -c < appsrc/index.html) bytes"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android app using secure WebViewAssetLoader
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/harunaengineering/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp appsrc/index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HarunaEngineering"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.harunaengineering.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.harunaengineering.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 82
                  versionName "1.0-v80-fix3"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Haruna Engineering</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07111D</item>
                  <item name="android:navigationBarColor">#07111D</item>
                  <item name="android:windowBackground">#07090D</item>
                  <item name="android:colorAccent">#4BD9D4</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#07111D" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#4BD9D4" android:pathData="M24,22h14v25h32v-25h14v64h-14v-25h-32v25h-14z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/harunaengineering/app/MainActivity.java <<'EOF'
          package com.harunaengineering.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(7, 17, 29));
                  getWindow().setNavigationBarColor(Color.rgb(7, 17, 29));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(7, 9, 13));
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  final WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage message) {
                          android.util.Log.d("HarunaEngineering",
                              message.message() + " @" + message.lineNumber());
                          return true;
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Haruna-Engineering-V80-FIX3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haruna-Engineering-V80-FIX3-APK
          path: output/Haruna-Engineering-V80-FIX3.apk
          if-no-files-found: error
          retention-days: 30
