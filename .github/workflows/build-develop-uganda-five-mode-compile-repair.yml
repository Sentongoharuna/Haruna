name: Build develop.uganda five-mode APK compile repair

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/*compile-repair*.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unpack and apply compile repairs
        shell: bash
        run: |
          test -f develop_uganda_five_mode_source.zip
          unzip -q develop_uganda_five_mode_source.zip -d source

          build_file="source/build.gradle.kts"
          policy_file="source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaStatusPolicy.kt"
          test -f "$build_file"
          test -f "$policy_file"

          if grep -Fq 'id("com.android.application") version "8.10.1" apply false' "$build_file"; then
            echo "R8-compatible Android Gradle Plugin already present."
          elif grep -Fq 'id("com.android.application") version "8.9.1" apply false' "$build_file"; then
            sed -i 's/id("com.android.application") version "8.9.1" apply false/id("com.android.application") version "8.10.1" apply false/' "$build_file"
          else
            echo "Expected Android Gradle Plugin version was not found in the source archive." >&2
            exit 1
          fi

          if grep -Fq 'setSelectAllOnFocus(true)' "$policy_file"; then
            echo "Status limit input helper already repaired."
          elif grep -Fq 'selectAllOnFocus = true' "$policy_file"; then
            sed -i 's/selectAllOnFocus = true/setSelectAllOnFocus(true)/' "$policy_file"
          else
            echo "Expected Status Cam input line was not found in the source archive." >&2
            exit 1
          fi

          grep -F 'id("com.android.application") version "8.10.1" apply false' "$build_file"
          grep -F 'setSelectAllOnFocus(true)' "$policy_file"

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: develop-uganda-five-mode-apk-compile-repair
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
